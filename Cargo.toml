[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.18.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/takt"

[workspace.dependencies]
b10x-canon = { git = "https://github.com/beyond10x/canon", tag = "0.6.0" }
b10x-canon-engineering = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.12.0" }
b10x-canon-engineering-assertions = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.12.0" }
b10x-canon-expr = { git = "https://github.com/beyond10x/canon", tag = "0.6.0" }
b10x-loom-sdk = { git = "https://github.com/beyond10x/loom", tag = "0.47.0" }
b10x-substrate-host = { git = "https://github.com/beyond10x/substrate", tag = "0.14.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1-checked = { version = "0.10", default-features = false, features = ["std"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
unsafe-libyaml = "0.2.11"

[profile.dev.package.sha2]
opt-level = 3
