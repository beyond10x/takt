[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/takt"

[workspace.dependencies]
b10x-canon = { git = "https://github.com/beyond10x/canon", tag = "0.6.0" }
b10x-canon-engineering = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.9.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
