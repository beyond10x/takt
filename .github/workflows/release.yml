# Cuts a GitHub Release for every version tag: the tag's provenance is checked, `task check`
# runs on the tagged commit, `takt` is built natively per target, and the archives are published
# with a SHA256SUMS file and the tag's own CHANGELOG section. Manual dispatch exists only to
# backfill an annotated tag that is already cut; a release is driven by the tag push.
#
# Tags are bare SemVer (`0.1.0`). Every third-party action is pinned by commit: the release job
# holds write authority, so neither action code nor the source revision it packages may float.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to backfill
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  provenance:
    name: Verify tag provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - id: release
        name: Tag, Cargo, changelog and checkout agree
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          cargo_version="$(jq -r '.packages[] | select(.name == "b10x-takt-cli") | .version' <<< "$metadata")"
          test "$TAG" = "$cargo_version"
          grep -Eq "^## \[$TAG\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  gate:
    name: Gate the tagged commit
    needs: provenance
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.provenance.outputs.commit }}

  build:
    name: Build ${{ matrix.target }}
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build takt from the locked release
        run: cargo build --release --locked -p b10x-takt-cli --target ${{ matrix.target }}

      - name: Verify the version and package
        shell: bash
        env:
          COMMIT: ${{ needs.provenance.outputs.commit }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          test "$("target/$TARGET/release/takt" --version)" = "takt $VERSION ($COMMIT)"
          name="takt-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cp "target/$TARGET/release/takt" "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          test -s "dist/$name.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish binaries and release notes
    # Every path, the manual backfill included, runs the gate; nothing publishes past a failed
    # or skipped job.
    needs: [provenance, gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          ls takt-*-x86_64-unknown-linux-gnu.tar.gz takt-*-aarch64-unknown-linux-gnu.tar.gz takt-*-aarch64-apple-darwin.tar.gz
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            /^## \[/ { printing = index($0, "## [" version "] ") == 1; if (printing) next }
            printing { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create or backfill the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.provenance.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A backfill uploads every asset onto a release that holds none, or nothing: an
            # asset already published is never replaced, and a release holding some of them
            # cannot take the rest, because a tarball packed again differs from the one
            # published (tar records each file's mtime), so the SHA256SUMS already there would
            # not name it. Such a release fails here, naming what it holds, and is finished by
            # hand.
            published=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if [[ -n "$published" ]]; then
              echo "release $TAG already holds assets; a backfill fills an empty release only:" >&2
              echo "$published" >&2
              exit 1
            fi
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
