# Builds the documentation site from website/ on every push and pull request, checks every page
# at 1440 and 390 px, and on main uploads the exact built site as an artifact for
# b10x-docs-site.yml, which deploys it through beyond10x/website's project-site workflow. Nothing
# here deploys anything or holds a credential.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            docs/site/protocols/package-lock.json

      # website/scripts/generate.mjs builds takt to write the CLI reference from its --help.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Build the Docusaurus site
        run: npm --prefix website ci && npm --prefix website run build

      - name: Check every page at 1440 and 390 px
        run: npm --prefix website run site-check

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-check-screenshots
          path: website/.site-check
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      # The publisher refuses an artifact whose declaration names another repository, commit or
      # base path: a site built for the wrong base path deploys without error and answers 404.
      - name: Declare what was built
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p website/build/.well-known
          printf '{"schema":"b10x-project-site/v1","repository":"takt","commit":"%s","baseUrl":"/takt/"}\n' \
            "$GITHUB_SHA" > website/build/.well-known/b10x-site.json

      - name: Upload the built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
