apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: takt-demo-workspace
  namespace: agents
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: takt-demo-clone
  namespace: agents
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: clone
      image: registry.example/takt:0.22.0
      command: [git, clone, https://github.com/example/my-repo.git, /workspace]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: takt-demo-workspace
