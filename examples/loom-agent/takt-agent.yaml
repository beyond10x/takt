apiVersion: loom.beyond10x.dev/v1alpha1
kind: LoomAgent
metadata:
  name: takt-demo
  namespace: agents
spec:
  image: {repository: registry.example/takt, tag: "0.18.0"}
  command:
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -c
      - mkdir -p "$HOME/.cargo/bin" && exec takt run --repo /workspace "$@"
      - takt
    args: [--config, /config/takt.yaml]
  secretRef: {name: takt-demo-env}
  secretFiles: {name: takt-demo-files, mountPath: /var/run/secrets/takt}
  env:
    - {name: B10X_GATES_POLICY, value: /var/run/secrets/takt/policy.json}
  workspace: {mountPath: /workspace, claimName: takt-demo-workspace}
  configFiles:
    - name: takt.yaml
      content: |
        story: story:add-sub
        hours: 1
        harness: harness
        model: agent
        llm: {path: llm.yaml}
        forge: none
        test_cmd: cargo test --quiet --locked
    - name: llm.yaml
      content: |
        format: llm.routes/1
        endpoints:
          llm:
            base_url: https://llm.example.com/v1
            protocol: responses
            auth: {kind: bearer, secret: env:LLM_API_KEY}
        routes:
          agent: llm/example-model
  agent:
    format: loom.agent/1
    agent:
      id: takt-demo
      name: takt-demo
      brief: Delivers the ready stories of the repository mounted at /workspace.
    model:
      routes: routes.yaml
      roles:
        - {role: agent, model: example-model}
    deploy:
      kubernetes:
        namespace: agents
        service_account: takt-demo
        resources: {cpu: "4", memory: 8Gi}
        egress:
          - {name: llm, host: llm.example.com, port: 443}
          - {name: crates-index, host: index.crates.io, port: 443}
          - {name: crates-static, host: static.crates.io, port: 443}
  routes: {}
