version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: Specification, format, lint and test.
    cmds:
      - ess specify validate --path ess
      - python3 -I scripts/check-citations
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  build:
    desc: Build the takt binary.
    cmds:
      - cargo build --locked -p b10x-takt-cli
