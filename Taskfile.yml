version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: Specification, format, lint and test.
    cmds:
      - ess specify validate --path ess
      - python3 -I scripts/check-citations --require-digests
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  fuzz:
    desc: Run each fuzz target for 60 s on nightly; exits 0 when none crashes.
    dir: fuzz
    cmds:
      - for: [events, harness_reply, case_id, scorecard]
        cmd: mkdir -p target/corpus/{{.ITEM}} && cargo +nightly fuzz run --fuzz-dir . {{.ITEM}} target/corpus/{{.ITEM}} corpus/{{.ITEM}} -- -max_total_time=60

  build:
    desc: Build the takt binary.
    cmds:
      - cargo build --locked -p b10x-takt-cli
