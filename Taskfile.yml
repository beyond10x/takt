version: '3'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: Specification, format, lint and test.
    cmds:
      - ess specify validate --path ess
      - python3 -I scripts/check-citations --require-digests
      - python3 -I scripts/release-notes --check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  check-static:
    desc: The commands of `task check` before its tests; CI runs it as a job of its own.
    cmds:
      - ess specify validate --path ess
      - python3 -I scripts/check-citations --require-digests
      - python3 -I scripts/release-notes --check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test-cli:
    desc: The tests of b10x-takt-cli; with test-library, the tests of `task check`, which CI runs as two jobs.
    cmds:
      - cargo test --locked -p b10x-takt-cli

  test-library:
    desc: The tests of every package but b10x-takt-cli; with test-cli, the tests of `task check`.
    cmds:
      - cargo test --workspace --locked --exclude b10x-takt-cli

  fuzz:
    desc: Run each fuzz target for 60 s on nightly; exits 0 when none crashes.
    dir: fuzz
    cmds:
      - for: [events, harness_reply, case_id, scorecard]
        cmd: mkdir -p target/corpus/{{.ITEM}} && cargo +nightly fuzz run --fuzz-dir . {{.ITEM}} target/corpus/{{.ITEM}} corpus/{{.ITEM}} -- -max_total_time=60

  build:
    desc: Build the takt binary.
    cmds:
      - cargo build --locked -p b10x-takt-cli

  site-build:
    desc: Build the documentation site into website/build; its prebuild writes the status, the charts, the CLI reference and the protocol viewer from the records.
    cmds:
      - npm --prefix website ci --ignore-scripts
      - npm --prefix website run build

  site-check:
    desc: Screenshot every page of the built site at 1440 and 390 px into website/.site-check with headless Chrome; fail on horizontal scroll, text under 12 px (11 px inside charts) or intersecting chart labels.
    cmds:
      - task: site-build
      - npm --prefix website run site-check
