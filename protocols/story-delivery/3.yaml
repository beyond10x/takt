format: protocol/1

protocol:
  id: story.delivery
  revision: 3
  description: >-
    Deliver a planning-store story: implement it, verify the current implementation revision
    with its tests and the repository's gate, open a pull request for it, read its continuous
    integration, and merge it under authority. Accepted once the pull request is merged, or
    abandoned on an explicit decision. Every claim is about the implementation at its current
    revision, so a new commit returns all of them to unknown. A case fixes whether the tests
    must fail before the implementation is edited and whether the gate runs once, after the
    handover, or at every revision; the pull request opens only on a complete change, with test
    paths and implementation paths both changed and the tests and the gate green at one revision.

case:
  inputs:
    tests_first:
      description: >-
        whether the story's tests must fail before the implementation is edited; under required,
        the implementation is edited only while the tests, once written, fail at the current
        revision, or while they pass and the gate or continuous integration fails there
      values: [required, optional]
    gate_on:
      description: >-
        when the repository's gate runs; after the handover, it runs only on a revision whose
        tests pass and whose change is handed over, so once, on the revision that can be handed
        over, and at every revision it runs whenever asked
      values: [after_handover, each_revision]

artifacts:
  intent:
    description: what the story is meant to achieve
  plan:
    description: the intended steps toward the intent
  implementation:
    description: a revision of the code that realizes the plan

evidence_kinds:
  test_result:
    description: >-
      the result of running tests against an implementation revision; its result is pass or fail
  tests_change:
    description: >-
      the record that the story's tests were written, moving the implementation to a new
      revision; it has no result
  gate_result:
    description: >-
      the result of the repository's gate against an implementation revision; its result is pass
      or fail
  pull_request:
    description: >-
      a pull request whose head is an implementation revision, or that revision with only the
      commits that record its approval above it; its result is open
  ci_result:
    description: >-
      the result of continuous integration on an implementation revision; its result is pass or
      fail
  merge_observation:
    description: >-
      the observation that the pull request whose head is an implementation revision, or that
      revision with only the commits that record its approval above it, was merged; its result
      is merged
  handover:
    description: >-
      the harness chose to hand the change over at this implementation revision, with no file
      changed: takt records the choice from the step, as it records a request for an approval.
      The record attests a choice, not that the change is correct: the tests, the gate and
      continuous integration stay validator evidence; it has no result
  change_record:
    description: >-
      whether merging an implementation revision into the base branch's tip would change that
      tip's tree outside .engineering/; its result is ahead or none
  paths_changed:
    description: >-
      which paths an implementation revision changes since the base branch's tip: test paths,
      implementation paths, both or neither; its result is tests_only, implementation_only, both
      or none

claims:
  tests.pass:
    description: the tests pass for the current implementation revision
    true_when:
      evidence:
        kind: test_result
        result: pass
        subject: implementation
  tests.shown_red:
    description: >-
      the story's tests were written, and they fail at the current implementation revision; a run
      about an earlier revision, and a run before the tests were written, say nothing, and an
      edit that moves the implementation to a new revision returns the claim to unknown until
      the tests are run there. The order form over tests_change with a result no such record has
      reads whether any tests_change was recorded, at any revision
    true_when:
      all:
        - not:
            first:
              kind: tests_change
              result: none
              subject: implementation
        - claim: tests.pass
          is: false
  gate.green:
    description: the repository's gate is green for the current implementation revision
    true_when:
      evidence:
        kind: gate_result
        result: pass
        subject: implementation
  pr.opened:
    description: a pull request is open for the current implementation revision
    true_when:
      evidence:
        kind: pull_request
        result: open
        subject: implementation
  ci.green:
    description: continuous integration passes for the current implementation revision
    true_when:
      evidence:
        kind: ci_result
        result: pass
        subject: implementation
  pr.merged:
    description: the pull request for the current implementation revision is merged
    true_when:
      evidence:
        kind: merge_observation
        result: merged
        subject: implementation
  change.handed_over:
    description: >-
      the harness handed the change over at the current implementation revision, saying it is
      complete; a new commit returns it to unknown
    true_when:
      evidence:
        kind: handover
        subject: implementation
  change.made:
    description: >-
      merging the current implementation revision into the base branch's tip would change its
      tree outside .engineering/: there is a change to publish
    true_when:
      evidence:
        kind: change_record
        result: ahead
        subject: implementation
  change.complete:
    description: >-
      the current implementation revision changes both test paths and implementation paths since
      the base, and its tests pass and its gate is green at that same revision
    true_when:
      all:
        - evidence:
            kind: paths_changed
            result: both
            subject: implementation
        - claim: tests.pass
        - claim: gate.green

obligations:
  tests.required:
    description: the tests pass for the current implementation revision
    discharged_when:
      claim: tests.pass
  gate.required:
    description: the repository's gate is green for the current implementation revision
    discharged_when:
      claim: gate.green
  ci.required:
    description: continuous integration passes for the current implementation revision
    discharged_when:
      claim: ci.green
  merge.required:
    description: the pull request for the current implementation revision is merged
    discharged_when:
      claim: pr.merged

actions:
  repository.inspect:
    description: read the repository
    effect: read
  tests.write:
    description: change the tests in the repository's working revision
    effect: write
    may_produce:
      - evidence: tests_change
  implementation.edit:
    description: >-
      change the implementation in the repository's working revision; when the case requires its
      tests first, needs the story's tests written and failing at the current revision, or written
      and passing there with the gate or continuous integration failed there, so a failure no test
      reads (formatting, lint, citations, another platform) is fixed where it is
    effect: write
    precondition:
      any:
        - input: tests_first
          in: [optional]
        - claim: tests.shown_red
        - all:
            - any:
                - claim: gate.green
                  is: false
                - claim: ci.green
                  is: false
            - claim: tests.pass
            - not:
                first:
                  kind: tests_change
                  result: none
                  subject: implementation
  change.handover:
    description: >-
      hand the change over, changing no file, once the story's tests are written and pass and
      the implementation is done; takt records the choice, the repository's gate runs at this
      revision, and a red gate admits implementation.edit again to fix what it names; on a green
      gate the pull request is opened for this revision and its continuous integration read
      once; never at a revision whose tests fail
    effect: read
    precondition:
      all:
        - claim: change.handed_over
          is: unknown
        - any:
            - claim: tests.pass
            - claim: tests.pass
              is: unknown
    may_produce:
      - evidence: handover
  change.read:
    description: >-
      read whether merging the implementation revision into the base branch's tip would change
      its tree outside .engineering/, and which paths it changes; taken once the change is
      handed over
    effect: read
    precondition:
      claim: change.handed_over
    may_produce:
      - evidence: change_record
      - evidence: paths_changed
  tests.run:
    description: run the tests against an implementation revision
    effect: read
    may_produce:
      - evidence: test_result
  gate.run:
    description: >-
      run the repository's gate against an implementation revision; when the case runs the gate
      after the handover, needs the tests passing and the change handed over at the revision
    effect: read
    precondition:
      any:
        - input: gate_on
          in: [each_revision]
        - all:
            - claim: tests.pass
            - claim: change.handed_over
    may_produce:
      - evidence: gate_result
  pr.open:
    description: >-
      push the implementation revision, with the commits that record its approval above it when
      there are any, and open its pull request through the run's forge; needs the
      tests and the gate green, the change handed over at the revision, a merge of it into the
      base branch's tip that would change the tip outside .engineering/, so nothing is opened
      at the seed or for content the base already has, and the change complete, so it opens once,
      on a revision with both test paths and implementation paths changed
    effect: write
    precondition:
      all:
        - claim: tests.pass
        - claim: gate.green
        - claim: change.handed_over
        - claim: change.made
        - claim: change.complete
    may_produce:
      - evidence: pull_request
  ci.read:
    description: >-
      read the continuous integration result for the pull request's head; needs the pull
      request open for the implementation revision
    effect: read
    precondition:
      claim: pr.opened
    may_produce:
      - evidence: ci_result
  repository.merge:
    description: >-
      merge the pull request into the repository's mainline; needs continuous integration green,
      the pull request open and authority to merge, never only a connection to the repository
      host
    effect: write
    precondition:
      all:
        - claim: ci.green
        - claim: pr.opened
    requires:
      - capability: repository.merge
    may_produce:
      - evidence: merge_observation

outcomes:
  accepted:
    description: the story closed with its pull request merged
    requires:
      claim: pr.merged
  abandoned:
    description: the story closed because it was explicitly abandoned
    requires:
      decision: explicitly_abandoned
