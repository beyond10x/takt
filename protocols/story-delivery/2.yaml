format: protocol/1

protocol:
  id: story.delivery
  revision: 2
  description: >-
    Deliver a planning-store story with its tests written first: write the story's tests, run
    them red at that revision (the new tests detect the missing behaviour), then change the
    implementation, verify the revision with its tests and the repository's gate, hand the
    change over, open one pull request for the complete change, read its continuous
    integration once, and merge it under authority. The order is held by preconditions, never
    by prompt text: implementation.edit needs tests.red (the tests failing at a revision whose
    change since the base is to test paths only) or an implementation path already changed, and
    pr.open needs change.complete (a test path and an implementation path both changed since
    the base) with the tests and the gate green at the same revision. A test path is one under
    tests/ or test/, or whose file name matches test_*, *_test.*, *.test.*, *.spec.* or
    *_spec.*; every other path outside .engineering/ is an implementation path. Accepted once
    the pull request is merged, or abandoned on an explicit decision. Every claim is about the
    implementation at its current revision, so a new commit returns all of them to unknown.

artifacts:
  intent:
    description: what the story is meant to achieve
  plan:
    description: the intended steps toward the intent
  implementation:
    description: a revision of the code that realizes the plan

evidence_kinds:
  test_result:
    description: >-
      the result of running tests against an implementation revision; its result is pass or fail
  gate_result:
    description: >-
      the result of the repository's gate against an implementation revision; its result is pass
      or fail
  pull_request:
    description: >-
      a pull request whose head is an implementation revision, or that revision with only the
      commits that record its approval above it; its result is open
  ci_result:
    description: >-
      the result of continuous integration on an implementation revision; its result is pass or
      fail
  merge_observation:
    description: >-
      the observation that the pull request whose head is an implementation revision, or that
      revision with only the commits that record its approval above it, was merged; its result
      is merged
  handover:
    description: >-
      the harness chose to hand the change over at this implementation revision, with no file
      changed: takt records the choice from the step, as it records a request for an approval.
      The record attests a choice, not that the change is correct: the tests, the gate and
      continuous integration stay validator evidence; it has no result
  change_record:
    description: >-
      the shape of the change merging an implementation revision into the base branch's tip
      would publish outside .engineering/: its result is none (no path), tests (test paths
      only), implementation (implementation paths only) or complete (both kinds)

claims:
  tests.pass:
    description: the tests pass for the current implementation revision
    true_when:
      evidence:
        kind: test_result
        result: pass
        subject: implementation
  tests.red:
    description: >-
      the tests fail at the current implementation revision, whose change since the base is to
      test paths only: the new tests detect the missing behaviour
    true_when:
      all:
        - evidence:
            kind: test_result
            result: fail
            subject: implementation
        - evidence:
            kind: change_record
            result: tests
            subject: implementation
  gate.green:
    description: the repository's gate is green for the current implementation revision
    true_when:
      evidence:
        kind: gate_result
        result: pass
        subject: implementation
  pr.opened:
    description: a pull request is open for the current implementation revision
    true_when:
      evidence:
        kind: pull_request
        result: open
        subject: implementation
  ci.green:
    description: continuous integration passes for the current implementation revision
    true_when:
      evidence:
        kind: ci_result
        result: pass
        subject: implementation
  pr.merged:
    description: the pull request for the current implementation revision is merged
    true_when:
      evidence:
        kind: merge_observation
        result: merged
        subject: implementation
  change.handed_over:
    description: >-
      the harness handed the change over at the current implementation revision, saying it is
      complete; a new commit returns it to unknown
    true_when:
      evidence:
        kind: handover
        subject: implementation
  implementation.changed:
    description: >-
      an implementation path changed since the base at the current implementation revision,
      with or without a test path beside it
    true_when:
      any:
        - evidence:
            kind: change_record
            result: implementation
            subject: implementation
        - evidence:
            kind: change_record
            result: complete
            subject: implementation
  change.complete:
    description: >-
      a test path and an implementation path both changed since the base at the current
      implementation revision: the change carries its tests and its implementation
    true_when:
      evidence:
        kind: change_record
        result: complete
        subject: implementation

obligations:
  tests.required:
    description: the tests pass for the current implementation revision
    discharged_when:
      claim: tests.pass
  gate.required:
    description: the repository's gate is green for the current implementation revision
    discharged_when:
      claim: gate.green
  ci.required:
    description: continuous integration passes for the current implementation revision
    discharged_when:
      claim: ci.green
  merge.required:
    description: the pull request for the current implementation revision is merged
    discharged_when:
      claim: pr.merged

actions:
  repository.inspect:
    description: read the repository
    effect: read
  tests.write:
    description: >-
      change the tests in the repository's working revision: the story's first change, made
      before any implementation change
    effect: write
  implementation.edit:
    description: >-
      change the implementation in the repository's working revision; needs the tests red at a
      revision whose change since the base is to test paths only, or an implementation path
      already changed since the base
    effect: write
    precondition:
      any:
        - claim: tests.red
        - claim: implementation.changed
  change.handover:
    description: >-
      hand the change over, changing no file, once it is complete (the story's tests written
      and the implementation done) and no further edit is needed; takt records the choice, and
      the pull request is opened for this revision and its continuous integration read once
    effect: read
    precondition:
      claim: change.handed_over
      is: unknown
    may_produce:
      - evidence: handover
  change.read:
    description: >-
      read the shape of the change merging the implementation revision into the base branch's
      tip would publish outside .engineering/: no path, test paths only, implementation paths
      only, or both; taken at every revision
    effect: read
    may_produce:
      - evidence: change_record
  tests.run:
    description: run the tests against an implementation revision
    effect: read
    may_produce:
      - evidence: test_result
  gate.run:
    description: run the repository's gate against an implementation revision
    effect: read
    may_produce:
      - evidence: gate_result
  pr.open:
    description: >-
      push the implementation revision, with the commits that record its approval above it when
      there are any, and open its pull request through the repository's bot route; needs the
      tests and the gate green, the change handed over and the change complete (a test path and
      an implementation path both changed since the base), all at this revision, so nothing is
      opened at the seed, for a change without its tests or for content the base already has
    effect: write
    precondition:
      all:
        - claim: tests.pass
        - claim: gate.green
        - claim: change.handed_over
        - claim: change.complete
    may_produce:
      - evidence: pull_request
  ci.read:
    description: >-
      read the continuous integration result for the pull request's head; needs the pull
      request open for the implementation revision
    effect: read
    precondition:
      claim: pr.opened
    may_produce:
      - evidence: ci_result
  repository.merge:
    description: >-
      merge the pull request into the repository's mainline; needs continuous integration green,
      the pull request open and authority to merge, never only a connection to the repository
      host
    effect: write
    precondition:
      all:
        - claim: ci.green
        - claim: pr.opened
    requires:
      - capability: repository.merge
    may_produce:
      - evidence: merge_observation

outcomes:
  accepted:
    description: the story closed with its pull request merged
    requires:
      claim: pr.merged
  abandoned:
    description: the story closed because it was explicitly abandoned
    requires:
      decision: explicitly_abandoned
