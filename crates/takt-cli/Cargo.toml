[package]
name = "b10x-takt-cli"
description = "takt: drive a repository's work through engineering protocols, every step validated"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "takt"
path = "src/main.rs"

[dependencies]
b10x-takt = { path = "../takt" }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
b10x-canon-engineering = { workspace = true }
b10x-canon-engineering-assertions = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
