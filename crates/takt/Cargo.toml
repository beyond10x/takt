[package]
name = "b10x-takt"
description = "Composable agentic work: the kernel, the loop and the seams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "takt"
path = "src/lib.rs"

[dependencies]
b10x-canon = { workspace = true }
b10x-canon-engineering = { workspace = true }
b10x-canon-engineering-assertions = { workspace = true }
b10x-canon-expr = { workspace = true }
b10x-loom-sdk = { workspace = true }
llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.16.0" }
llm-credentials = { git = "https://github.com/beyond10x/llm", tag = "0.16.0" }
llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.16.0", features = ["environment", "file"] }
anyhow = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha1-checked = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { version = "1.54", features = ["rt"] }
toml = { workspace = true }
unsafe-libyaml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = { workspace = true }
