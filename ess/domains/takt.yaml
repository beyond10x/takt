  # from its base, never from another case's commits (on a plain branch the base is that branch
  # and the fork is HEAD; on another case's branch the base is that case's recorded base and the
  # fork is the base's tip), with the commit it forked from, the branch the tree was on at open,
  # the revision last pushed through the forge and the pull request opened for it; removed with
  # the case, the tree back on the branch it left. The branch pushed and opened for is computed
  # from the case id, never taken from the file: a `name` the harness rewrote is set right and the
  # observation says so.
  # read from: crates/takt/src/case.rs:430-431
  # read from: crates/takt/src/case.rs:397-424
  # read from: crates/takt/src/case.rs:50-76
  # read from: crates/takt/src/validator.rs:983-987
  # read from: crates/takt/src/validator.rs:1076
  - name: takt.work.CaseBranch
    naming:
      summary: >-
        A case's branch with what the forge has seen of it: the base it forked from and the
        commit pinned there, the branch the tree left, the revision pushed, the pull request
        opened.
    identity:
      name: name
      type: takt.work.BranchName
    fields:
      # The branch the case forked from and the pull request targets; absent when the tree was
      # detached or on a case branch without a recorded base, and then `pr.open` refuses with
      # nothing pushed, never defaults.
      # read from: crates/takt/src/case.rs:404-408
      - name: base
        type: Optional<String>
      # The commit the case's branch forked from, pinned at open: what the gate validator reads
      # the gates document and the project file from, whatever the base branch names later.
      # Absent for a case opened before it was recorded, whose gate then writes no record.
      # read from: crates/takt/src/case.rs:409-413
      # read from: crates/takt/src/validator.rs:508-509
      - name: base_commit
        type: Optional<takt.work.Revision>
      # The branch the tree was on when the case opened, what discarding the case returns to;
      # absent when it was detached.
      # read from: crates/takt/src/case.rs:414-417
      - name: left
        type: Optional<String>
      # read from: crates/takt/src/case.rs:418-421
      - name: pushed
        type: Optional<takt.work.Revision>
      # read from: crates/takt/src/case.rs:422-424
      - name: pull_request
        type: Optional<Integer>
    # The branch exists from the case open until the case is discarded; pushed and the pull
    # request are data on it, not states.
    lifecycle:
      initial: Created
      states: [Created]
      terminal: [Created]

  # A scenario: one story of the scratch repository at a known seed commit, run from a fresh base
  # branch `trial/<n>` cut from that commit, with the predicates findings name against it.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scenario corpus)
  # read from: .engineering/planning/story/scenario-corpus.md
  # A repository declares its scenarios in `.engineering/scenarios.conf`, git's configuration
  # syntax, one section a scenario, `[scenario "<id>"]` with `story` and `seed`, read at a revision
  # (`--declared-on`, `main` when not given) without a checkout. The id is letters, digits, `-`
  # and `_`, so it can name a case and a branch. A section that gives `story` or `seed` twice, or
  # a key takt does not read, is refused: a scenario names exactly one story.
  # read from: crates/takt-cli/src/main.rs:103-105
  # read from: crates/takt-cli/src/main.rs:113-115
  # read from: crates/takt-cli/src/main.rs:865-871
  # read from: crates/takt-cli/src/main.rs:902-904
  - name: takt.work.Scenario
    naming:
      summary: >-
        A story of the scratch repository at a seed commit, run from a fresh trial base each time,
        so every run of it starts from the same state.
    identity:
      name: id
      type: takt.work.ScenarioId
    fields:
      - name: seed
        type: takt.work.Revision
        summary: The commit each run's `trial/<n>` base is cut from.
      - name: story
        type: takt.work.StoryId
        summary: The scratch repository's story the scenario runs.
    relations:
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A scorecard: per case and per run of it, outcome, steps, tokens, refusals, NoProgress and
  # errors and wall time, taken from the runs' events under `.engineering/cases/` only, and a
  # list of the cases with no record. Saved, it holds every run's figures and the version of each
  # metric's definition. Compared with a saved one, scenario by scenario over cases: a scenario
  # is worse when, for some outcome rank, the share of its cases at that rank or better is below
  # the saved share, under the current definition whatever the saved version, or when the saved
  # scorecard has it and this one has no run of it (takt.work.Comparison); a scenario only this
  # one has is not compared; tokens are printed as n, minimum, median and maximum per scenario and
  # side with the difference of the medians, and never make a scenario worse; a metric whose
  # definition's version differs is printed with both figures. Which saved scorecard is the
  # promoted baseline is story:promotion's.
  # A scorecard covers one takt revision, the one its saved file `scorecard-<revision>.json` is
  # named by, decided 2026-10-18; its scenario runs are its rows, each naming its case, held as
  # values (takt.work.ScorecardRow) rather than a relation, since a relation is carried by a field
  # of the entity typed by the target's identity.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  # read from: .engineering/planning/story/scorecard-reader.md
  # read from: .engineering/planning/story/scorecard-reader.md:50-52
  # read from: crates/takt/src/scorecard.rs:1-20
  # read from: crates/takt/src/scorecard.rs:32-45
  # read from: crates/takt/src/scorecard.rs:159-174
  # read from: crates/takt/src/scorecard.rs:599-734
  - name: takt.work.Scorecard
    naming:
      summary: >-
        The figures of a set of scenario runs at one takt revision, each compared with the
        promoted baseline; a promotion reads it.
    identity:
      name: id
      type: takt.work.ScorecardId
    fields:
      - name: format
        type: String
        summary: takt-scorecard/1.
      - name: revision
        type: Optional<takt.work.Revision>
        summary: >-
          The one takt revision the scorecard covers, which names the saved file; absent before it
          is saved.
      - name: named_by
        type: Optional<takt.work.ScorecardNaming>
        summary: What named it.
      - name: metrics
        type: Map<String, Integer>
        summary: Each metric with the version of the definition its figures were taken under.
      - name: rows
        type: List<takt.work.ScorecardRow>
        summary: One a run, in case order, each case's runs in the order they ran.
      - name: no_record
        type: List<takt.work.CaseId>
        summary: The cases with no record, listed and never guessed.
    relations:
      - name: no_record
        kind: references
        target: takt.work.Case
        cardinality: many
        via: no_record
    lifecycle:
      initial: Computed
      states: [Computed]
      terminal: [Computed]

  # A promotion: the takt binary installed for runs, built from a named revision whose scorecard
  # showed no regression. Declared ahead of the code (story:promotion).
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ The judge)
  # read from: .engineering/planning/story/promotion.md
  # The promotion record names the revision the binary embeds and the scorecard it read, and the
  # latest record names the promoted baseline the next turn is compared with; the first is
  # written by `takt promote --baseline-only`, which installs nothing. A promotion is refused when
  # a scenario's outcome is worse than the baseline's (dominance, one case of margin, n=5), a
  # scenario's median of tokens exceeds the baseline's maximum, or another promotion was made the
  # same UTC day, naming it.
  # read from: .engineering/planning/story/promotion.md:35-40
  # read from: .engineering/planning/story/promotion.md:47-49
  # read from: .engineering/planning/story/promotion.md:98
  # Where it is kept, decided 2026-10-18: one JSON file per promotion at
  # `$XDG_STATE_HOME/takt/promotions/<revision>.json` (`~/.local/state/takt/promotions/` without
  # `XDG_STATE_HOME`), outside every repository a candidate changes, which the scorecard-reader
  # review asked for; the latest record by `promoted_at` is the baseline. `promoted_at` is the
  # instant the one-a-UTC-day rule reads, and `kind` tells a `--baseline-only` record (`baseline`)
  # from one that installed a binary (`promotion`).
  # read from: .engineering/planning/story/promotion.md:55-58
  # read from: .engineering/planning/story/promotion.md:79
  # read from: .engineering/planning/story/promotion.md:109
  # One scorecard backs at most one promotion, decided 2026-10-18: one-to-one, the promotion
  # referencing its scorecard. A relation entry carries no bound on the scorecard's side, so the
  # bound is stated here.
  # read from: .engineering/planning/story/promotion.md:53
  # The rule's parameters, n and the margin, are recorded with the scorecard; their fields are
  # declared with the code (story:promotion).
  # read from: .engineering/planning/design/recursive-self-improvement.md:132-138
  - name: takt.work.Promotion
    naming:
      summary: >-
        The takt binary installed for runs, the revision it was built from and the scorecard that
        allowed it.
    identity:
      name: id
      type: takt.work.PromotionId
    fields:
      - name: revision
        type: takt.work.Revision
        summary: The revision the installed binary embeds in `--version`.
      - name: scorecard
        type: takt.work.ScorecardId
      - name: promoted_at
        type: Timestamp
        summary: When the promotion was made, RFC 3339 in UTC; the one-a-UTC-day rule reads it.
      - name: kind
        type: takt.work.PromotionKind
        summary: Whether the record installed a binary or only recorded the baseline.
    relations:
      - name: scorecard
        kind: references
        target: takt.work.Scorecard
        cardinality: one
        via: scorecard
    lifecycle:
      initial: Promoted
      states: [Promoted]
      terminal: [Promoted]

  # A finding: a defect of takt filed in the planning store as one draft story or one open
  # blocker, carrying the reference `finding:<key>`, an `expected_before` predicate a machine can
  # check (a command run on a named scenario, with the exit status or the output it gives while
  # the defect is present) and the path of the run record or review that produced it.
  # `scripts/file-finding` files it through `aep plan artifact new`, refusing a key the store
  # holds and a predicate that does not parse, with nothing written; `scripts/check-finding` runs
  # the predicate in a clone of the scenario's seed with a takt built from a given revision.
  # read from: .engineering/planning/design/recursive-self-improvement.md:81-86
  # read from: .engineering/planning/story/finding-intake.md (§ Domain relations)
  # read from: scripts/file-finding:11-32
  # read from: scripts/file-finding:93
  # read from: scripts/file-finding:156
  # read from: scripts/check-finding:127-154
  # One predicate on one scenario: a body with a second `expected_before` block, or a block that
  # gives `scenario` twice, is malformed and nothing is filed.
  # read from: scripts/file-finding:96
  # read from: scripts/file-finding:101
  # A finding is filed as exactly one store artifact, a story or a blocker, and that artifact is
  # filed for that finding alone (its id is `<kind>:<key>`, the finding's key): one-to-one,
  # decided 2026-10-18, held in `artifact` (takt.work.FindingArtifact). A relation entry needs a
  # field typed by the target's identity, and the story variant sits inside a union beside a
  # blocker this specification does not declare, so no relation to takt.work.Story is declared and
  # the one-to-one is stated here.
  # read from: scripts/file-finding:208
  # read from: .engineering/planning/story/finding-intake.md:51
  - name: takt.work.Finding
    naming:
      summary: >-
        A defect of takt in the planning store, with the predicate that reproduces it on a
        scenario and the record it came from.
    identity:
      name: key
      type: takt.work.FindingKey
    fields:
      - name: artifact
        type: takt.work.FindingArtifact
        summary: The store artifact the finding is, `story:<key>` or `blocker:<key>`.
      - name: scenario
        type: takt.work.ScenarioId
        summary: The scenario the predicate runs on.
      - name: command
        type: String
        summary: >-
          One shell line, run in a fresh clone of the scenario's seed with `$TAKT` the takt binary
          under test.
      - name: exit
        type: Optional<Integer>
        summary: The exit status the command gives while the defect is present.
      - name: output
        type: Optional<String>
        summary: A fixed string the command's output holds while the defect is present.
      - name: source
        type: String
        summary: The run record or review that produced the finding, a path in the repository.
    relations:
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
    lifecycle:
      initial: Filed
      states: [Filed]
      terminal: [Filed]

  # A trial base: the branch `trial/<n>` a scenario run cuts from its scenario's seed commit,
  # after fetching the remote's `trial/*` branches, `<n>` one past the highest `trial/<n>` the
  # checkout then knows, local or remote; a name under `trial/` that is not all digits is no
  # trial base, and a number past the largest is refused, never wrapped. The run pushes it
  # through the bot route with a lease that only lets it create the branch, then opens the case
  # `scenario-<id>-trial-<n>` for the scenario's story, whose pull request targets the trial
  # branch; it is refused before anything is cut when that case or its branch exists, so a trial
  # base has one case, or when the case id is not one `check_id` accepts. A refusal before the
  # push removes the branch and puts the tree back;
  # nothing is reset by a force-push: the next run cuts the
  # next number. The branch records neither its scenario nor its case; the case id names both.
  # read from: crates/takt-cli/src/main.rs:89-98
  # read from: crates/takt-cli/src/main.rs:923-926
  # read from: crates/takt-cli/src/main.rs:954-960
  # read from: crates/takt-cli/src/main.rs:1034-1039
  # read from: .engineering/planning/design/recursive-self-improvement.md:93-95
  - name: takt.work.TrialBranch
    naming:
      summary: >-
        A fresh base `trial/<n>` cut from a scenario's seed for one scenario run, the base its
        case's pull request targets.
    identity:
      name: number
      type: takt.work.TrialNumber
    fields:
      - name: scenario
        type: takt.work.ScenarioId
        summary: The scenario whose run cut it, as the case id names it.
      - name: seed
        type: takt.work.Revision
        summary: The scenario's seed commit the branch was cut at.
      - name: case
        type: takt.work.CaseId
        summary: The case the run opened on it, `scenario-<id>-trial-<n>`.
    relations:
      # A scenario is run many times, each from its own trial base; the base outlives the
      # scenario's declaration, which is read at a revision.
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
      # One trial base, one case; discarding the case returns the tree to the branch it left
      # (takt.work.Case), the trial base, which stays.
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
    # A trial base is cut and pushed once and never moved by takt.
    lifecycle:
      initial: Cut
      states: [Cut]
      terminal: [Cut]

  # The delegation record, `.engineering/delegations.yaml`: the owner's delegations of a grant
  # reserved for the owner to a named agent role, each with its revocation once revoked, read at
  # the base revision like the allow-list, so a candidate's own edit of it counts for nothing.
  # The file is itself a judge surface: adding, widening or revoking a delegation is a change only
  # the owner's grant merges. Until story:judge-guard lands, a delegation is the owner's decision
  # recorded in the planning store. Declared ahead of the code (story:judge-guard).
  # read from: .engineering/planning/story/judge-guard.md:52-58
  # read from: .engineering/planning/story/judge-guard.md:113
  - name: takt.work.DelegationRecord
    naming:
      summary: >-
        The owner's delegations of judge-surface grants to agent roles, each revocable, read at
        the base revision.
    identity:
      name: path
      type: String
    fields:
      - name: delegations
        type: List<takt.work.Delegation>
    # The owner edits the file; takt only reads it at the base, so takt moves no state of it.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # The judge allow-list, `.engineering/judge-allow.yaml`: the paths that are not judge surfaces,
  # every other path being one, read at the base revision. It starts as `docs/**`, `README.md`
  # and `CHANGELOG.md`; adding a path to it is a judge-surface change, and a candidate's own edit
  # of it counts for nothing. Declared ahead of the code (story:judge-guard).
  # read from: .engineering/planning/design/recursive-self-improvement.md:109-110
  # read from: .engineering/planning/story/judge-guard.md:82
  # read from: .engineering/planning/story/judge-guard.md:113
  # UNMAPPED: the file's layout and the pattern syntax its paths are matched with (`docs/**` is
  # a glob; which glob dialect is not named).
  - name: takt.work.JudgeAllowList
    naming:
      summary: >-
        The paths that are not judge surfaces, held at the base revision.
    identity:
      name: path
      type: String
    fields:
      - name: paths
        type: List<String>
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A benchmark task: one task of a pinned subset of a public benchmark (Terminal-Bench 2.0,
  # SWE-bench Verified Mini), named by its dataset, the dataset's version and its id there, so a
  # run of it can be repeated. takt sees what the task exposes, the visible test command its
  # `tests.pass` claim runs; the benchmark's own tests are the held-out acceptance and never
  # enter the case, so no field holds them. The task's text is given to the run as its intent
  # and not copied here. Declared ahead of the code (story:bench-nouns-in-ess).
  # read from: .engineering/planning/design/benchmark-integration.md:22-24
  # read from: .engineering/planning/design/benchmark-integration.md:32-33
  # read from: .engineering/planning/design/benchmark-integration.md:37
  # read from: .engineering/planning/story/bench-task-protocol.md:38
  # Maps to bench.case of the organization's benchmark instrument, one task with its expectations and its hidden tests;
  # and the benchmark subset it belongs to maps to bench.corpus, a set of cases pinned to where
  # they came from: takt's design makes each benchmark a bench corpus.
  # read from: .engineering/planning/design/benchmark-integration.md:28
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:115-158
  # UNMAPPED: how a task names its bench case and corpus. A bench case's id is
  # `<corpus-id>/<case_id>`, and a corpus is pinned by a 40-hex `source_commit` where a
  # benchmark names a dataset version; nothing says how one is derived from the other, so no
  # field carries a bench id.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:132-134
  # UNMAPPED: whether takt's own scenarios (takt.work.Scenario) are benchmark tasks too, so that
  # a task references a scenario, and which benchmark tasks join the scenarios the scorecard
  # judges, are not decided.
  # read from: .engineering/planning/design/benchmark-integration.md:41
  # read from: .engineering/planning/story/bench-run-export.md:23
  - name: takt.work.BenchTask
    naming:
      summary: >-
        One task of a pinned benchmark subset, with the visible test command takt may run; the
        benchmark's own tests stay held out.
    identity:
      name: id
      type: takt.work.BenchTaskId
    fields:
      - name: dataset
        type: String
        summary: >-
          The benchmark's dataset as its harness takes it, such as
          `terminal-bench/terminal-bench-2` or `MariusHobbhahn/swe-bench-verified-mini`.
      - name: dataset_version
        type: String
        summary: The version of the dataset the task was pinned from.
      - name: test_command
        type: String
        summary: The visible test command the run's `tests.pass` claim runs.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A benchmark run: one benchmark task under one arm, once, recorded raw as one line of
  # `docs/metrics/bench-runs.jsonl` as a scenario run is: the task, the arm, takt's revision
  # (absent for a free arm and where it was not recorded), the verdict, the raw usage, the wall
  # time with resumes included, and the directory holding the run's case and events. A line is
  # appended and never rewritten. Declared ahead of the code (story:bench-nouns-in-ess).
  # read from: .engineering/planning/design/benchmark-integration.md:36
  # read from: .engineering/planning/story/bench-run-export.md:23
  # read from: docs/metrics/README.md:4-5
  # read from: docs/metrics/README.md:45
  # read from: docs/metrics/README.md:47
  # Maps to bench.run of the organization's benchmark instrument, one arm of one case on one harness, once: takt exports
  # each run in bench's run shape, so bench's grader and fact table cover takt beside the other
  # harnesses.
  # read from: .engineering/planning/design/benchmark-integration.md:28
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:200-233
  # UNMAPPED: the bench run's id (bench keys a run it imports by the imported id) and the fields
  # bench requires that no takt record holds yet: `budget_micro_usd` (story:bench-subset-and-budget),
  # `observed_at`, `out_dir`, `provenance`, and `workspace_path`, the finished tree bench's grader
  # reads. story:bench-run-export and bench's own store settle them.
  # UNMAPPED: the relation to takt.work.Case and takt.work.Run. A takt-arm run is exported from
  # one case and may span several invocations and resumes; whether a benchmark run references
  # its case or is owned by it is not said, and a free arm's run has neither.
  # read from: .engineering/planning/story/bench-run-export.md:42
  # read from: docs/metrics/README.md:49
  - name: takt.work.BenchRun
    naming:
      summary: >-
        One benchmark task under one arm, once: its verdict from the held-out tests and its raw
        usage, the record takt exports as a bench run.
    identity:
      name: id
      type: takt.work.BenchRunId
    fields:
      - name: task
        type: takt.work.BenchTaskId
      - name: arm
        type: takt.work.BenchArm
      - name: takt_revision
        type: Optional<takt.work.Revision>
        summary: takt's commit; absent for a free arm and where it was not recorded.
      - name: verdict
        type: takt.work.BenchVerdict
      - name: usage
        type: takt.work.BenchUsage
      - name: wall_seconds
        type: Optional<Integer>
        summary: The run's wall time, resumes included; absent for an untimed run.
      - name: case_dir
        type: Optional<String>
        summary: The directory holding the run's case and events; absent where none was kept.
    relations:
      # A task is run many times, under each arm; it stands on its own and outlives its runs.
      - name: task
        kind: references
        target: takt.work.BenchTask
        cardinality: one
        via: task
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A harness-neutral trace: the operations of one run in the shared vocabulary, for every
  # harness step takt drives and every run of a free-running harness in a comparison, with the
  # harness's raw usage record kept beside it unchanged as the only source of token and cost
  # figures. Declared ahead of the code (story:normalized-harness-trace).
  # read from: .engineering/planning/story/normalized-harness-trace.md:27
  # read from: .engineering/planning/story/normalized-harness-trace.md:51
  # UNMAPPED: the trace's relation to takt.work.Run: one per run (the story's title), but a
  # free-running harness's run is no takt Run, and whether a takt run's trace is kept under its
  # case (the story's expected-before looks there) and so owned, or stands apart, is not said.
  # read from: .engineering/planning/story/normalized-harness-trace.md:41
  # UNMAPPED: whether takt reads an external normalizer's format, calls it, or carries its own
  # adapter, and so the raw usage record's format; `raw_usage` holds a path until then.
  # read from: .engineering/planning/story/normalized-harness-trace.md:35
  - name: takt.work.Trace
    naming:
      summary: >-
        One run's operations in one vocabulary whatever harness ran it, with that harness's raw
        usage kept beside it for cost.
    identity:
      name: id
      type: takt.work.TraceId
    fields:
      - name: harness
        type: String
        summary: The harness that produced the run, takt's or one running free.
      - name: operations
        type: List<takt.work.TraceOperation>
      - name: raw_usage
        type: String
        summary: The harness's raw usage record, kept unchanged.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
