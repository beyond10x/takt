  - name: takt.work.TrialNumber
    kind: newtype
    of: Integer

  # What comparing the installed binary's embedded revision with the merged candidate revision
  # came to, the result of a `promotion_record` record of `self.improvement/1`.
  # read from: protocols/self-improvement/1.yaml:58-61
  - name: takt.work.PromotionResult
    kind: enum
    variants: [promoted, mismatch]

  # What a promotion record is, its `kind`: `baseline` for one `takt promote --baseline-only`
  # wrote, which installed nothing; `promotion` for one that installed a binary; `refused` for a
  # candidate whose scorecard was worse, kept as `<revision>.refused.json` so the same revision is
  # not judged again until it changes (the design's "no re-run of an unchanged candidate").
  # Decided 2026-10-18.
  # read from: .engineering/planning/story/promotion.md:95
  # read from: .engineering/planning/design/recursive-self-improvement.md:130-138
  # read from: crates/takt/src/promotion.rs:129-139
  # Decided 2026-10-19 (story:promotion-refusal-is-not-final): a refusal is final no longer. The
  # operator judges a refused candidate again with `--rejudge` on a scorecard of new runs, none
  # of whose case ids is in a scorecard it was refused on (each refusal records its scorecard's
  # case ids, `cases`; the first shared case is named); refused again, it is kept beside the
  # first as `<revision>.refused-<scorecard sha256>.json`, naming the refusal before it
  # (takt.work.Rejudged). Decided 2026-10-19 (story:scorecard-outcome-from-held-out-check): a
  # `rebaseline` replaces the baseline's scorecard, nothing built or installed, with one of the
  # baseline's revision and its case ids exactly, every metric definition at or above the stored
  # one's version and one higher; kept as `<revision>.rebaseline-<scorecard sha256>.json`, its
  # scorecard copied beside it, it is the latest baseline the next candidate is compared with.
  # Its file is named `scorecard-<revision>.json`, and each of its runs is the stored run of the
  # same case at the same position, re-derived and nothing else: as many runs a case, every
  # field whose definition is unchanged equal (steps, tokens, refusals, `NoProgress`, errors,
  # wall time, the outcome under an unchanged outcome definition, the revision the `opened` line
  # names) and the stop equal to the stored one, or to the stored outcome under the outcome
  # definition of version 1. A stored run saved without `opened_binary` (every scorecard saved
  # before the field) accepts a re-read naming exactly the replaced record's revision, or naming
  # none when that record states its revision; anything else is refused. No run's outcome may
  # rank below the stored run's, so the held-out results a v1 to v2 rebaseline brings in keep
  # or raise the bar and never lower it; a stored scorecard with no outcome metric is refused.
  # On every read of the store a rebaseline must replace the latest
  # baseline before it: `replaces_sha256` is that record's scorecard digest, of the same
  # revision, and both scorecard copies hold the same case ids.
  # read from: .engineering/planning/story/promotion-refusal-is-not-final.md (§ Outcome)
  # read from: crates/takt/src/promotion.rs:2545-2732
  # read from: crates/takt/src/promotion.rs:768-879
  # read from: crates/takt/src/promotion.rs:730-766
  - name: takt.work.PromotionKind
    kind: enum
    variants: [baseline, promotion, refused, rebaseline]

  # An agent role's name, the `<role>` of `agent:<role>`. Four agent roles work on takt: the
