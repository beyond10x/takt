  # One case's figures on a scorecard, the unit a comparison counts: its outcome, the best a run
  # of it completed with, else its last run's (a completed case is final: a merged case does not
  # reopen, so an `accepted` case stays `accepted` whatever a later run ended on); its runs, and
  # its runs' steps, tokens (over the runs whose tokens are known), refusals, errors, wall times
  # and tokens by action (each action's sum over the runs that took it, unknown when any of
  # theirs is) summed, a sum stopping at the largest integer and flagged; the steps that leave a
  # run's tokens unknown (`unknown_steps`, each its action, or `a step without an action` for a
  # run of unknown tokens with no unknown action), empty when every run's are known, the case's
  # tokens then printed `unknown` and never compared (takt.work.Comparison); 1 when its outcome
  # is `NoProgress`. Derived from the runs, never saved
  # apart from them. Its scenario is its runs'. A case any run of which stopped `disk_low` is a
  # `disk_low` trial: it stays in its scenario, and that scenario gets no verdict on either
  # side, whatever its count (the planner's ruling; takt.work.Stop, takt.work.Comparison).
  # read from: crates/takt/src/scorecard.rs:446-538
  # read from: crates/takt/src/scorecard.rs:1188-1202
  # read from: crates/takt/src/scorecard.rs:80-86
  # read from: crates/takt/src/scorecard.rs:1173-1186
