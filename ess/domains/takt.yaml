      # block is one line naming the gates and why what they printed is not shown. With none, no
      # block, and the prompt is as it was. A replay rebuilding a recorded step's prompt reads
      # them from the step's record the same way. When the step offers `implementation.edit`, a
      # block naming the failing tests' assertions follows the gates' block ("Where each failing
      # test's assertion is, ...", `TESTS_PATH_LABEL`): for each kept line naming a failing test
