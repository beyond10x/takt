  # read from: .engineering/planning/story/bench-subset-and-budget.md:31
  # Maps to bench.fact of the organization's benchmark instrument with `source: hidden-test`: a
  # hidden test that passes is `held`, one that fails `contradicted`, one that could not run
  # `unknown`.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:274-277
  # UNMAPPED: bench records one fact per hidden test, keyed by the test's id, and grades a run
  # itself from its workspace; whether takt's one verdict per run is exported as a fact, and
  # under which expectation id, or bench re-grades the run and the verdict stays takt's record,
  # is not said.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:600-603
  - name: takt.work.BenchVerdict
    kind: enum
    variants: [pass, fail, unknown]

  # A benchmark run's raw usage: the figures the harness's own usage record states (Claude
  # Code's `--output-format json` result, Codex's `turn.completed` event, or takt's stop line,
  # which sums the same records), unchanged and as a scenario record holds them: the tokens by
  # component and the cost the harness reported. A figure the source does not state is absent,
  # never 0; the token sum is computed from the four parts and not held.
  # read from: docs/metrics/README.md:19-22
  # read from: docs/metrics/README.md:52-57
  # read from: .engineering/planning/story/bench-run-export.md:29
  # Maps in part to bench.run of the organization's benchmark instrument, which holds the cost
  # alone, as integer micro-USD with its basis (`provider-reported`, `assumed`, `unknown`), and no
  # token figure.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:217-219
  # UNMAPPED: where the token figures go in bench, since no field of bench.run holds them; and
  # how a dollar figure becomes micro-USD, which bench requires because it refuses a float, and
  # which basis it carries.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:62-64
  - name: takt.work.BenchUsage
    kind: struct
    fields:
      - name: input
        type: Optional<Integer>
        summary: Input tokens other than those the cache served.
      - name: output
        type: Optional<Integer>
        summary: Output tokens.
      - name: cache_read
        type: Optional<Integer>
        summary: Input tokens the cache served.
      - name: cache_write
        type: Optional<Integer>
