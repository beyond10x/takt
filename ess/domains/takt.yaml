        type: List<takt.work.FailedCheck>
      - name: obligations
        type: List<takt.work.Obligation>
      # The files the intent's `## Scope` section names in backticks that the prompt attaches as
      # Claude Code file mentions (`@<path>`, unquoted and relative, each after white space), on
      # one line after the intent, so the step starts with them read. Only for a harness that
      # reads such a mention as a file attached, Claude Code (`claude -p` and `--harness claude`
      # through metaharness); Codex and b10x-harness are given no line. A path is kept only when
      # it is relative, has no `.` or `..` component and holds no white space, quote, backtick,
      # backslash, `#`, `@` or control character; every part of its way from the tree is a
      # directory that is no link and it ends in a regular file; git tracks it as a regular file at
      # the step's `HEAD` and does not ignore it; it lies outside `.engineering/`. Paths resolve
      # against the step's tree, never the working directory. At most 8 files and 64 KiB in all;
      # a file whose bytes hold text of a credential's shape is left out, with or without a
      # policy; under `B10X_GATES_POLICY` only a file whose bytes pass the one scan the change so
