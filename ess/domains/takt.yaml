      initial: Open
      states: [Open]
      terminal: [Open]

  # The branch a case lives on, recorded as `branch.yaml` under the case directory: forked at open
  # from its base, never from another case's commits (on a plain branch the base is that branch
  # and the fork is HEAD; on another case's branch the base is that case's recorded base and the
  # fork is the base's tip, a branch whose name after `takt/` is no case id refused before it is
  # read as one, and one under `takt/` with no case directory refused as a base using takt's reserved
  # prefix, naming the prefix and a rename), with the commit it forked from, the branch the tree was on at open,
  # the revision last pushed through the forge and the pull request opened for it; removed with
  # the case, the tree back on the branch it left. The branch pushed and opened for is computed
  # from the case id, never taken from the file: a `name` the harness rewrote is set right and the
  # observation says so.
  # read from: crates/takt/src/case.rs:597-598
  # read from: crates/takt/src/case.rs:564-591
  # read from: crates/takt/src/case.rs:168-196
  # read from: crates/takt/src/validator.rs:3973-3977
  # read from: crates/takt/src/validator.rs:4070
  - name: takt.work.CaseBranch
    naming:
      summary: >-
        A case's branch with what the forge has seen of it: the base it forked from and the
        commit pinned there, the branch the tree left, the revision pushed, the pull request
        opened.
    identity:
      name: name
      type: takt.work.BranchName
    fields:
      # The branch the case forked from and the pull request targets; absent when the tree was
