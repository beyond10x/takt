      # read from: crates/takt/src/case.rs:4040-4041
      # read from: crates/takt/src/improvement.rs:1158-1159
      - name: forge
        type: Optional<String>
      # The case's own revision (`takt.work.CaseRevision`), moved with every artifact that moves
      # to another revision, by takt and through the case store alike: the store takes a change
      # of the case's artifact revisions and its case revision and writes them into `case.yaml`
      # through a file renamed over it; it refuses any other change, with nothing written.
      # read from: crates/takt/src/case.rs:3747-3761
      # read from: crates/takt/src/case.rs:1709-1726
      # read from: crates/takt/src/case.rs:1897-1911
      - name: revision
        type: takt.work.CaseRevision
      # The observations reported to the case, in the order received, kept in
      # `observations.json` beside its files; owned by the case. A case opened before they were
      # kept has no file, which reads as none.
      # read from: crates/takt/src/case.rs:1729-1734
      # read from: crates/takt/src/case.rs:3559
      - name: observations
        type: List<takt.work.Observation>
    relations:
      # A case opened for a story references it; the story lives in the planning store and
      # outlives the case.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
      # The case names its branch: created at open, removed with the case; `takt/<id>` names the
      # case `<id>` back.
      # read from: crates/takt/src/case.rs:2583-2586
      # read from: crates/takt/src/case.rs:568-591
      - name: branch
        kind: references
        target: takt.work.CaseBranch
        cardinality: one
        via: branch
      # An improvement turn is a case under `self.improvement/1`, not a noun of its own, and its
      # `finding` artifact is the finding the turn verifies. Decided 2026-10-18: an improvement
      # case references exactly one finding, and a finding may have many cases (a retried or
      # re-opened turn); many-to-one, the case side references.
      # read from: .engineering/planning/story/self-improvement-protocol.md:62-64
      # read from: engineering-protocols 0.10.0, protocols/self-improvement/1.yaml:28-32
      - name: finding
        kind: references
        target: takt.work.Finding
        cardinality: one
        via: finding
    # A case is open from the moment the run opens it. Closing it through the outcome it
    # completed with is the record story's (story:run-record-and-story-evidence); nothing in the
    # kernel moves a case, which is finished when its latest decision has a legitimate outcome, so
    # there is no transition here.
    # read from: crates/takt/src/case.rs:2172-2173
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

  # A planning-store story as takt sees it: the unit the frontier pulls, the rung it stands on,
  # the case open for it, and the approvals recorded on it. The store owns the ladder and moves
  # the story (`aep plan artifact move`); takt reads its status and declares no lifecycle for it
  # here. A story is taken when `proposed` and is `active` while its case is open, so a story with
  # an open case is never taken twice; a story has at most one open case, and a later run resumes
  # it.
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-51
  # read from: .engineering/planning/story/takt-domain-model.md:43
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:14-22
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:43-49
  # read from: crates/takt/src/frontier.rs:680-685
  - name: takt.work.Story
    naming:
      summary: >-
        A story of the repository's planning store, with its status, the one case open for it, if
        any, and the approvals the operator recorded on it; the frontier reads the store for the
        active stories and their open cases and writes the approval records.
    identity:
      name: story_id
      type: takt.work.StoryId
    fields:
      # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:14-22
      - name: status
        type: takt.work.StoryStatus
      # The case open for the story, which the next run resumes; absent while none is open.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: open_case
        type: Optional<takt.work.CaseId>
      # The approvals recorded on the story, one `approval` evidence record each, written by
      # `takt approve` before the grant it writes into the case; empty until the first.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-49
      # read from: crates/takt/src/frontier.rs:462-472
      - name: approvals
        type: List<takt.work.Approval>
    relations:
      # At most one open case per story. The case stands on its own on disk, so the story
      # references it rather than owning it.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:51
      - name: open_case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: open_case
    # The story's own ladder is the planning store's, carried in `status`.
    lifecycle:
      initial: Listed
      states: [Listed]
      terminal: [Listed]

  # One `takt run`: it opens the case or resumes one, then loops, evaluating the case and taking
  # one step at a time, until a stop. The judgement actor, the validators and the budgets are what
  # the run is given; the steps taken, the tokens spent and the stop are what it records.
  # read from: crates/takt/src/run.rs:1-5
  # read from: crates/takt/src/run.rs:9292-9338
  # read from: crates/takt/src/run.rs:12161-12324
  # A run holds its case for its whole duration: `run.lock`, holding the instant it took hold, is
  # created with `create_new` at start, so of two that try at once exactly one holds, and removed
  # at every stop, on error and on a panic, the panic recorded first, unless a link or a part that is not a
  # directory stands on the way to the case directory, when it stays (below). A resume holds the case
  # while it checks out the branch and moves the revision, and a grant while it is checked,
  # recorded and written. A run, a resume or `takt approve` on a held case is refused naming the
  # lock; a lock a holder that crashed left behind is removed by hand.
  # read from: crates/takt/src/case.rs:95
  # read from: crates/takt/src/case.rs:517-521
  # read from: crates/takt/src/case.rs:3286
  # read from: crates/takt/src/run.rs:10736-10799
  # Nothing under the case directory is written, appended to or removed while a part of the way
  # from the tree down to it is not a real directory, each read with `symlink_metadata` before
  # the hold, before the stop and before the error line: a run that finds a link there (one a
  # step left at `.engineering`, at the cases directory or at the case's own directory when its
  # undo failed) records nothing and keeps its hold, says on
  # standard error what it took (its steps and tokens) and why nothing was recorded, and ends on
  # the error.
  # read from: crates/takt/src/case.rs:3337-3374
  # read from: crates/takt/src/run.rs:10724-10818
  - name: takt.work.Run
    naming:
      summary: >-
        One invocation of the loop over one case: the worktree, the unit, the protocol and inputs,
        the budgets, the harness and the validators it was given, and the steps, tokens and stop it
        recorded.
    identity:
      # The run's own id. The kernel mints none today: one run opens or resumes one case, whose id
      # is minted from an instant when `--case-id` gives none, and the run's stop is printed with
      # that case's directory. A run resumed on a case is a second Run of the same case, so the
      # run and the case are told apart here.
      # read from: crates/takt/src/run.rs:9295-9296
      # read from: crates/takt/src/run.rs:9573
      # read from: crates/takt-cli/src/main.rs:3264-3268
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      name: run_id
      type: takt.work.RunId
    fields:
      # The case the run opened, or the one it resumed.
      # read from: crates/takt/src/run.rs:9886-9908
      # read from: crates/takt/src/run.rs:9295-9296
      # read from: crates/takt/src/run.rs:9574-9582
      - name: case_id
        type: takt.work.CaseId
      # read from: crates/takt/src/run.rs:9293-9294
      - name: tree
        type: String
        summary: The worktree the case is opened in and every action is performed in.
      # read from: crates/takt/src/run.rs:9297-9298
      # read from: docs/design/takt.md:44
      - name: unit
        type: takt.work.Unit
      # Not given, a story the planning store gives opens on its tag `protocol:<name>/<major>`, else
      # the run file's `protocol`, else `story.delivery/2` (takt's defaults document, `protocol_defaults.yaml`), embedded in the binary, and an intent on
      # `software.change/1`; a resumed case runs on its own protocol, and
      # a `--protocol` that names another, or another document under the same id, is refused
      # before anything is resumed.
      # read from: crates/takt/src/run.rs:55
      # read from: crates/takt/src/run.rs:9560-9563
      # read from: crates/takt-cli/src/main.rs:1658-1665
      # read from: crates/takt-cli/src/main.rs:4038-4052
      # read from: crates/takt/src/protocol.rs:613-667
      - name: protocol
        type: takt.work.ProtocolSource
        summary: The protocol id, `software.change/1`, or the path of a `protocol/1` file.
      # The case inputs, `name=value` each. Each input the protocol declares takes the first of
      # `--input`, the story's tag `input:<name>=<value>`, the run file's `protocols` section and
      # takt's built-in default from its defaults document (for `story.delivery/2` `tests_first: required` and `gate_on: after_handover`, for `software.change/1` the least demanding values), each recorded
      # with its source (takt.work.ProtocolSetting); an input the protocol a case opens on does not declare is
      # refused before the case is opened, and any input given for a resumed case is refused: it
      # keeps the inputs it was opened with. For `loop.improvement/1`, `loop_baseline=<full
      # commit id>` is required and no case input: it opens the case's baseline
      # (takt.work.LoopBaselineSnapshot). For `self.improvement/1`, `finding=<story id>` (a
      # finding the planning store holds at the commit the case forks from) and
      # `candidate=<full commit id>` (a commit of the repository, delivered outside the case) are
      # required and no case inputs, and the promotion store must hold a baseline: they open the
      # turn's `finding`, `candidate`, `baseline` and `promotion` (the candidate) revisions and
      # its independence; its case input `surface` is computed, and one given must agree. With
      # no `--intent` the turn takes its finding's title. A turn opens, and resumes, only on the
      # protocol document the binary embeds; another document of id `self.improvement/1` is
      # refused before anything is written, naming the embedded one. A turn is refused before anything is
      # written when the candidate's tree differs from the baseline's at `scripts/check-finding`
      # or `scripts/file-finding`; when the mainline's tip already holds the candidate (is it or
      # a descendant of it), merged before a turn could grant it, naming the candidate and the
      # tip in full and the remedy, a fresh candidate (a resumed turn whose candidate reached the
      # mainline since still resumes; story:a-turn-refuses-a-candidate-main-already-holds); when
      # the mainline's tip cannot be read (the forge's route or the network down, no `main`) or
      # whether it holds the candidate cannot be read, naming the forge, the read's error and the
      # remedy, to open the turn again once the tip can be read (a resumed turn reads no tip this
      # way; story:a-turn-does-not-open-when-the-mainline-tip-cannot-be-read); when the commit
      # the case forks from is off the mainline and
      # the finding's body there or in the candidate is not the baseline's; when the binary that
      # runs is not the promoted one (of the sha256 the record holds whenever it holds one, and
      # built from the latest promoted revision unless the operator stated the record); and when
      # the baseline's `scripts/check-finding` hashes to none of the reviewed confined scripts.
      # read from: crates/takt/src/run.rs:59-60
      # read from: crates/takt-cli/src/main.rs:1854-1874
      # read from: crates/takt-cli/src/main.rs:2281-2296
      # read from: crates/takt-cli/src/main.rs:4062
      # read from: crates/takt/src/run.rs:9923
      # read from: crates/takt-cli/src/main.rs:1784-1848
      # read from: crates/takt-cli/src/main.rs:2049-2053
      # read from: crates/takt/src/case.rs:4150-4365
      # read from: crates/takt/src/protocol.rs:736-838
      # read from: crates/takt/src/improvement.rs:52-68
      - name: inputs
        type: Map<takt.work.InputId, String>
      # The workflow the run follows, when one is given; not built, the kernel takes none yet.
      # read from: docs/design/takt.md:41
      - name: workflow
        type: Optional<takt.work.WorkflowPath>
      # read from: crates/takt/src/run.rs:61-62
      - name: iterations
        type: Optional<Integer>
        summary: Stop after this many steps.
      # read from: crates/takt/src/run.rs:63-64
      # read from: crates/takt/src/run.rs:10711-10722
      - name: hours
        type: Optional<Decimal>
        summary: >-
          Stop after this many hours, a decimal number; the kernel holds it as an `f64`. A
          judgement step is held to what is left of it.
      # read from: crates/takt/src/run.rs:65-66
      - name: token_budget
        type: Optional<Integer>
        summary: Stop once the harness has reported this many tokens.
      # What `--active-seconds` sets, above 0; none caps nothing (takt.work.Stop `active_time`).
      # read from: crates/takt/src/run.rs:9334-9335
      # read from: crates/takt-cli/src/main.rs:1039-1045
      - name: active_seconds
        type: Optional<Integer>
        summary: >-
          Stop once the run's active time, its wall time less its waits on the forge, reaches
          this many seconds, read before every step.
      # The approval gate: the one approval-required action the harness may request to end the
      # run; other approval-required actions are not offered. `takt run` given no `--gate` takes
      # the protocol's first action that requires a capability and that the case's inputs do not
      # block for good: `repository.merge` for a software change or a delivery,
      # `candidate.merge` or `candidate.merge_judge_surface` for an improvement turn.
      # read from: crates/takt/src/run.rs:69-72
      # read from: crates/takt-cli/src/main.rs:1095-1100
      - name: gate
        type: Optional<takt.work.ActionId>
      # read from: crates/takt/src/run.rs:9299-9300
      - name: harness
        type: takt.work.HarnessName
        summary: The judgement actor that performs every judgement step of the run.
      # read from: crates/takt/src/run.rs:9301-9302
      # read from: crates/takt-cli/src/main.rs:2753-2764
      # read from: crates/takt-cli/src/main.rs:2771-2780
      - name: validators
        type: List<takt.work.ProducerName>
        summary: >-
          The validators, one per deterministic action: `takt.tests-run` and `takt.change-read`;
          `takt.gate-run` when
          `--gates` names a document or `.engineering/gates.yaml` is a file; `takt.pr-open`,
          `takt.ci-read` and `takt.pr-merged` when the forge is `bot` or `gitlab`; `takt.loop-measure`,
          `takt.loop-definition-check` and `takt.loop-compare` always, due only in a
          `loop.improvement/1` case; `takt.finding-file`, `takt.scenario-reproduce`,
          `takt.scenario-verify`, `takt.scorecard-compare`, `takt.candidate-merge`,
          `takt.candidate-merge-judge-surface` and `takt.binary-promote` always, due only in a
          `self.improvement/1` case; the two merge validators read the forge's `main`, or the
          local `main` under `--forge none`.
      # The forge the run's pull request goes through: `bot` when asked for or when `origin` is
      # on github.com, `gitlab` when asked for or when `origin` is on another host `glab` is
      # logged in to, `none` registers none of the three forge validators.
      # read from: crates/takt-cli/src/main.rs:3044-3113
      - name: forge
        type: takt.work.ForgeName
      # The least free space a step needs, in GiB, on the file system of the tree and, when
      # `CARGO_TARGET_DIR` is set, of the one holding that directory: what `--min-free-gib` sets,
      # 10 by default, 0 turns the check off. Under it the run stops `disk_low`
      # (takt.work.Stop) before the step. The CLI gives every run one; the library's default is
      # 0, which reads nothing, until `Run::stop_when_disk_below` gives one in bytes.
      # read from: crates/takt-cli/src/main.rs:1133-1140
      # read from: crates/takt-cli/src/main.rs:3242
      # read from: crates/takt/src/run.rs:9374-9376
      - name: min_free_gib
        type: Integer
      # The instant a case id is minted from, as `now()` writes one (`YYYY-MM-DDTHH:MM:SSZ`):
      # set when `--case-id` gives none and the run opens a case, `takt-<instant>` for an intent
      # and `story-<name>-<instant>` for a story; a run given its case id, or one that resumes a
      # case, records no instant. `run.lock` holds the instant the run took hold of its case only
      # while it runs, or after a run that found a link or a part that is not a directory on the
      # way to its case directory (`takt.work.Run`). The elapsed clock the hour budget is measured against is a monotonic
      # instant and is not stored.
      # read from: crates/takt/src/run.rs:9573
      # read from: crates/takt/src/run.rs:9556
      # read from: crates/takt-cli/src/main.rs:698-700
      # read from: crates/takt/src/lib.rs:45-47
      # read from: crates/takt/src/case.rs:539
      # read from: crates/takt/src/run.rs:9333
      # read from: crates/takt/src/run.rs:10332
      - name: started_at
        type: Optional<Timestamp>
      # read from: crates/takt/src/run.rs:9303-9304
      - name: steps
        type: Integer
        summary: Steps taken so far.
      # read from: crates/takt/src/run.rs:9305-9306
      # read from: crates/takt/src/run.rs:13091-13092
      - name: tokens
        type: Integer
        summary: Tokens the harness reported, summed over its steps.
      # read from: crates/takt/src/run.rs:75-104
      # read from: crates/takt-cli/src/main.rs:3264
      - name: stop
        type: Optional<takt.work.Stop>
        summary: Why the run stopped; absent while it runs, and after a run that ended on an error.
      # One run, many lines of its case's `events.jsonl`: the run appends one per event, beside
      # each line it prints, and rewrites none; a resumed run appends to the file of the runs
      # before it, so the file holds every run of the case in order, each opening with `opened`
      # and ending with `stop` or `error`; a run that finds a link or a part that is not a
      # directory on the way to its case directory appends neither (`takt.work.Run`).
      # read from: crates/takt/src/events.rs:1-11
      # read from: crates/takt/src/events.rs:327-391
      # read from: crates/takt/src/run.rs:10724-10802
      - name: events
        type: List<takt.work.RunEventLine>
        summary: The lines the run appended to its case's `events.jsonl`, in order.
    relations:
      # One run, one case: the run opens it, or resumes it, and the case outlives the run on disk.
      # read from: crates/takt/src/run.rs:9295-9296
      # read from: crates/takt/src/run.rs:9886-9908
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case_id
      # Not built: the kernel takes no workflow yet.
      # read from: docs/design/takt.md:41
      - name: workflow
        kind: references
        target: takt.work.Workflow
        cardinality: one
        via: workflow
      # read from: crates/takt/src/run.rs:9301-9302
      - name: validators
        kind: references
        target: takt.work.EvidenceProducer
        cardinality: many
        via: validators
      # The steps a run took have no meaning outside it; they are numbered within it.
      # read from: crates/takt/src/run.rs:9303-9304
      # read from: crates/takt/src/run.rs:13115
      - name: steps
        kind: owns
        target: takt.work.Step
        cardinality: many
        via: run_id
    # A run is started when its case is opened and is over once `stop` is set; the stop is data,
    # not a state, because nothing but the loop itself ends a run.
    lifecycle:
      initial: Started
      states: [Started]
      terminal: [Started]

  # A `workflow/1` document: the protocol a case runs under and the blocks the loop follows. Not
  # built: the kernel reads none yet; the loop today is fixed in code, with the deterministic
  # steps of the validators the binary registers and the judgement step among the actions
  # offered. The `loop`, `gate` and `approval` blocks of the design are declared by the stories
  # that build them (story:declared-loops, story:gate-validator, story:merge-under-authority).
  # read from: docs/design/takt.md:73-82
  # read from: docs/design/takt.md:117
  - name: takt.work.Workflow
    naming:
      summary: >-
        The `workflow/1` file a run follows: its protocol block and its step blocks, as the design
        lays them out. Declared ahead of the loader that reads it.
    identity:
      name: path
      type: takt.work.WorkflowPath
    fields:
      # read from: docs/design/takt.md:73
      - name: format
        type: String
        summary: The only accepted value is `workflow/1`.
      # read from: docs/design/takt.md:77
      - name: protocol
        type: takt.work.ProtocolBlock
      # read from: docs/design/takt.md:78-79
      - name: steps
        type: List<takt.work.StepBlock>
    # A workflow is declared and stays declared; the loop reads it and never moves it.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # One step a run took: one iteration of the loop past its evaluation. Every step is judged by
  # what it did to the tree, against a checkpoint taken before it: `HEAD`, the index, every branch
  # and tag (but a branch another worktree has checked out, unless it is the case's own or its
  # base), every replace ref, the uncommitted and the ignored paths, and the guarded part of
  # `.git` (hooks, `info/`, the configuration keys that run code, a linked worktree's
  # `commondir` and `gitdir`, `shallow`, `objects/info/alternates` and the commit-graph, single
  # or split); the whole cases directory is snapshotted beside it.
  # takt's own records for a story, written just before the step its grant authorises (the
  # merge), come before that checkpoint: they are the run's writes, not the step's, and stay.
  # A deterministic step is the validator whose action is admissible and whose evidence is missing
  # at the current revision performing its action, its records written to the case. It is refused
  # with nothing observed on a tree with uncommitted changes, and refused with nothing recorded
  # when the program it ran (a test or gate command, code a model may have written) changed
  # anything but the files its validator declares under its case and the ignored files it made
  # off the judge surface (a build's output; `.takt` and `.takt/.gitignore` are never that, and a
  # change to either is refused), or left anything on the judge surface the snapshot
  # sees differ (a FIFO, a file in an ignored directory), or changed what cargo and rustup read
  # outside the tree (`.cargo/config` and `.cargo/config.toml`, `rust-toolchain` and
  # `rust-toolchain.toml` in every directory above it, `config*` in `$CARGO_HOME`, `~/.cargo`
  # when it is not set, each part of the way to them a path of its own), or a program a command
  # may find by name outside the tree (every directory on the `PATH` the test command inherits,
  # the fixed path `/usr/local/bin:/usr/bin:/bin` a gate's command finds a bare program name on, or
  # the `PATH` its binding declares, every directory outside the tree the
  # script itself prepends to `PATH`, `$CARGO_HOME/bin` and every rustup toolchain's `bin`,
  # each that the user can write when it is read, a linked directory resolved first, and one
  # that does not exist yet when its nearest existing directory can be written, with every
  # directory between: the directory itself and every executable file and link directly in it,
  # by name, kind and the whole file up to 1 MiB, or by size, mode, inode and modification and
