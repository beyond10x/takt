  # also wrote into the tree is refused for the write first and ends the run on
  # `step_refused`, the refusal naming the write and the timeout. The forge's programs keep
  # their own timeout. The first is
  # `takt.tests-run`: action `tests.run`, kind `test_result`,
  # subject `implementation`, result `pass` on exit 0 and `fail` otherwise; in a case nothing is
  # run and no record written while the case's branch changed the judge surface but the planning
  # store, or a manifest entry that decides the build or one of pytest's tables (or a line the
  # scanner cannot read), since the case's pinned base, the surface extended by the repository's
  # own list at that base, while a link stands where it would read through it at either
  # revision, while the list does not parse, or when the case pins none, the summary naming the
  # paths. A path git lists that is not UTF-8, anywhere in the tree at either revision, is never
  # decoded to a stand-in: the observation is an error naming it, its bytes escaped, and nothing
  # is run, a limit accepted for `tests.run` and `ci.read` alike. The second is
  # `takt.gate-run`: action `gate.run`, kind `gate_result`, subject `implementation`, the
  # repository's `engineering-gates/1` document evaluated through the assertions library with the
  # project file `--project` names, or `.engineering/assertions-project.yaml` when that is a file,
  # both taken from the base commit the case pinned at open, never from the tree a model edits:
  # `pass` when every gate is true, `fail` when any is false, no record when a gate is unknown, the
  # case pins no base commit, or a program or catalog the project file admits differs from the
  # base; the summary names the gate that decided. The third is `takt.pr-open`: action `pr.open`,
  # kind `pull_request`, subject `implementation`; it refuses a HEAD other than the revision (or
  # takt's riders on top of it: the approval's commits, the story's `test_result` record and its
  # move to `implemented`) or a case without a base before anything is pushed, pushes nothing
  # while the case's branch has no commit beyond its base branch (`refs/heads/<base>`, never a
  # tag of its name) but the take, and pushes nothing and records nothing, saying so, while
  # that base branch is not there; it has the forge scan what each push would publish, the
  # commits the remote does not hold and the pull request's title and body (a refused scan, or
  # one over what one scan is given, pushes nothing, opens nothing and records nothing), pushes
  # the revision with its riders as the case's branch and opens one pull request per case (a
  # later revision is scanned and pushes again), the result the state the forge reports for a
  # head that is the case's branch at the pushed revision. The fourth is `takt.ci-read`: action `ci.read`, kind `ci_result`, `pass` or
  # `fail` from the checks on the pull request's head; no record while they are pending, without a
  # pull request, with a head that is not the case's branch at the pushed revision, or while the
  # case's branch changed the judge surface but the planning store, a manifest entry that decides
  # the build or one of pytest's tables since the case's pinned base, the surface extended by the
  # repository's own list there, while a link stands where it would read through it, while the
  # list does not parse (or the case pins none), the summary naming the paths. The fifth is
  # `takt.pr-merged`: action `repository.merge`, kind `merge_observation`, subject
  # `implementation`; admissible only under a recorded grant, it merges an open pull request whose
  # head the forge reports as the case's branch at the revision, or at the revision with only
  # takt's riders above it (the approval record, the story's `test_result` record and its move to
  # `implemented`, the move last and only above its `test_result`, each file at its path and
  # byte-equal to the record the case keeps, travel with the pull request), only while the case
  # holds a grant of `repository.merge` at that revision. A story's run given the store writes the
  # `test_result` and the move just before this step, and does not take the step unless both are
  # written for the granted revision (the move counts as written when the story is already
  # `implemented` there): the run stops `StepRefused` with the store's refusal relayed. The
  # case's branch head is pushed first when it carries the revision and descends from the pull
  # request's head, after the forge scanned what that push would publish as `pr.open`'s are (a
  # refused scan pushes nothing, merges nothing and records nothing); with riders above the revision the head's checks are read first, and
  # pending or failing merges nothing. It records the state
  # read back about the granted revision, the merged head kept beside it, `merged` making the
  # protocol's `accepted` outcome legitimate; no record while the pull request is still open.
  # The sixth is `takt.change-read`: action `change.read`, kind `change_record`, subject
  # `implementation`, `ahead` when merging the revision into the base branch's tip now (`git
  # merge-tree`, nothing checked out) would change that tip's tree outside `.engineering/`, by
  # content and not by commits or their messages, `none` when it would not (the same content
  # landed on the base by another commit, with or without more beside it, is no change to
  # publish); a merge that conflicts at any path outside `.engineering/` is `ahead`, whatever
  # tree git writes for it, and one that conflicts only inside it is read by that tree, the
  # summary naming the conflicted paths either way; with the base branch gone, the revision's tree compared with the base pinned at open instead; no
  # record for a case with no base; it reads git only, with no code from configuration, and
  # compares with the local base branch as it stands, fetching nothing. The seventh to ninth
  # are the loop scorecard's: `takt.loop-measure` (`loop.measure`, `loop_measurement`),
  # `takt.loop-definition-check` (`loop.definition.check`, `definition_check`) and
  # `takt.loop-compare` (`loop.compare`, `loop_comparison`), so none of their kinds can be a
  # choice kind. The tenth to thirteenth are an improvement turn's, due only in a
  # `self.improvement/1` case: `takt.finding-file` (`finding.file`, `finding_record`, about
  # `finding`), `filed` when the finding the case's `story.yaml` names, as the store holds it at
  # the `finding` revision, parses under the baseline's `scripts/file-finding --predicate` and cites
  # a source that is a file there, else `malformed`, writing nothing to the store;
  # `takt.scenario-reproduce` (`scenario.reproduce`, about `baseline`) and
  # `takt.scenario-verify` (`scenario.verify`, about `candidate`), each `scenario_result` the
  # line the baseline's `scripts/check-finding` prints for the finding at that revision, run on
  # a checkout of the turn's `finding` revision outside the case's tree, made with no template and fetched from
  # the case repository through git's transport with every object hashed and checked (as is the
  # build's checkout), no record when it gives none; a kept build of the revision runs only while
  # its sha256 is the one the turn recorded under the case's `artifacts/` when it built it, else
  # it is built again and recorded. Below the cache root `<cache>/takt` (which may be the
  # operator's link, followed once) everything is reached through directory descriptors: a link
  # at `improvement`, `check-finding` or `builds` refuses the check naming it, a link or a file
  # at `builds/<revision>` or in it is unlinked as itself, a directory where a build's files
  # belong refuses the check, and nothing is removed through a link; and
  # `takt.scorecard-compare` (`scorecard.compare`, `scorecard_result`,
  # about `candidate`), the candidate's saved scorecard at
  # `$XDG_STATE_HOME/takt/scorecards/scorecard-<candidate>.json` against the baseline's copy in
  # the promotion store under the promotion rule, waiting and naming the path while it is
  # missing. The scripts they run are read at the turn's baseline, never from the tree. The
  # fourteenth and fifteenth are one type's, `takt.candidate-merge` (`candidate.merge`) and
  # `takt.candidate-merge-judge-surface` (`candidate.merge_judge_surface`), each a
  # `merge_observation` about `candidate`, `merged` once the case holds the grant its action
  # requires at the candidate and the mainline's tip holds the candidate, the forge and the tip
  # retained beside the record, waiting while it does not; and the sixteenth
  # `takt.binary-promote` (`binary.promote`, `promotion_record`, about `promotion`, the
  # candidate's revision), `promoted` once the case holds its grant and the promotion store's
  # latest record that is no refusal is of that revision, waiting while it is not. Neither
  # merges nor promotes: they observe (story:self-improvement-protocol S1, part 2).
  # Each built-in validator defines its action and kind,
  # and the list the step choice reads is built from them.
  # read from: crates/takt/src/validator.rs:1677-1681
  # read from: crates/takt/src/run.rs:108-110
  # read from: crates/takt/src/validator.rs:1114-1118
  # read from: crates/takt/src/validator.rs:1473-1477
  # read from: crates/takt/src/validator.rs:670-682
  # read from: crates/takt/src/validator.rs:701-705
  # read from: crates/takt/src/validator.rs:902
  # read from: crates/takt/src/validator.rs:1-2
  # read from: crates/takt/src/validator.rs:46-91
  # read from: crates/takt/src/validator.rs:541-555
  # read from: crates/takt/src/validator.rs:395-397
  # read from: crates/takt/src/validator.rs:633-642
  # read from: crates/takt/src/forge.rs:653-671
  # read from: crates/takt/src/validator.rs:1332
  # read from: crates/takt/src/validator.rs:2314
  # read from: docs/design/takt.md:47-49
  # read from: docs/design/takt.md:64-65
  # read from: crates/takt/src/forge.rs:792-816
  # read from: crates/takt/src/validator.rs:127-146
  # read from: crates/takt/src/validator.rs:2654-2668
