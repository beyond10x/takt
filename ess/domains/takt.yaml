# Takt's nouns, declared from three sources, and every declaration says which: the kernel as it is
# (crates/takt/src/{case,run,harness,validator,evidence,protocol,forge,frontier,git}.rs and
# crates/takt-cli/src/main.rs),
# the design where the kernel has nothing yet (docs/design/takt.md § 3), and the cleared decision
# on the approval grant and the case resume
# (.engineering/planning/decision-blocker/approval-grant-and-case-resume.md).
# Canon's declarations (b10x-canon 0.6.0, the release Cargo.toml pins, ess/domains/protocol.yaml)
# are named where a takt noun holds one and never redeclared: the protocol, the case snapshot, the
# evidence record and the decision are Canon's. An identifier a protocol declares is carried here as
# a newtype over String so that a takt field has a type, and each names the Canon type it carries.
# Cross-repository citations name the release and the file; in-repository ones the file and lines.
domain: takt.work

summary: >-
  One `takt run` is a Run over one Case on one Unit: the case is opened under a protocol in a
  worktree, or resumed, and the loop evaluates it, takes one Step (a deterministic one by an
  EvidenceProducer, or a judgement one by the harness among the actions offered), records the
  effect and evaluates again, until an outcome is legitimate, an approval is needed, nothing is
  admissible, a step is refused, no progress is made or the budget is spent. A Workflow is the
  `workflow/1` document a run is to follow, designed and not built. A Story is the planning-store
  unit the frontier pulls, with at most one open case, which a later run resumes once the
  operator has granted the case its authority.

naming:
  wire: work
  display: Work

types:
  # The case id: `--case-id`; else, from the instant the case is opened, `story-<name>-<instant>`
  # for a story the frontier took and `takt-<instant>` for an intent. Carries
  # canon.protocol.CaseId (protocol.yaml:526), the `id` of the snapshot. One plain name under the
  # cases directory: an id that is empty, `.`, holds `..` or a path separator, starts with `/`, or
  # holds a control, whitespace, separator or format character is refused before it is joined to
  # a path, wherever an id is given (`takt run --case`, `--case-id`, `takt approve`).
  # read from: crates/takt/src/run.rs:391
  # read from: crates/takt/src/frontier.rs:53-57
  # read from: crates/takt/src/case.rs:925
  # read from: crates/takt/src/case.rs:95-105
  - name: takt.work.CaseId
    kind: newtype
    of: String

  # A run's own id, minted when the run starts. The kernel gives a run no id today: one run opens
  # or resumes one case and prints its stop under the case's directory. The decided resume
  # (`takt run --case <id>`) gives a case a second run, so a run is told apart from its case here.
  # read from: crates/takt/src/run.rs:328-342
  # read from: crates/takt/src/run.rs:391
  # read from: crates/takt-cli/src/main.rs:693-696
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
  - name: takt.work.RunId
    kind: newtype
    of: String

  # A protocol as the loaded protocol in memory names it, `<name>/<major>` (`software.change/1`):
  # a built-in of the engineering protocols, one of this repository's `protocol/1` files the
  # binary embeds (`story.delivery/1`), or a `protocol/1` file Canon validated and compiled.
  # read from: crates/takt/src/protocol.rs:11-17
  # read from: crates/takt/src/protocol.rs:33-36
  - name: takt.work.ProtocolId
    kind: newtype
    of: String

  # A protocol's name alone (`software.change`): what the snapshot's `protocol` key holds, and
  # what a `protocol` block names beside its `revision`. Carries canon.protocol.ProtocolId
  # (protocol.yaml:32).
  # read from: crates/takt/src/protocol.rs:14-15
  # read from: crates/takt/src/case.rs:926
  - name: takt.work.ProtocolName
    kind: newtype
    of: String

  # Where a run's protocol comes from: a built-in, by id, or a `protocol/1` file, by path; the
  # kernel loads from the file when the argument names one that exists, read from the directory
  # `takt` runs in.
  # read from: crates/takt/src/run.rs:23
  # read from: crates/takt/src/run.rs:383-386
  # read from: crates/takt/src/protocol.rs:62-67
  - name: takt.work.ProtocolSource
    kind: union
    tag: kind
    variants:
      builtin: takt.work.ProtocolId
      file: String

  # A planning-store story's artifact id, `story:<slug>`, as the `aep plan artifact` verbs take it.
  # read from: docs/design/takt.md:38
  # read from: crates/takt/src/frontier.rs:35-36
  # read from: .engineering/planning/story/takt-domain-model.md:43
  - name: takt.work.StoryId
    kind: newtype
    of: String

  # The rungs of the planning store's story ladder, as takt reads them: a story is taken when
  # `proposed` ("refined and agreed enough to pick up") and is `active` ("being worked on now")
  # while its case is open. The store moves a story; takt reads where it stands.
  # read from: aep 0.68.0 (the revision .engineering/project.yaml pins), artifacts/lifecycles/story.yaml:14-22
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:43-49
  # read from: crates/takt/src/frontier.rs:26-30
  - name: takt.work.StoryStatus
    kind: enum
    variants: [draft, proposed, active, implemented, rejected, archived]

  # What a run works on: an intent given on the command line, or a story the frontier pulls from
  # the planning store. Since wave 02 a run given neither `--intent` nor `--case` asks the
  # frontier: it resumes the open case of a story being worked, if there is one; else the next
  # ready story (`proposed`, no blocker, every `depends_on` `implemented` or `archived`, first in
  # id order) becomes the unit: its case is opened first, then the store moves the story
  # `active` through its own verb, and that change is committed on the case's branch as
  # `takt: take <story>`. The `story` variant is the design's `frontier(repo)`.
  # read from: docs/design/takt.md:38
  # read from: crates/takt/src/frontier.rs:132-140
  # read from: crates/takt/src/frontier.rs:148
  # read from: crates/takt/src/run.rs:473-485
  # read from: crates/takt/src/run.rs:527-585
  # read from: crates/takt/src/run.rs:242-243
  - name: takt.work.Unit
    kind: union
    tag: kind
    variants:
      intent: String
      story: takt.work.StoryId

  # An action the protocol declares, by id (`tests.run`, `implementation.edit`, `repository.merge`).
  # Carries canon.protocol.ActionId (protocol.yaml:57).
  # read from: crates/takt/src/protocol.rs:26-27
  - name: takt.work.ActionId
    kind: newtype
    of: String

  # An evidence kind the protocol declares, by id (`test_result`). Carries
  # canon.protocol.EvidenceKindId (protocol.yaml:42).
  # read from: crates/takt/src/validator.rs:50-51
  - name: takt.work.EvidenceKindId
    kind: newtype
    of: String

  # An artifact the protocol declares, by id (`intent`, `implementation`): what a case gives a
  # revision for and what an evidence record is about. Carries canon.protocol.ArtifactId
  # (protocol.yaml:37).
  # read from: crates/takt/src/protocol.rs:22-23
  # read from: crates/takt/src/validator.rs:52-53
  - name: takt.work.ArtifactId
    kind: newtype
    of: String

  # A capability an action requires (`repository.merge`): what an authority decision grants or
  # denies. Carries canon.protocol.CapabilityId (protocol.yaml:67). A grant names one that some
  # action of the case's protocol `requires`, or it is refused.
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47
  # read from: b10x-canon 0.6.0, crates/canon/src/model/authority.rs:24
  # read from: crates/takt/src/case.rs:404-425
  - name: takt.work.CapabilityId
    kind: newtype
    of: String

  # An authority decision on one capability, as a `canon-authority/1` entry carries it: an action
  # whose precondition holds is admissible when every capability it requires is granted, blocked
  # when one is denied, and approval-required when none is denied and one is undecided. The same
  # two values as canon.protocol.Grant (protocol.yaml:682).
  # read from: b10x-canon 0.6.0, crates/canon/src/model/authority.rs:34
  # read from: b10x-canon 0.6.0, crates/canon/src/eval/authority.rs:7-12
  # read from: crates/takt/src/case.rs:241-245
  - name: takt.work.Grant
    kind: enum
    variants: [granted, denied]

  # One approval the operator gave a story's case, as the planning store records it: the
  # capability granted, the case it was granted to, who granted it, when, and the implementation
  # revision it authorises. `takt approve <case> <capability> --by <approver>` writes it through
  # `aep plan artifact evidence <story> --kind approval` before it writes the grant: the source
  # `takt approve <capability> --by <approver> at <revision>`, the reference the case's
  # `authority.yaml`, the instant the grant's `granted_at`. What the record changed in the store is
  # committed on the case's branch as `takt: approve <story> <capability>`, exactly those paths,
  # so the tree must be on that branch and clean. A record the store refuses leaves no grant. takt
  # never reads the record back: the grant a run reads is the case's (`Case.authority`); this is
  # its trail on the story.
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-49
  # read from: crates/takt/src/case.rs:376-389
  # read from: crates/takt/src/frontier.rs:195-233
  # read from: crates/takt/src/frontier.rs:407-431
  # read from: crates/takt/src/frontier.rs:176-177
  - name: takt.work.Approval
    kind: struct
    fields:
      - name: capability
        type: takt.work.CapabilityId
      # The case whose `authority.yaml` the grant was written into, what the record refers to.
      # read from: crates/takt/src/case.rs:395-396
      - name: case
        type: takt.work.CaseId
      - name: approver
        type: String
        summary: Who granted it, as given to `--by`.
      - name: granted_at
        type: Timestamp
      # The implementation revision the case was at the gate at, the one revision the grant
      # authorises; the record's source names it.
      # read from: crates/takt/src/case.rs:388
      - name: revision
        type: takt.work.Revision

  # An outcome the protocol declares, by id: the one a run completes through. Carries
  # canon.protocol.OutcomeId (protocol.yaml:62).
  # read from: crates/takt/src/run.rs:46-47
  - name: takt.work.OutcomeId
    kind: newtype
    of: String

  # A case input the protocol declares, by id (`risk`, `change_kind`). Carries
  # canon.protocol.InputId (protocol.yaml:293); the value given is text, `true` and `false` written
  # into the snapshot as booleans.
  # read from: crates/takt/src/protocol.rs:24-25
  # read from: crates/takt/src/case.rs:930-950
  - name: takt.work.InputId
    kind: newtype
    of: String

  # The judgement actor's name: `claude-code` (`--harness claude`) for Claude Code in print mode
  # with file tools only, started without the user's or the tree's settings, hooks or MCP servers
  # and with no credential in its environment; `none` for the harness that performs nothing,
  # except that it requests the gate action when an approval is pending, so an unattended run
  # stops `approval_required`; asked for any other judgement step it ends the run with an error.
  # read from: crates/takt-cli/src/main.rs:171-187
  # read from: crates/takt/src/harness.rs:46-48
  # read from: crates/takt/src/harness.rs:170
  # read from: crates/takt/src/harness.rs:101-105
  # read from: crates/takt/src/harness.rs:206
  # read from: crates/takt-cli/src/main.rs:468-472
  - name: takt.work.HarnessName
    kind: newtype
    of: String

  # A validator's name, the `producer` every record it writes names (`takt.tests-run`,
  # `takt.gate-run`). Carries
  # canon.protocol.Principal (protocol.yaml:241), an opaque principal Canon records as given.
  # read from: crates/takt/src/validator.rs:46-47
  # read from: crates/takt/src/validator.rs:121
  # read from: crates/takt/src/evidence.rs:16
  - name: takt.work.ProducerName
    kind: newtype
    of: String

  # An evidence record's id, unique within the case (`test-result-<seq>`). Carries
  # canon.protocol.EvidenceId (protocol.yaml:538).
  # read from: crates/takt/src/evidence.rs:9
  # read from: crates/takt/src/validator.rs:155
  # Takt's ids are `<kind>-<evaluation number>`, the number continued across the case's runs, so an
  # id is unique within a case.
  # read from: crates/takt/src/case.rs:1123
  # read from: crates/takt/src/run.rs:710
  - name: takt.work.EvidenceId
    kind: newtype
    of: String

  # A revision of an artifact: a commit for `implementation`, the SHA-256 of the intent text for
  # `intent`, `r0` for every other artifact at open. Carries canon.protocol.Revision
  # (protocol.yaml:533); evidence is bound to the revision it was observed on. `implementation`
  # opens at the tip of the case's branch and moves to every commit the run makes: the take of a
  # story, and each accepted judgement step. A resumed case moves it to the branch's `HEAD` when a
  # commit was made between runs, so the claims about it return to unknown, except when every
  # commit on top is an approval's own (`takt: approve <story> <capability>`, one parent, adding
  # only new regular files directly in the story's evidence directory, no more such commits than
  # the case holds grants), which leaves it at the revision the grant authorises.
  # read from: crates/takt/src/case.rs:915-917
  # read from: crates/takt/src/case.rs:1007
  # read from: crates/takt/src/run.rs:569
  # read from: crates/takt/src/run.rs:1175
  # read from: crates/takt/src/case.rs:1094-1098
  # read from: crates/takt/src/case.rs:751-753
  # read from: crates/takt/src/evidence.rs:14
  - name: takt.work.Revision
    kind: newtype
    of: String

  # A step's number within its run, counted from 1 as the run prints it (`step 3: tests.run {}`).
  # read from: crates/takt/src/run.rs:339-340
  # read from: crates/takt/src/run.rs:418
  # read from: crates/takt/src/run.rs:1024
  - name: takt.work.StepNumber
    kind: newtype
    of: Integer

  # What identifies a step: the run that took it and its number within that run, since numbers
  # start again at 1 with every run; evaluation numbers and record ids do not: one sequence per
  # case, continued across its runs, so no decision is overwritten and no record id repeats.
  # read from: crates/takt/src/case.rs:1123
  # read from: crates/takt/src/run.rs:707-710
  # read from: crates/takt/src/run.rs:418
  # read from: crates/takt/src/run.rs:1024
  - name: takt.work.StepKey
    kind: struct
    fields:
      - name: run_id
        type: takt.work.RunId
      - name: number
        type: takt.work.StepNumber

  # Which of the two kinds of step the loop took: a deterministic one, performed by a validator,
  # or a judgement one, performed by the harness. A deterministic step is taken first whenever a
  # validator's action is admissible, its evidence is missing at the current revision, and it has
  # not already observed there without writing a record: a validator that writes nothing (a gate
  # whose assertion cannot be evaluated yet) yields to the harness at that revision, and a commit
  # makes it due again.
  # read from: crates/takt/src/run.rs:98-111
  # read from: docs/design/takt.md:41-42
  # read from: crates/takt/src/run.rs:761
  # read from: crates/takt/src/run.rs:951
  - name: takt.work.StepKind
    kind: enum
    variants: [deterministic, judgement]

  # Why a run stopped. `completed` names the outcome that is legitimate; `approval_required` the
  # actions that need an approval when nothing else is left, or the one gate action the harness
  # requested with no change; `iterations`, `hours` and `tokens` the budget that was spent;
  # `step_refused` why a step was refused: a judgement step that did what it may not, its change
  # discarded, or a validator's observation on a tree with uncommitted changes or that wrote what
  # its validator does not, nothing recorded; `no_progress` says a judgement step changed no file
  # and the decision did not move, so another would not either, or a deterministic step wrote no
  # record while no judgement step was offered and no other validator was due; `waiting` says the
  # run waited on the forge (checks still running, a pull request's head behind the push, a
  # merge held for a required check) and its step or hour budget ended first, or it had none to
  # wait in, nothing recorded for what it awaited. A run that ends on an error once its case is
  # open prints `stopped: error:` and has no stop. The binary's exit code follows the stop: 0
  # `completed`, 4 `approval_required`, 6 `waiting`, 3 every other stop, 5 an error once the
  # case is open, 1 a refusal before the run.
  # read from: crates/takt/src/run.rs:43-61
  # read from: crates/takt/src/run.rs:741
  # read from: crates/takt/src/run.rs:953-957
  # read from: crates/takt/src/run.rs:1132
  # read from: crates/takt/src/run.rs:786
  # read from: crates/takt/src/run.rs:848
  # read from: crates/takt/src/run.rs:919-920
  # read from: crates/takt-cli/src/main.rs:699-702
  # read from: crates/takt-cli/src/main.rs:207-213
  # read from: crates/takt/src/run.rs:62-71
  # read from: crates/takt/src/run.rs:926-934
  # read from: crates/takt-cli/src/main.rs:701
  # read from: crates/takt-cli/src/main.rs:214
  - name: takt.work.Stop
    kind: union
    tag: kind
    variants:
      completed: takt.work.OutcomeId
      approval_required: List<takt.work.ActionId>
      nothing_admissible: ~
      iterations: Integer
      hours: Decimal
      tokens: Integer
      step_refused: String
      no_progress: ~
      waiting: takt.work.Waiting

  # What a `waiting` stop names: the actions whose observation waits on the forge, and the
  # budget that ended the wait, absent for a run with neither a step nor an hour budget.
  # read from: crates/takt/src/run.rs:66-71
  - name: takt.work.Waiting
    kind: struct
    fields:
      - name: on
        type: List<takt.work.ActionId>
      - name: budget
        type: Optional<takt.work.Stop>

  # One line of a case's run record, `events.jsonl` in the case directory: the instant it was
  # written, as `now()` writes one; the step it belongs to, 0 before a run's first (a run's steps
  # are numbered from 1); and the event. The file is appended, one line written whole per event,
  # and never rewritten; every run of a case appends to the same file. It lies in the case
  # directory, which no judgement step and no validator's command may write, so every line is the
  # kernel's. A line cut short, without its end, is ended by the next line written, which is a
  # `skipped` line naming it; on read such a line, or a last line without its end, is skipped,
  # and any other line that does not read is an error.
  # read from: crates/takt/src/events.rs:1-9
  # read from: crates/takt/src/events.rs:109-116
  # read from: crates/takt/src/events.rs:139-168
  # read from: crates/takt/src/events.rs:203-248
  - name: takt.work.RunEventLine
    kind: struct
    fields:
      - name: at
        type: Timestamp
      - name: step
        type: Integer
      - name: event
        type: takt.work.RunEvent

  # What a run records, one kind per line, tagged `event`, beside each line it prints and before
  # it: the run opened or resumed; an evaluation; a step, by a validator or the harness; what a
  # judgement step changed; an evidence record a validator wrote under the case; a `test_result`
  # record and a move to `implemented` written on the story in the planning store, once the case
  # terminated `accepted`; a refusal, the kernel's or the store's; a wait on the forge; an error;
  # a line skipped as cut short; and the stop. A line about a judgement step is written once its
  # change is kept or put back, so putting the case directory back never takes a line with it.
  # Every run's lines end on its `stop`, or on an `error` when the run ends on one.
  # read from: crates/takt/src/events.rs:25-107
  # read from: crates/takt/src/run.rs:6-12
  # read from: crates/takt/src/run.rs:714-748
  # read from: crates/takt/src/run.rs:1042-1052
  # read from: crates/takt/src/run.rs:1404-1416
  - name: takt.work.RunEvent
    kind: union
    tag: event
    variants:
      opened: takt.work.RunOpened
      decision: takt.work.RunDecision
      step: takt.work.RunStep
      effect: takt.work.RunEffect
      evidence: takt.work.RunEvidence
      store_evidence: takt.work.RunStoreEvidence
      store_move: takt.work.RunStoreMove
      refusal: takt.work.RunRefusal
      waiting: takt.work.RunWait
      error: takt.work.RunError
      skipped: takt.work.RunSkipped
      stop: takt.work.RunStopped

  # A run opened its case, or resumed it: the protocol, the story when the case works one, and
  # the inputs as `name=value`.
  # read from: crates/takt/src/events.rs:29-37
  # read from: crates/takt/src/run.rs:990-1001
  - name: takt.work.RunOpened
    kind: struct
    fields:
      - name: case
        type: takt.work.CaseId
      - name: protocol
        type: takt.work.ProtocolId
      - name: story
        type: Optional<takt.work.StoryId>
      - name: inputs
        type: List<String>

  # An evaluation: its number in the case's one sequence, the decision file it was written to,
  # `decisions/<seq>.json` under the case, and the frontier as printed.
  # read from: crates/takt/src/events.rs:38-44
  # read from: crates/takt/src/run.rs:1044-1051
  - name: takt.work.RunDecision
    kind: struct
    fields:
      - name: seq
        type: Integer
      - name: file
        type: String
      - name: frontier
        type: String

  # A step: `by` is `validator` or `harness`; the validator's or the harness's name, the action,
  # what it reported, and the tokens the harness reported when it reported any.
  # read from: crates/takt/src/events.rs:45-54
  # read from: crates/takt/src/run.rs:960-980
  - name: takt.work.RunStep
    kind: struct
    fields:
      - name: by
        type: String
      - name: name
        type: String
      - name: action
        type: takt.work.ActionId
      - name: summary
        type: String
      - name: tokens
        type: Optional<Integer>

  # What a judgement step changed: the paths committed and the implementation revision they were
  # committed as; no path and no revision when it changed no file.
  # read from: crates/takt/src/events.rs:55-61
  # read from: crates/takt/src/run.rs:1587-1595
  # read from: crates/takt/src/run.rs:1618-1626
  - name: takt.work.RunEffect
    kind: struct
    fields:
      - name: paths
        type: List<String>
      - name: revision
        type: Optional<takt.work.Revision>

  # An evidence record a validator wrote under the case: its id, kind and result, and its path
  # relative to the tree.
  # read from: crates/takt/src/events.rs:62-70
  # read from: crates/takt/src/run.rs:1225-1239
  - name: takt.work.RunEvidence
    kind: struct
    fields:
      - name: id
        type: takt.work.EvidenceId
      - name: kind
        type: takt.work.EvidenceKindId
      - name: result
        type: Optional<String>
      - name: path
        type: String

  # A `test_result` record written on the story in the planning store through `aep plan artifact
  # evidence`, source takt, actor `agent:takt`: the reference is the case's record a validator of
  # the case wrote, the instant that record's own `observed_at`, and the commit on the case's
  # branch that holds it. The line is written with the commit, which a line that cannot be
  # written takes back; a write the case's record names, or whose commit subject the case's
  # branch holds, is not made again.
  # read from: crates/takt/src/events.rs:71-81
  # read from: crates/takt/src/run.rs:780-845
  # read from: crates/takt/src/run.rs:908-947
  # read from: crates/takt/src/frontier.rs:245-249
  # read from: crates/takt/src/frontier.rs:318-330
  - name: takt.work.RunStoreEvidence
    kind: struct
    fields:
      - name: story
        type: takt.work.StoryId
      - name: kind
        type: takt.work.EvidenceKindId
      - name: reference
        type: String
      - name: at
        type: Timestamp
      - name: commit
        type: Optional<takt.work.Revision>

  # The story moved in the planning store through `aep plan artifact move`, to `implemented`,
  # and the commit on the case's branch that holds the move, written with it as above.
  # read from: crates/takt/src/events.rs:82-89
  # read from: crates/takt/src/run.rs:866-884
  - name: takt.work.RunStoreMove
    kind: struct
    fields:
      - name: story
        type: takt.work.StoryId
      - name: to
        type: takt.work.StoryStatus
      - name: commit
        type: Optional<takt.work.Revision>

  # A refusal: `by` is `takt`, a step the kernel discarded (one that wrote into the cases
  # directory or the planning store among them) or a write it would not make, or `store`, the
  # planning store's refusal; the reason verbatim. A refusal of the store is relayed, never
  # retried, and leaves the stop as the case reached it.
  # read from: crates/takt/src/events.rs:20-23
  # read from: crates/takt/src/events.rs:90-92
  # read from: crates/takt/src/run.rs:949-958
  # read from: crates/takt/src/run.rs:1354-1357
  # read from: crates/takt/src/run.rs:1466-1486
  - name: takt.work.RunRefusal
    kind: struct
    fields:
      - name: by
        type: String
      - name: reason
        type: String

  # The run pauses on the forge for `seconds`, then observes the actions `on` again.
  # read from: crates/takt/src/events.rs:93-94
  # read from: crates/takt/src/run.rs:1297-1303
  - name: takt.work.RunWait
    kind: struct
    fields:
      - name: on
        type: List<takt.work.ActionId>
      - name: seconds
        type: Decimal

  # An error as it was reported: the one a run ended on, or one met while recording an accepted
  # case in the store (an `events.jsonl` line that does not read, an `out` that fails), after
  # which the run keeps its stop and records it next.
  # read from: crates/takt/src/events.rs:95-97
  # read from: crates/takt/src/run.rs:728-743
  # read from: crates/takt/src/run.rs:750-769
  - name: takt.work.RunError
    kind: struct
    fields:
      - name: error
        type: String

  # The line `line`, counted from 1, was cut short, without its end, and is skipped on read;
  # written with the next event, which ends the torn line first.
  # read from: crates/takt/src/events.rs:98-100
  # read from: crates/takt/src/events.rs:139-168
  - name: takt.work.RunSkipped
    kind: struct
    fields:
      - name: line
        type: Integer
      - name: reason
        type: String

  # The run stopped: the stop as printed, the steps taken and the tokens reported.
  # read from: crates/takt/src/events.rs:101-106
  # read from: crates/takt/src/run.rs:770-777
  - name: takt.work.RunStopped
    kind: struct
    fields:
      - name: stop
        type: String
      - name: steps
        type: Integer
      - name: tokens
        type: Integer

  # Where a `workflow/1` document is: the `--workflow <file>` argument, or the repository default
  # `.engineering/workflow.yaml`. Not built: the kernel reads neither yet (milestone M3).
  # read from: docs/design/takt.md:35
  # read from: docs/design/takt.md:74
  - name: takt.work.WorkflowPath
    kind: newtype
    of: String

  # The `protocol` block of a workflow: which protocol the case runs under, by name and major
  # revision (the design's example writes the two together, `software.change/1`), and the case
  # inputs given to it. Not built; today the same things reach the kernel as `--protocol` and
  # `--input`, and the loaded protocol keeps name and major apart.
  # read from: docs/design/takt.md:55
  # read from: crates/takt/src/run.rs:22-28
  # read from: crates/takt/src/protocol.rs:14-17
  - name: takt.work.ProtocolBlock
    kind: struct
    fields:
      - name: id
        type: takt.work.ProtocolName
      - name: revision
        type: Integer
        summary: The protocol's major revision, the `1` of `software.change/1`.
      - name: inputs
        type: Map<takt.work.InputId, String>

  # A deterministic `step` block: one protocol action and the program that performs it. Not built
  # as a block; five such steps exist in code: the `tests.run` validator, whose argv is
  # `--test-cmd` split at white space; the `gate.run` validator over the gates document `--gates`
  # names, read from the case's base commit; `pr.open`, `ci.read` and `repository.merge` through
  # the forge, the last admissible only under a recorded grant at the case's revision.
  # read from: crates/takt/src/validator.rs:1031
  # read from: crates/takt/src/validator.rs:575
  # read from: crates/takt/src/validator.rs:865
  # read from: crates/takt/src/validator.rs:192
  # read from: docs/design/takt.md:56
  # read from: crates/takt/src/validator.rs:85-87
  # read from: crates/takt-cli/src/main.rs:137-139
  - name: takt.work.DeterministicStep
    kind: struct
    fields:
      - name: action
        type: takt.work.ActionId
      - name: argv
        type: List<String>

  # A judgement `step` block: the protocol actions the harness may choose among, and the brief it
  # is given. Not built as a block; today the actions offered are computed each iteration (the
  # admissible actions no validator owns) and the brief is the intent.
  # read from: docs/design/takt.md:57
  # read from: crates/takt/src/run.rs:755-760
  # read from: crates/takt/src/harness.rs:19-20
  - name: takt.work.JudgementStep
    kind: struct
    fields:
      - name: actions
        type: List<takt.work.ActionId>
      - name: brief
        type: String

  # A `step` block of a workflow, one of the two kinds. Not built.
  # read from: docs/design/takt.md:56-57
  - name: takt.work.StepBlock
    kind: union
    tag: kind
    variants:
      deterministic: takt.work.DeterministicStep
      judgement: takt.work.JudgementStep

  # The forge a run opens its pull request through. `bot` is the repository's bot route: the
  # `b10x-gates` binary pushes the branch and opens the pull request under its own credential
  # (takt never holds a token), `gh` reads the state, the head and the checks, and the merge goes
  # through `b10x-gates` with the head sha so a head that moved is refused; `none` opens
  # nothing and registers none of the three forge validators. The bot route is a GitHub forge: the
  # origin URL names a host and a repository, `bot` is the default only when the host is github.com
  # (compared case-insensitively), and `--forge bot` on another host is refused before any case
  # is opened. A remote URL is shown without its userinfo wherever takt prints one.
  # read from: crates/takt/src/forge.rs:271-302
  # read from: crates/takt/src/forge.rs:1108
  # read from: crates/takt/src/forge.rs:771-780
  # read from: crates/takt/src/forge.rs:1158
  - name: takt.work.ForgeName
    kind: enum
    variants: [bot, none]

  # What a pull request is, as the forge reports it and as a `pull_request` record's result.
  # read from: crates/takt/src/forge.rs:28-38
  - name: takt.work.PullRequestState
    kind: enum
    variants: [open, merged, closed]

  # What the checks on a pull request's head report, as a `ci_result` record's result; `pending`
  # writes no record. `gh` answering "no checks reported" for a head with no check run yet is
  # read as pending (its message as of gh 2.100.0, not yet verified live).
  # read from: crates/takt/src/forge.rs:776
  # read from: crates/takt/src/forge.rs:55-66
  - name: takt.work.ChecksState
    kind: enum
    variants: [pass, fail, pending]

  # A case branch's name, `takt/<case id>`.
  # read from: crates/takt/src/case.rs:23-24
  - name: takt.work.BranchName
    kind: newtype
    of: String

  # A scenario's id in the scratch repository's scenario list. Declared ahead of the code that
  # reads it.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scenario corpus)
  - name: takt.work.ScenarioId
    kind: newtype
    of: String

  # A scorecard's id: the revision its runs were taken at and the instant it was computed.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  - name: takt.work.ScorecardId
    kind: newtype
    of: String

  # A promotion's id. read from: .engineering/planning/design/recursive-self-improvement.md (§ The judge)
  - name: takt.work.PromotionId
    kind: newtype
    of: String

  # How a scenario run compares with the promoted baseline's run of the same scenario.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  - name: takt.work.Comparison
    kind: enum
    variants: [no_regression, regression]

  # A finding's key, the `<key>` of its reference `finding:<key>` in the planning store:
  # lower-case letters and digits in words joined by `-`. One key is one finding: a filing of a
  # key the store holds already, under whatever kind, is refused.
  # read from: .engineering/planning/design/recursive-self-improvement.md:58-59
  # read from: scripts/file-finding:167
  # read from: scripts/file-finding:183-206
  - name: takt.work.FindingKey
    kind: newtype
    of: String

  # What filing a finding came to, the result of a `finding_record` record.
  # read from: protocols/self-improvement/1.yaml:41-44
  # read from: scripts/file-finding:55
  # read from: scripts/file-finding:213
  - name: takt.work.FilingResult
    kind: enum
    variants: [filed, malformed]

  # What a finding's predicate came to on its scenario with a takt built from one revision, the
  # result of a `scenario_result` record.
  # read from: protocols/self-improvement/1.yaml:45-48
  # read from: scripts/check-finding:207-213
  - name: takt.work.ScenarioResult
    kind: enum
    variants: [reproduced, not_reproduced]

entities:
  # The case a run opens: the directory `<tree>/.engineering/cases/<id>/`, holding `case.yaml`, the
  # `canon-case/1` snapshot that canon.protocol.Case declares (protocol.yaml:861) with its
  # `protocol` relation to canon.protocol.Protocol; `protocol.yaml` and `protocol.ir.json`;
  # `intent.md`; `evidence/*.json`, the `canon-evidence/1` records validators wrote
  # (canon.protocol.EvidenceRecord, protocol.yaml:571); `decisions/*.json`, one `canon-decision/1`
  # per evaluation; `branch.yaml`, the case's branch (takt.work.CaseBranch); `artifacts/`, what
  # validators retain (the gate's evaluated bundle, and under the bot route
  # `pull-request.{request,response}.json` and `.merge.request`/`.merge.response` for the merge);
  # `story.yaml`, the story the case was opened for; `run.lock` while a run, a resume or a grant
  # holds the case; and, once the operator has granted it, `authority.yaml`. Opening creates the
  # branch `takt/<id>` at the tip of the case's base and checks it out; discarding removes what
  # was left uncommitted on the branch, the directory and the branch and returns the tree to the
  # branch the case left.
  # read from: crates/takt/src/case.rs:1-5
  # read from: crates/takt/src/case.rs:21-39
  # read from: crates/takt/src/case.rs:987
  # read from: crates/takt/src/case.rs:1202-1212
  # read from: crates/takt/src/run.rs:867-871
  # Every evaluation reads the files and asks Canon. Opening refuses an id that is not a plain name
  # or exists, a tree with uncommitted work outside the cases directory (staged, unstaged or
  # untracked; ignored files are not work), and a tree on a case's branch whose base is unknown,
  # with nothing written; an open that fails later takes the directory and the branch back. With
  # a `pr.open` validator registered, a case without a base is discarded and the run refused
  # before its first step. A case is open while its latest decision has no legitimate outcome: a
  # run given neither `--intent` nor `--case` resumes the open case of a story being worked (its
  # take committed on the case's branch, or, from a tree not on a case's branch, its story
  # `active` in the store), as the decision cited on `story` and `authority` settles; a finished
  # case stays on disk, is skipped by the frontier, and is resumed only by `takt run --case <id>`;
  # a case whose latest decision does not read is taken as open, said on the run's output. A case
  # has many runs, each a Run that references it.
  # read from: crates/takt/src/case.rs:649-680
  # read from: crates/takt/src/case.rs:697-704
  # read from: crates/takt/src/case.rs:1063-1100
  # read from: crates/takt/src/run.rs:498-511
  # read from: crates/takt/src/case.rs:882-1012
  # read from: crates/takt/src/case.rs:907
  # read from: crates/takt/src/case.rs:967
  # read from: crates/takt/src/run.rs:396-399
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
  # read from: crates/takt/src/case.rs:1309-1338
  - name: takt.work.Case
    naming:
      summary: >-
        The Canon case on disk that a run opened: its protocol, its intent, the story it was
        opened for, the authority the operator granted it, and the evidence written so far. The
        snapshot, the records and the decisions it holds are Canon's documents.
    identity:
      name: id
      type: takt.work.CaseId
    fields:
      # read from: crates/takt/src/case.rs:21
      # read from: crates/takt/src/case.rs:851-852
      - name: dir
        type: String
        summary: The case directory, `<tree>/.engineering/cases/<id>`.
      # The protocol the case runs under, by name: what the `protocol` key of `case.yaml` holds.
      # The major is beside it on disk in `protocol.yaml` and `protocol.ir.json`, and the loaded
      # protocol the case keeps in memory carries the full `<name>/<major>` id; a resumed case
      # runs on its own `protocol.yaml`. The `implementation` artifact opens at the case branch's
      # tip (the base's tip when the case was opened over another case's branch), `intent` at the
      # SHA-256 of the intent text, every other at `r0`.
      # read from: crates/takt/src/case.rs:926
      # read from: crates/takt/src/case.rs:1189-1190
      # read from: crates/takt/src/case.rs:857-858
      # read from: crates/takt/src/case.rs:1073
      # read from: crates/takt/src/case.rs:1007
      - name: protocol
        type: takt.work.ProtocolName
      # read from: crates/takt/src/case.rs:1191
      - name: intent
        type: String
        summary: The intent the case was opened for, written as `intent.md`.
      # The story the case was opened for, absent for a case opened on a bare intent. At most one
      # open case per story: the next `takt run` on the repository, or `takt run --case <id>`,
      # resumes it rather than opening a second; the frontier resumes the open case of a story
      # being worked before it takes a new one, and never takes a story a case already records.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      # read from: docs/design/takt.md:38-39
      # read from: crates/takt/src/case.rs:634-643
      # read from: crates/takt/src/run.rs:498-511
      # read from: crates/takt/src/run.rs:541
      # read from: crates/takt/src/run.rs:407
      - name: story
        type: Optional<takt.work.StoryId>
      # The authority the operator granted the case, read into every evaluation of it: the
      # `canon-authority/1` list `takt approve <case> <capability>` writes as the case's
      # `authority.yaml`, keyed here by capability because Canon refuses a capability decided twice.
      # Empty until an approval is given; a case with none stops at the gate with
      # `approval_required`, and an unattended run never merges without a grant. A grant is given
      # only at the gate (the case's latest decision finds an action that requires the capability
      # approval-required, computed at the revision the case is at), holding the case while it is
      # checked and written, and it binds that implementation revision: the file carries each
      # grant's approver, instant and revision beside the capability and the decision, and Canon is
      # handed only the two keys `canon-authority/1` declares, for the grants given at the case's
      # current revision, so a new commit needs a new grant. The merge validator checks the grant
      # at the revision again before it merges. Each approval is also recorded as `approval`
      # evidence on the story in the planning store (`Story.approvals`), before the grant is
      # written. A grant names a capability some action of the case's protocol requires, or it is
      # refused with nothing written.
      # read from: crates/takt/src/case.rs:271-284
      # read from: crates/takt/src/case.rs:291-294
      # read from: crates/takt/src/case.rs:354-363
      # read from: crates/takt/src/case.rs:504-517
      # read from: crates/takt/src/case.rs:580
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:46-52
      # read from: b10x-canon 0.6.0, crates/canon/src/eval/authority.rs:7-21
      # read from: b10x-canon 0.6.0, crates/canon/src/eval/mod.rs:359-365
      # read from: crates/takt/src/case.rs:1322-1323
      # read from: crates/takt/src/validator.rs:1146
      - name: authority
        type: Map<takt.work.CapabilityId, takt.work.Grant>
      # read from: crates/takt/src/case.rs:861-862
      # read from: crates/takt/src/case.rs:1242-1243
      - name: evidence_written
        type: Integer
        summary: How many evidence records have been written to `evidence/`, numbering the next.
      # read from: crates/takt/src/case.rs:853-854
      - name: branch
        type: takt.work.BranchName
        summary: The case's branch, `takt/<id>`.
    relations:
      # A case opened for a story references it; the story lives in the planning store and
      # outlives the case.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
      # The case names its branch: created at open, removed with the case; `takt/<id>` names the
      # case `<id>` back.
      # read from: crates/takt/src/case.rs:828-829
      # read from: crates/takt/src/case.rs:189-212
      - name: branch
        kind: references
        target: takt.work.CaseBranch
        cardinality: one
        via: branch
    # A case is open from the moment the run opens it. Closing it through the outcome it
    # completed with is the record story's (story:run-record-and-story-evidence); nothing in the
    # kernel moves a case, which is finished when its latest decision has a legitimate outcome, so
    # there is no transition here.
    # read from: crates/takt/src/case.rs:686-687
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

  # A planning-store story as takt sees it: the unit the frontier pulls, the rung it stands on,
  # the case open for it, and the approvals recorded on it. The store owns the ladder and moves
  # the story (`aep plan artifact move`); takt reads its status and declares no lifecycle for it
  # here. A story is taken when `proposed` and is `active` while its case is open, so a story with
  # an open case is never taken twice; a story has at most one open case, and a later run resumes
  # it.
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-51
  # read from: .engineering/planning/story/takt-domain-model.md:43
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:14-22
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:43-49
  # read from: crates/takt/src/frontier.rs:394-399
  - name: takt.work.Story
    naming:
      summary: >-
        A story of the repository's planning store, with its status, the one case open for it, if
        any, and the approvals the operator recorded on it; the frontier reads the store for the
        active stories and their open cases and writes the approval records.
    identity:
      name: story_id
      type: takt.work.StoryId
    fields:
      # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:14-22
      - name: status
        type: takt.work.StoryStatus
      # The case open for the story, which the next run resumes; absent while none is open.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: open_case
        type: Optional<takt.work.CaseId>
      # The approvals recorded on the story, one `approval` evidence record each, written by
      # `takt approve` before the grant it writes into the case; empty until the first.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-49
      # read from: crates/takt/src/frontier.rs:222-229
      - name: approvals
        type: List<takt.work.Approval>
    relations:
      # At most one open case per story. The case stands on its own on disk, so the story
      # references it rather than owning it.
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:51
      - name: open_case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: open_case
    # The story's own ladder is the planning store's, carried in `status`.
    lifecycle:
      initial: Listed
      states: [Listed]
      terminal: [Listed]

  # One `takt run`: it opens the case or resumes one, then loops, evaluating the case and taking
  # one step at a time, until a stop. The judgement actor, the validators and the budgets are what
  # the run is given; the steps taken, the tokens spent and the stop are what it records.
  # read from: crates/takt/src/run.rs:1-5
  # read from: crates/takt/src/run.rs:328-346
  # read from: crates/takt/src/run.rs:688-1175
  # A run holds its case for its whole duration: `run.lock`, holding the instant it took hold, is
  # created with `create_new` at start, so of two that try at once exactly one holds, and removed
  # at every stop and on error. A resume holds the case while it checks out the branch and moves
  # the revision, and a grant while it is checked, recorded and written. A run, a resume or
  # `takt approve` on a held case is refused naming the lock; a lock a holder that crashed left
  # behind is removed by hand.
  # read from: crates/takt/src/case.rs:39
  # read from: crates/takt/src/case.rs:139-143
  # read from: crates/takt/src/case.rs:1072
  # read from: crates/takt/src/run.rs:678-683
  - name: takt.work.Run
    naming:
      summary: >-
        One invocation of the loop over one case: the worktree, the unit, the protocol and inputs,
        the budgets, the harness and the validators it was given, and the steps, tokens and stop it
        recorded.
    identity:
      # The run's own id. The kernel mints none today: one run opens or resumes one case, whose id
      # is minted from an instant when `--case-id` gives none, and the run's stop is printed with
      # that case's directory. A run resumed on a case is a second Run of the same case, so the
      # run and the case are told apart here.
      # read from: crates/takt/src/run.rs:331-332
      # read from: crates/takt/src/run.rs:391
      # read from: crates/takt-cli/src/main.rs:693-696
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      name: run_id
      type: takt.work.RunId
    fields:
      # The case the run opened, or the one it resumed.
      # read from: crates/takt/src/run.rs:431-438
      # read from: crates/takt/src/run.rs:331-332
      # read from: crates/takt/src/run.rs:392
      - name: case_id
        type: takt.work.CaseId
      # read from: crates/takt/src/run.rs:329-330
      - name: tree
        type: String
        summary: The worktree the case is opened in and every action is performed in.
      # read from: crates/takt/src/run.rs:333-334
      # read from: docs/design/takt.md:38
      - name: unit
        type: takt.work.Unit
      # Not given, a story the planning store gives opens on `story.delivery/1`, embedded in the
      # binary, and an intent on `software.change/1`; a resumed case runs on its own protocol, and
      # a `--protocol` that names another, or another document under the same id, is refused
      # before anything is resumed.
      # read from: crates/takt/src/run.rs:23
      # read from: crates/takt/src/run.rs:383-386
      # read from: crates/takt-cli/src/main.rs:311-314
      # read from: crates/takt-cli/src/main.rs:1109-1123
      - name: protocol
        type: takt.work.ProtocolSource
        summary: The protocol id, `software.change/1`, or the path of a `protocol/1` file.
      # The case inputs, `name=value` each. For `software.change/1` the least demanding values are
      # supplied for the ones left out; an input the protocol a case opens on does not declare is
      # refused before the case is opened, and any input given for a resumed case is refused: it
      # keeps the inputs it was opened with.
      # read from: crates/takt/src/run.rs:27-28
      # read from: crates/takt-cli/src/main.rs:357-361
      # read from: crates/takt-cli/src/main.rs:345
      # read from: crates/takt-cli/src/main.rs:1133
      # read from: crates/takt/src/run.rs:453
      - name: inputs
        type: Map<takt.work.InputId, String>
      # The workflow the run follows, when one is given; not built, the kernel takes none yet.
      # read from: docs/design/takt.md:35
      - name: workflow
        type: Optional<takt.work.WorkflowPath>
      # read from: crates/takt/src/run.rs:29-30
      - name: iterations
        type: Optional<Integer>
        summary: Stop after this many steps.
      # read from: crates/takt/src/run.rs:31-32
      - name: hours
        type: Optional<Decimal>
        summary: Stop after this many hours, a decimal number; the kernel holds it as an `f64`.
      # read from: crates/takt/src/run.rs:33-34
      - name: token_budget
        type: Optional<Integer>
        summary: Stop once the harness has reported this many tokens.
      # The approval gate: the one approval-required action the harness may request to end the
      # run, `repository.merge` for a software change; other approval-required actions are not
      # offered.
      # read from: crates/takt/src/run.rs:37-40
      # read from: crates/takt-cli/src/main.rs:146-148
      - name: gate
        type: Optional<takt.work.ActionId>
      # read from: crates/takt/src/run.rs:335-336
      - name: harness
        type: takt.work.HarnessName
        summary: The judgement actor that performs every judgement step of the run.
      # read from: crates/takt/src/run.rs:337-338
      # read from: crates/takt-cli/src/main.rs:480-488
      - name: validators
        type: List<takt.work.ProducerName>
        summary: >-
          The validators, one per deterministic action: `takt.tests-run`; `takt.gate-run` when
          `--gates` names a document or `.engineering/gates.yaml` is a file; `takt.pr-open`,
          `takt.ci-read` and `takt.pr-merged` when the forge is `bot`.
      # The forge the run's pull request goes through: `bot` when asked for or when `origin` is
      # on github.com, `none` registers none of the three forge validators.
      # read from: crates/takt-cli/src/main.rs:625-649
      - name: forge
        type: takt.work.ForgeName
      # The instant a case id is minted from, as `now()` writes one (`YYYY-MM-DDTHH:MM:SSZ`):
      # set when `--case-id` gives none and the run opens a case, `takt-<instant>` for an intent
      # and `story-<name>-<instant>` for a story; a run given its case id, or one that resumes a
      # case, records no instant. `run.lock` holds the instant the run took hold of its case only
      # while it runs. The elapsed clock the hour budget is measured against is a monotonic
      # instant and is not stored.
      # read from: crates/takt/src/run.rs:391
      # read from: crates/takt/src/run.rs:379
      # read from: crates/takt-cli/src/main.rs:118-120
      # read from: crates/takt/src/lib.rs:28-30
      # read from: crates/takt/src/case.rs:160
      # read from: crates/takt/src/run.rs:345
      # read from: crates/takt/src/run.rs:644
      - name: started_at
        type: Optional<Timestamp>
      # read from: crates/takt/src/run.rs:339-340
      - name: steps
        type: Integer
        summary: Steps taken so far.
      # read from: crates/takt/src/run.rs:341-342
      # read from: crates/takt/src/run.rs:1019-1020
      - name: tokens
        type: Integer
        summary: Tokens the harness reported, summed over its steps.
      # read from: crates/takt/src/run.rs:43-61
      # read from: crates/takt-cli/src/main.rs:693
      - name: stop
        type: Optional<takt.work.Stop>
        summary: Why the run stopped; absent while it runs, and after a run that ended on an error.
      # One run, many lines of its case's `events.jsonl`: the run appends one per event, beside
      # each line it prints, and rewrites none; a resumed run appends to the file of the runs
      # before it, so the file holds every run of the case in order, each opening with `opened`
      # and ending with `stop` or `error`.
      # read from: crates/takt/src/events.rs:1-9
      # read from: crates/takt/src/events.rs:139-168
      # read from: crates/takt/src/run.rs:714-748
      - name: events
        type: List<takt.work.RunEventLine>
        summary: The lines the run appended to its case's `events.jsonl`, in order.
    relations:
      # One run, one case: the run opens it, or resumes it, and the case outlives the run on disk.
      # read from: crates/takt/src/run.rs:331-332
      # read from: crates/takt/src/run.rs:431-438
      # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case_id
      # Not built: the kernel takes no workflow yet.
      # read from: docs/design/takt.md:35
      - name: workflow
        kind: references
        target: takt.work.Workflow
        cardinality: one
        via: workflow
      # read from: crates/takt/src/run.rs:337-338
      - name: validators
        kind: references
        target: takt.work.EvidenceProducer
        cardinality: many
        via: validators
      # The steps a run took have no meaning outside it; they are numbered within it.
      # read from: crates/takt/src/run.rs:339-340
      # read from: crates/takt/src/run.rs:1024
      - name: steps
        kind: owns
        target: takt.work.Step
        cardinality: many
        via: run_id
    # A run is started when its case is opened and is over once `stop` is set; the stop is data,
    # not a state, because nothing but the loop itself ends a run.
    lifecycle:
      initial: Started
      states: [Started]
      terminal: [Started]

  # A `workflow/1` document: the protocol a case runs under and the blocks the loop follows. Not
  # built: the kernel reads none yet; the loop today is fixed in code, with the deterministic
  # steps of the validators the binary registers and the judgement step among the actions
  # offered. The `loop`, `gate` and `approval` blocks of the design are declared by the stories
  # that build them (story:declared-loops, story:gate-validator, story:merge-under-authority).
  # read from: docs/design/takt.md:51-60
  # read from: docs/design/takt.md:74
  - name: takt.work.Workflow
    naming:
      summary: >-
        The `workflow/1` file a run follows: its protocol block and its step blocks, as the design
        lays them out. Declared ahead of the loader that reads it.
    identity:
      name: path
      type: takt.work.WorkflowPath
    fields:
      # read from: docs/design/takt.md:51
      - name: format
        type: String
        summary: The only accepted value is `workflow/1`.
      # read from: docs/design/takt.md:55
      - name: protocol
        type: takt.work.ProtocolBlock
      # read from: docs/design/takt.md:56-57
      - name: steps
        type: List<takt.work.StepBlock>
    # A workflow is declared and stays declared; the loop reads it and never moves it.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # One step a run took: one iteration of the loop past its evaluation. Every step is judged by
  # what it did to the tree, against a checkpoint taken before it: `HEAD`, the index, every branch
  # and tag (but a branch another worktree has checked out, unless it is the case's own or its
  # base), the uncommitted and the ignored paths, and the guarded part of `.git` (hooks, `info/`,
  # the configuration keys that run code); the whole cases directory is snapshotted beside it.
  # A deterministic step is the validator whose action is admissible and whose evidence is missing
  # at the current revision performing its action, its records written to the case. It is refused
  # with nothing observed on a tree with uncommitted changes, and refused with nothing recorded
  # when the program it ran (a test or gate command, code a model may have written) changed
  # anything but the files its validator declares under its case and the ignored files it made
  # (a build's output); all of it is put back. A
  # judgement step is the harness performing exactly one of the actions offered (the admissible
  # actions no validator owns) in the worktree and reporting which: the gate action requested
  # with no change ends the run with `approval_required`; the gate action requested with a change,
  # an action neither offered nor the gate, a `repository.inspect` that changed a file, a
  # `tests.write` that changed a non-test path, a step that wrote under `.git`, moved `HEAD` or a
  # branch or tag, staged anything, touched an ignored path or a path uncommitted before it, or
  # that added, changed or removed a file under `.engineering/cases` (every case's files, the ones
  # the next evaluation reads; they are put back, a symbolic link as the link itself, never
  # followed), is refused and the change discarded; a harness that fails has its change discarded
  # and ends the run with an error. An accepted change is committed, exactly the paths it changed,
  # and `implementation` moved to the new head.
  # read from: crates/takt/src/run.rs:126-152
  # read from: docs/design/takt.md:40-42
  # read from: crates/takt/src/run.rs:795-803
  # read from: crates/takt/src/run.rs:848
  # read from: crates/takt/src/run.rs:975-986
  # read from: crates/takt/src/run.rs:1062-1104
  # read from: crates/takt/src/run.rs:1117-1132
  # read from: crates/takt/src/run.rs:1134-1144
  # read from: crates/takt/src/run.rs:1009
  # read from: crates/takt/src/run.rs:1161-1175
  # read from: crates/takt/src/harness.rs:16-50
  # read from: crates/takt/src/run.rs:989-992
  - name: takt.work.Step
    naming:
      summary: >-
        One step of a run, numbered within it: which kind, which action, who performed it, what it
        said or observed, the evidence it wrote, the tokens it used and the commit it made.
    identity:
      # The pair of the run and the number within it; a number alone repeats with every run.
      # read from: crates/takt/src/run.rs:418
      # read from: crates/takt/src/run.rs:339-340
      # read from: crates/takt/src/run.rs:1024
      name: key
      type: takt.work.StepKey
    fields:
      # The run that took the step, the same as `key.run_id`, repeated as a field because a
      # relation's `via` names one.
      # read from: crates/takt/src/run.rs:339-340
      - name: run_id
        type: takt.work.RunId
      # read from: crates/takt/src/run.rs:761
      # read from: crates/takt/src/run.rs:951
      - name: kind
        type: takt.work.StepKind
      # Exactly one action: the validator's own for a deterministic step; for a judgement step the
      # one the harness reports, which is among those offered, or the run's gate action (never in
      # the offered set: requesting it with no change ends the run with `approval_required`), or
      # the step is refused.
      # read from: crates/takt/src/run.rs:774
      # read from: crates/takt/src/harness.rs:21-25
      # read from: crates/takt/src/harness.rs:36-38
      # read from: crates/takt/src/run.rs:964
      # read from: crates/takt/src/run.rs:1135
      - name: action
        type: takt.work.ActionId
      # The validator that performed a deterministic step; absent on a judgement step, which the
      # run's harness performed.
      # read from: crates/takt/src/run.rs:770
      # read from: crates/takt/src/run.rs:1024-1027
      - name: producer
        type: Optional<takt.work.ProducerName>
      # read from: crates/takt/src/validator.rs:17-18
      # read from: crates/takt/src/harness.rs:39-40
      # read from: crates/takt/src/run.rs:864
      # read from: crates/takt/src/run.rs:1029
      - name: summary
        type: String
        summary: One line on what was observed (deterministic) or what the harness said it did.
      # The `canon-evidence/1` records a deterministic step wrote to the case, by id; a judgement
      # step writes none, because the model never produces evidence.
      # read from: crates/takt/src/validator.rs:19-20
      # read from: crates/takt/src/run.rs:880-881
      # read from: docs/design/takt.md:47-49
      - name: records
        type: List<takt.work.EvidenceId>
      # What a deterministic step retained beside its records, when the validator keeps something:
      # the observation as its provider wrote it, under the case as `artifacts/<name>`, written
      # before the records that refer to it. The gate validator keeps the evaluated bundle of
      # every observation, record or not.
      # read from: crates/takt/src/validator.rs:16-32
      # read from: crates/takt/src/run.rs:867-880
      # read from: crates/takt/src/validator.rs:471
      - name: artifact
        type: Optional<String>
        summary: The retained file's name under the case's `artifacts/`.
      # read from: crates/takt/src/harness.rs:41-42
      # read from: crates/takt/src/run.rs:1019-1020
      - name: tokens
        type: Optional<Integer>
        summary: Tokens the step used, when the harness reports them.
      # The commit a judgement step's change was committed as, exactly the paths it changed, which
      # `implementation` now names; absent when nothing changed, the step was refused, or the step
      # was deterministic.
      # read from: crates/takt/src/run.rs:1161-1175
      # read from: crates/takt/src/git.rs:431
      - name: committed
        type: Optional<takt.work.Revision>
    relations:
      # A deterministic step is performed by exactly one validator.
      # read from: crates/takt/src/run.rs:770
      - name: producer
        kind: references
        target: takt.work.EvidenceProducer
        cardinality: one
        via: producer
    # A step is taken and recorded; nothing moves it afterwards.
    lifecycle:
      initial: Taken
      states: [Taken]
      terminal: [Taken]

  # A validator: a program that performs one deterministic protocol action and answers evidence,
  # turning an observation (a test run's exit status) into `canon-evidence/1` records bound to the
  # revision it observed. Validators are the only producers of evidence; the model never produces
  # any. Each names itself as the `producer` of its records, performs exactly one action, writes
  # exactly one evidence kind, about exactly one artifact, and may change nothing under the cases
  # directory but the files it declares under its own case. The test command and the forge's
  # programs run with no standard input and no credential but the ones their adapter reads (none
  # for the test command), held to a timeout and a bounded output. The first is
  # `takt.tests-run`: action `tests.run`, kind `test_result`,
  # subject `implementation`, result `pass` on exit 0 and `fail` otherwise. The second is
  # `takt.gate-run`: action `gate.run`, kind `gate_result`, subject `implementation`, the
  # repository's `engineering-gates/1` document evaluated through the assertions library with the
  # project file `--project` names, or `.engineering/assertions-project.yaml` when that is a file,
  # both read from the base commit the case pinned at open, never from the tree a model edits:
  # `pass` when every gate is true, `fail` when any is false, no record when a gate is unknown, the
  # case pins no base commit, or a program or catalog the project file admits differs from the
  # base; the summary names the gate that decided. The third is `takt.pr-open`: action `pr.open`,
  # kind `pull_request`, subject `implementation`; it refuses a HEAD other than the revision (or
  # the approval's own commits on top of it) or a case without a base before anything is pushed,
  # pushes nothing while the case's branch has no commit beyond its base but the take, pushes the
  # revision as the case's branch and opens one pull request per case (a later revision pushes
  # again), the result the state the forge reports for a head that is the case's branch at the
  # pushed revision. The fourth is `takt.ci-read`: action `ci.read`, kind `ci_result`, `pass` or
  # `fail` from the checks on the pull request's head; no record while they are pending, without a
  # pull request, or with a head that is not the case's branch at the pushed revision. The fifth is
  # `takt.pr-merged`: action `repository.merge`, kind `merge_observation`, subject
  # `implementation`; admissible only under a recorded grant, it merges an open pull request whose
  # head the forge reports as the case's branch at the revision, or at the revision with only its
  # approval's commits above it (the approval record travels with the pull request), only while
  # the case holds a grant of `repository.merge` at that revision; with approval commits above it
  # the head's checks are read first, and pending or failing merges nothing. It records the state
  # read back about the granted revision, the merged head kept beside it, `merged` making the
  # protocol's `accepted` outcome legitimate; no record while the pull request is still open.
  # read from: crates/takt/src/validator.rs:1052-1062
  # read from: crates/takt/src/validator.rs:679-689
  # read from: crates/takt/src/validator.rs:886-896
  # read from: crates/takt/src/validator.rs:178-190
  # read from: crates/takt/src/validator.rs:209-213
  # read from: crates/takt/src/validator.rs:380
  # read from: crates/takt/src/validator.rs:1-2
  # read from: crates/takt/src/validator.rs:45-76
  # read from: crates/takt/src/validator.rs:119-133
  # read from: crates/takt/src/validator.rs:81-83
  # read from: crates/takt/src/validator.rs:140-142
  # read from: crates/takt/src/forge.rs:574-592
  # read from: crates/takt/src/validator.rs:762
  # read from: crates/takt/src/validator.rs:1146
  # read from: docs/design/takt.md:47-49
  # read from: docs/design/takt.md:64-65
  # read from: crates/takt/src/forge.rs:699-707
  - name: takt.work.EvidenceProducer
    naming:
      summary: >-
        A validator: the one protocol action it performs, the one evidence kind it writes, and the
        one artifact its records are about, under the name its records carry as `producer`.
    identity:
      name: name
      type: takt.work.ProducerName
    fields:
      # read from: crates/takt/src/validator.rs:48-49
      - name: action
        type: takt.work.ActionId
      # read from: crates/takt/src/validator.rs:50-51
      - name: kind
        type: takt.work.EvidenceKindId
      # read from: crates/takt/src/validator.rs:52-53
      - name: subject
        type: takt.work.ArtifactId
    # A validator is registered with the run that holds it; nothing moves it. The gate validator
    # is registered only when its document is a file; the three forge validators only when the
    # forge is `bot`.
    # read from: crates/takt-cli/src/main.rs:480-488
    # read from: crates/takt-cli/src/main.rs:613-616
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  # The branch a case lives on, recorded as `branch.yaml` under the case directory: forked at open
  # from its base, never from another case's commits (on a plain branch the base is that branch
  # and the fork is HEAD; on another case's branch the base is that case's recorded base and the
  # fork is the base's tip), with the commit it forked from, the branch the tree was on at open,
  # the revision last pushed through the forge and the pull request opened for it; removed with
  # the case, the tree back on the branch it left. The branch pushed and opened for is computed
  # from the case id, never read from the file: a `name` the harness rewrote is set right and the
  # observation says so.
  # read from: crates/takt/src/case.rs:218-219
  # read from: crates/takt/src/case.rs:185-212
  # read from: crates/takt/src/case.rs:952-973
  # read from: crates/takt/src/validator.rs:648-652
  # read from: crates/takt/src/validator.rs:741
  - name: takt.work.CaseBranch
    naming:
      summary: >-
        A case's branch with what the forge has seen of it: the base it forked from and the
        commit pinned there, the branch the tree left, the revision pushed, the pull request
        opened.
    identity:
      name: name
      type: takt.work.BranchName
    fields:
      # The branch the case forked from and the pull request targets; absent when the tree was
      # detached or on a case branch without a recorded base, and then `pr.open` refuses with
      # nothing pushed, never defaults.
      # read from: crates/takt/src/case.rs:192-196
      - name: base
        type: Optional<String>
      # The commit the case's branch forked from, pinned at open: what the gate validator reads
      # the gates document and the project file from, whatever the base branch names later.
      # Absent for a case opened before it was recorded, whose gate then writes no record.
      # read from: crates/takt/src/case.rs:197-201
      # read from: crates/takt/src/validator.rs:212-213
      - name: base_commit
        type: Optional<takt.work.Revision>
      # The branch the tree was on when the case opened, what discarding the case returns to;
      # absent when it was detached.
      # read from: crates/takt/src/case.rs:202-205
      - name: left
        type: Optional<String>
      # read from: crates/takt/src/case.rs:206-209
      - name: pushed
        type: Optional<takt.work.Revision>
      # read from: crates/takt/src/case.rs:210-212
      - name: pull_request
        type: Optional<Integer>
    # The branch exists from the case open until the case is discarded; pushed and the pull
    # request are data on it, not states.
    lifecycle:
      initial: Created
      states: [Created]
      terminal: [Created]

  # A scenario: one story of the scratch repository at a known seed commit, run from a fresh base
  # branch `trial/<n>` cut from that commit, with the predicates findings name against it.
  # Declared ahead of the code (story:scenario-corpus).
  # UNMAPPED: whether a scenario may later name several stories; one is declared.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scenario corpus)
  # read from: .engineering/planning/story/scenario-corpus.md
  - name: takt.work.Scenario
    naming:
      summary: >-
        A story of the scratch repository at a seed commit, run from a fresh trial base each time,
        so every run of it starts from the same state.
    identity:
      name: id
      type: takt.work.ScenarioId
    fields:
      - name: seed
        type: takt.work.Revision
        summary: The commit each run's `trial/<n>` base is cut from.
      - name: story
        type: takt.work.StoryId
        summary: The scratch repository's story the scenario runs.
    relations:
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A scorecard: per scenario run, outcome, steps, tokens, refusals, NoProgress and errors and
  # wall time, read from the runs' events under `.engineering/cases/` only, each compared with the
  # promoted baseline's run of the same scenario. Declared ahead of the code (story:scorecard-reader);
  # the run events it reads are not built either (story:run-record-and-story-evidence).
  # UNMAPPED: whether a scorecard covers one candidate revision or a period, and so its relation
  # to scenario runs; no relation is declared.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  # read from: .engineering/planning/story/scorecard-reader.md
  - name: takt.work.Scorecard
    naming:
      summary: >-
        The figures of a set of scenario runs at one takt revision, each compared with the
        promoted baseline; a promotion reads it.
    identity:
      name: id
      type: takt.work.ScorecardId
    fields:
      - name: revision
        type: takt.work.Revision
        summary: The takt revision the runs were taken with.
      - name: baseline
        type: takt.work.Revision
        summary: The promoted revision the runs are compared with.
      - name: comparison
        type: takt.work.Comparison
        summary: no_regression when no scenario run is worse than the baseline's.
    lifecycle:
      initial: Computed
      states: [Computed]
      terminal: [Computed]

  # A promotion: the takt binary installed for runs, built from a named revision whose scorecard
  # showed no regression. Declared ahead of the code (story:promotion).
  # UNMAPPED: whether one scorecard may back more than one promotion.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ The judge)
  # read from: .engineering/planning/story/promotion.md
  - name: takt.work.Promotion
    naming:
      summary: >-
        The takt binary installed for runs, the revision it was built from and the scorecard that
        allowed it.
    identity:
      name: id
      type: takt.work.PromotionId
    fields:
      - name: revision
        type: takt.work.Revision
        summary: The revision the installed binary embeds in `--version`.
      - name: scorecard
        type: takt.work.ScorecardId
    relations:
      - name: scorecard
        kind: references
        target: takt.work.Scorecard
        cardinality: one
        via: scorecard
    lifecycle:
      initial: Promoted
      states: [Promoted]
      terminal: [Promoted]

  # A finding: a defect of takt filed in the planning store as one draft story or one open
  # blocker, carrying the reference `finding:<key>`, an `expected_before` predicate a machine can
  # check (a command run on a named scenario, with the exit status or the output it gives while
  # the defect is present) and the path of the run record or review that produced it.
  # `scripts/file-finding` files it through `aep plan artifact new`, refusing a key the store
  # holds and a predicate that does not parse, with nothing written; `scripts/check-finding` runs
  # the predicate in a clone of the scenario's seed with a takt built from a given revision.
  # UNMAPPED: whether a finding may need several scenarios; one is declared.
  # read from: .engineering/planning/design/recursive-self-improvement.md:55-60
  # read from: .engineering/planning/story/finding-intake.md (§ Domain relations)
  # read from: scripts/file-finding:11-32
  # read from: scripts/file-finding:93
  # read from: scripts/file-finding:156
  # read from: scripts/check-finding:127-154
  - name: takt.work.Finding
    naming:
      summary: >-
        A defect of takt in the planning store, with the predicate that reproduces it on a
        scenario and the record it came from.
    identity:
      name: key
      type: takt.work.FindingKey
    fields:
      - name: artifact
        type: String
        summary: The store artifact the finding is, `story:<key>` or `blocker:<key>`.
      - name: scenario
        type: takt.work.ScenarioId
        summary: The scenario the predicate runs on.
      - name: command
        type: String
        summary: >-
          One shell line, run in a fresh clone of the scenario's seed with `$TAKT` the takt binary
          under test.
      - name: exit
        type: Optional<Integer>
        summary: The exit status the command gives while the defect is present.
      - name: output
        type: Optional<String>
        summary: A fixed string the command's output holds while the defect is present.
      - name: source
        type: String
        summary: The run record or review that produced the finding, a path in the repository.
    relations:
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
    lifecycle:
      initial: Filed
      states: [Filed]
      terminal: [Filed]
