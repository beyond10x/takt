  # Decided 2026-10-19 (story:promotion-judged-against-the-series-baseline): a candidate is
  # judged against the latest record that is no refusal, over the whole corpus, and also against
  # the record that starts its series on that record's scenarios, each by the same comparison
  # (takt.work.Comparison), so steps each within the rule against the one before cannot add up
  # past the series start. A series starts only at a `baseline` or at a `rebaseline` under a
  # newer metric definition (takt.work.PromotionKind); a rebaseline that only adds a scenario
  # keeps the series start, and the scenario it adds is judged against that rebaseline, so an
  # added scenario resets no drift. A candidate worse than any of them is refused (exit 3) and
  # the refusal recorded; one worse than a series record alone is refused naming that record and
  # each scenario worse than it. A record that is the latest is compared once. Every promotion
  # and refusal names its series start (`series_start`), checked on read as `rejudges` is, a
