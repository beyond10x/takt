      # read from: crates/takt-cli/src/main.rs:417-425
      - name: layers
        type: Optional<Map<takt.work.LayerName, String>>
        summary: >-
          The run's layers (ADR 0101): its `opened` line's `layers`, the harness layer joined
          from the version its harness steps' lines state and the model layer from the model
          they state (several, distinct, joined by `+`); absent
          when the line has no `layers`, "layers not recorded", never a revision. `takt
          scorecard` prints each distinct set with its runs' count and refuses to score runs
          whose layers differ, naming the layer and the runs (a run that recorded none beside one
          that did, or a layer one run states and another does not, differ too), unless
          `--across-layers` asks to compare across them. A run that took no harness step
