  # the case wrote, the instant that record's own `observed_at`, and the commit on the case's
  # branch that holds it. The line is written with the commit, which a line that cannot be
  # written takes back; a write kept under the case's current revision and committed above it
  # is not made again, and one of an earlier revision is made again for the current one. The
  # instant given to the store is `observed_at`, apart from
  # the line's own `at`, which it would otherwise shadow.
  # read from: crates/takt/src/events.rs:116-127
  # read from: crates/takt/src/run.rs:3572-3635
  # read from: crates/takt/src/run.rs:3811-3850
  # read from: crates/takt/src/frontier.rs:247-251
  # read from: crates/takt/src/frontier.rs:320-332
  - name: takt.work.RunStoreEvidence
    kind: struct
    fields:
      - name: story
        type: takt.work.StoryId
      - name: kind
        type: takt.work.EvidenceKindId
      - name: reference
        type: String
      - name: observed_at
        type: Timestamp
      - name: commit
        type: Optional<takt.work.Revision>

  # The story moved in the planning store through `aep plan artifact move`, to `implemented`, as
  # `agent:takt`, and the commit on the case's branch that holds the move, written with it as
  # above; not made when the story at the case's current revision is already `implemented`
  # (moved below it at an earlier revision), which counts as the move written.
  # read from: crates/takt/src/events.rs:128-135
  # read from: crates/takt/src/run.rs:3659-3675
  - name: takt.work.RunStoreMove
    kind: struct
    fields:
      - name: story
        type: takt.work.StoryId
      - name: to
        type: takt.work.StoryStatus
      - name: commit
        type: Optional<takt.work.Revision>

  # A refusal: `by` is `takt`, a step the kernel discarded (one that wrote into the cases
  # directory, or onto the judge surface, anywhere under `.engineering/` but the cases among it,
  # as git or the snapshot sees it, among them) or a write it would not make, or `store`, the
  # planning store's refusal; the
  # reason verbatim. A refusal of the store is relayed, never retried, and leaves the stop as
