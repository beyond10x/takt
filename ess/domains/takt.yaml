  # read from: crates/takt/src/improvement.rs:398-467
  - name: takt.work.EvidenceProducer
    naming:
      summary: >-
        A validator: the one protocol action it performs, the one evidence kind it writes, and the
        one artifact its records are about, under the name its records carry as `producer`.
    identity:
      name: name
      type: takt.work.ProducerName
    fields:
      # read from: crates/takt/src/validator.rs:49-50
      - name: action
        type: takt.work.ActionId
      # read from: crates/takt/src/validator.rs:51-52
      - name: kind
        type: takt.work.EvidenceKindId
      # read from: crates/takt/src/validator.rs:53-54
      - name: subject
        type: takt.work.ArtifactId
    # A validator is registered with the run that holds it; nothing moves it. The gate validator
    # is registered only when its document is a file; the three forge validators only when the
    # forge is `bot`; the loop scorecard's three always, due only in a `loop.improvement/1` case,
    # whose protocol alone has their actions; an improvement turn's seven always, due only in a
    # `self.improvement/1` case, the merge validators reading the forge's `main` or, with no
    # forge, the local `main`.
    # read from: crates/takt-cli/src/main.rs:920-931
    # read from: crates/takt-cli/src/main.rs:1112-1116
    # read from: crates/takt-cli/src/main.rs:933-937
    # read from: crates/takt-cli/src/main.rs:938-948
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  # The branch a case lives on, recorded as `branch.yaml` under the case directory: forked at open
  # from its base, never from another case's commits (on a plain branch the base is that branch
  # and the fork is HEAD; on another case's branch the base is that case's recorded base and the
  # fork is the base's tip, a branch whose name after `takt/` is no case id refused before it is
  # read as one), with the commit it forked from, the branch the tree was on at open,
  # the revision last pushed through the forge and the pull request opened for it; removed with
  # the case, the tree back on the branch it left. The branch pushed and opened for is computed
  # from the case id, never taken from the file: a `name` the harness rewrote is set right and the
  # observation says so.
  # read from: crates/takt/src/case.rs:435-436
  # read from: crates/takt/src/case.rs:402-429
  # read from: crates/takt/src/case.rs:50-78
  # read from: crates/takt/src/validator.rs:1187-1191
  # read from: crates/takt/src/validator.rs:1283
  - name: takt.work.CaseBranch
    naming:
      summary: >-
        A case's branch with what the forge has seen of it: the base it forked from and the
        commit pinned there, the branch the tree left, the revision pushed, the pull request
        opened.
    identity:
      name: name
      type: takt.work.BranchName
    fields:
      # The branch the case forked from and the pull request targets; absent when the tree was
      # detached or on a case branch without a recorded base, and then `pr.open` refuses with
      # nothing pushed, never defaults.
      # read from: crates/takt/src/case.rs:409-413
      - name: base
        type: Optional<String>
      # The commit the case's branch forked from, pinned at open: what the gate validator reads
      # the gates document and the project file from, whatever the base branch names later.
      # Absent for a case opened before it was recorded, whose gate then writes no record.
      # read from: crates/takt/src/case.rs:414-418
      # read from: crates/takt/src/validator.rs:704-705
      - name: base_commit
        type: Optional<takt.work.Revision>
      # The branch the tree was on when the case opened, what discarding the case returns to;
      # absent when it was detached.
      # read from: crates/takt/src/case.rs:419-422
      - name: left
        type: Optional<String>
      # read from: crates/takt/src/case.rs:423-426
      - name: pushed
        type: Optional<takt.work.Revision>
      # read from: crates/takt/src/case.rs:427-429
      - name: pull_request
        type: Optional<Integer>
    # The branch exists from the case open until the case is discarded; pushed and the pull
    # request are data on it, not states.
    lifecycle:
      initial: Created
      states: [Created]
      terminal: [Created]

  # A scenario: one story of the scratch repository at a known seed commit, run from a fresh base
  # branch `trial/<n>` cut from that commit, with the predicates findings name against it.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scenario corpus)
  # read from: .engineering/planning/story/scenario-corpus.md
  # A repository declares its scenarios in `.engineering/scenarios.conf`, git's configuration
  # syntax, one section a scenario, `[scenario "<id>"]` with `story` and `seed`, read at a revision
  # (`--declared-on`, `main` when not given) without a checkout. The id is letters, digits, `-`
  # and `_`, so it can name a case and a branch. A section that gives `story` or `seed` twice, or
  # a key takt does not read, is refused: a scenario names exactly one story.
  # read from: crates/takt-cli/src/main.rs:258-260
  # read from: crates/takt-cli/src/main.rs:268-270
  # read from: crates/takt-cli/src/main.rs:1219-1225
  # read from: crates/takt-cli/src/main.rs:1256-1258
  - name: takt.work.Scenario
    naming:
      summary: >-
        A story of the scratch repository at a seed commit, run from a fresh trial base each time,
        so every run of it starts from the same state.
    identity:
      name: id
      type: takt.work.ScenarioId
    fields:
      - name: seed
        type: takt.work.Revision
        summary: The commit each run's `trial/<n>` base is cut from.
      - name: story
        type: takt.work.StoryId
        summary: The scratch repository's story the scenario runs.
    relations:
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A scorecard: per case and per run of it, outcome, steps, tokens, refusals, NoProgress and
  # errors and wall time, taken from the runs' events under `.engineering/cases/` only, and a
  # list of the cases with no record. Saved, it holds every run's figures and the version of each
  # metric's definition. Compared with a saved one, scenario by scenario over cases: a scenario
  # is worse when, for some outcome rank, the share of its cases at that rank or better is below
  # the saved share, under the current definition whatever the saved version
  # (takt.work.Comparison); a side with fewer cases than the rule's trials, none included, gets no
  # verdict; tokens are printed as n, minimum, median and maximum per scenario and
  # side with the difference of the medians, and never make a scenario worse; a metric whose
  # definition's version differs is printed with both figures. Which saved scorecard is the
  # promoted baseline is story:promotion's.
  # A scorecard covers one takt revision, the one its saved file `scorecard-<revision>.json` is
  # named by, decided 2026-10-18; its scenario runs are its rows, each naming its case, held as
  # values (takt.work.ScorecardRow) rather than a relation, since a relation is carried by a field
  # of the entity typed by the target's identity.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  # read from: .engineering/planning/story/scorecard-reader.md
  # read from: .engineering/planning/story/scorecard-reader.md:50-52
  # read from: crates/takt/src/scorecard.rs:1-35
  # read from: crates/takt/src/scorecard.rs:47-76
  # read from: crates/takt/src/scorecard.rs:324-347
  # read from: crates/takt/src/scorecard.rs:974-1182
  - name: takt.work.Scorecard
    naming:
      summary: >-
        The figures of a set of scenario runs at one takt revision, each compared with the
        promoted baseline; a promotion reads it.
    identity:
      name: id
      type: takt.work.ScorecardId
    fields:
      - name: format
        type: String
        summary: takt-scorecard/1.
      - name: revision
        type: Optional<takt.work.Revision>
        summary: >-
          The one takt revision the scorecard covers, which names the saved file; absent before it
          is saved.
      - name: named_by
        type: Optional<takt.work.ScorecardNaming>
        summary: What named it.
      - name: metrics
        type: Map<String, Integer>
        summary: Each metric with the version of the definition its figures were taken under.
      - name: rows
        type: List<takt.work.ScorecardRow>
        summary: One a run, in case order, each case's runs in the order they ran.
      - name: no_record
        type: List<takt.work.CaseId>
        summary: >-
          The cases with no record, listed and never guessed; and each case with runs whose
          `binary.txt` does not read, its reason in `unstated`.
      - name: unstated
        type: Map<takt.work.CaseId, String>
        summary: >-
          Each case listed in `no_record` for a `binary.txt` that does not read, with the
          reason; its runs count and state no binary. Empty on a file saved before the field.
      - name: rule
        type: takt.work.ScorecardRule
        summary: >-
          The rule a comparison with this scorecard applies, trials and margin; the default for
          a file saved before the rule had fields.
    relations:
      - name: no_record
        kind: references
        target: takt.work.Case
        cardinality: many
        via: no_record
    lifecycle:
      initial: Computed
      states: [Computed]
      terminal: [Computed]

  # A promotion: the takt binary installed for runs, built from a named revision whose scorecard
  # showed no regression (story:promotion, `takt promote`).
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ The judge)
  # read from: .engineering/planning/story/promotion.md
  # read from: crates/takt/src/promotion.rs:1-55
  # The promotion record names the revision the binary embeds and the scorecard it read, and the
  # latest record that is no refusal names the promoted baseline the next candidate is compared
  # with; the first is written by `takt promote --baseline-only`, which installs nothing. A
  # candidate is refused when a scenario is worse than the baseline's under the scorecard's rule
  # (takt.work.Comparison), and that refusal is recorded; before any comparison, when another
  # promotion was made the same UTC day (naming it), when the revision is recorded already, when a
  # scenario has fewer candidate cases than the rule's trials, when the scorecard lies inside the
  # repository or is not named by a full commit id equal to the checkout's `HEAD`, or when the
  # checkout has uncommitted changes, or when the installed binary's `--version` does not name
  # the latest baseline or promotion recorded (a record removed from the end of the store, or a
  # binary replaced by hand; a binary that names no revision is checked by its sha256 against
  # the record's `binary_sha256` when the record carries one, and refused naming both digests
  # otherwise). A candidate that holds is built from a fresh clone of the exact
  # commit, its binary's `--version` checked to name the revision (no `-dirty`, no `unknown
  # revision`), installed with `cargo install --locked --path crates/takt-cli` into a fresh
  # root, checked again, hashed, recorded, then moved into place in one rename and checked once
  # more in place against the revision and the digest; `--dry-run` prints the verdict and the
  # record and writes nothing.
  # read from: .engineering/planning/story/promotion.md:39-44
  # read from: .engineering/planning/story/promotion.md:52-54
  # read from: .engineering/planning/story/promotion.md:141
  # read from: crates/takt/src/promotion.rs:1014-1020
  # read from: crates/takt/src/promotion.rs:1554-1665
  # read from: crates/takt/src/promotion.rs:2042-2240
  # read from: crates/takt/src/promotion.rs:2246-2537
  # Where it is kept, decided 2026-10-18: one JSON file per promotion at
  # `$XDG_STATE_HOME/takt/promotions/<revision>.json` (`~/.local/state/takt/promotions/` without
  # `XDG_STATE_HOME`; a refusal as `<revision>.refused.json`; the scorecard a baseline or a
  # promotion read copied as `<revision>.scorecard.json`), outside every repository a candidate
  # changes, which the scorecard-reader review asked for and `takt promote` refuses to break; the
  # latest record by `promoted_at` that is no refusal is the baseline, and the comparison reads
  # its scorecard copy after checking its digest. `promoted_at` is the instant the one-a-UTC-day
  # rule reads, and `kind` tells the records apart (takt.work.PromotionKind). The store is read
  # fail-closed: a file that is no record or copy, a record whose name, kind or instant disagrees
  # with its content, a copy with another digest, or a copy without its record refuses every
  # promotion until someone looks. A record is never overwritten. Decided 2026-10-19 after the
  # second review: the build runs confined in bubblewrap (`bwrap`, its own process and network
  # namespaces, dying with takt), where only the fresh clone, a scratch `CARGO_HOME` holding
  # read-only binds of the host's registry cache and index, the toolchain takt resolves itself
  # (rustup's default toolchain as its settings file names it, cargo and its sibling rustc,
  # never one found on PATH, never a rustup proxy, never one the commit names: a committed
  # `rust-toolchain.toml` with a `path` is refused) and the system directories are visible, with
  # the environment cleared and `cargo build --locked --offline` called on the toolchain's own
  # binary; the store, the install root and the real home are not mounted, so nothing the commit
  # runs reads a setting outside it, writes into the store or outlives the build, and every run
  # of the candidate's binary during a promotion is confined the same way; a missing `bwrap` is
  # refused by name, never built around. The store holds an exclusive lock (`.lock`, `flock`)
  # from its reading to its writing, so two promotions at once record one. The record is written
  # before the binary moves into place, and a failure after the move puts the binary before it
  # back and removes the record, so exit 1 and exit 5 both leave nothing recorded and the
  # installed binary unchanged. Each record carries the digest of the record before it
  # (`previous_sha256`, absent on the first), and a chain with a gap refuses naming it;
  # `--baseline-only` requires the installed binary to name the revision it records; and
  # `promoted_at` is read after the build.
  # read from: .engineering/planning/story/promotion.md:92-95
  # read from: .engineering/planning/story/promotion.md:116
  # read from: .engineering/planning/story/promotion.md:152
  # read from: crates/takt/src/promotion.rs:310-313
  # read from: crates/takt/src/promotion.rs:506-534
  # read from: crates/takt/src/promotion.rs:554-724
  # read from: crates/takt/src/promotion.rs:1133-1187
  # A baseline for a binary built before `--version` named its revision, decided 2026-10-19
  # (story:baseline-for-a-pre-revision-binary): the operator states both, `takt promote
  # --baseline-only --revision <sha> --binary-sha256 <hex>`. Either flag without
  # `--baseline-only`, `--binary-sha256` without `--revision`, a `--revision` that is no full
  # commit id or not the scorecard's, or a `--binary-sha256` that is no sha256 is refused by
  # name. With both, before anything is written: the installed binary must name no revision (one
  # whose `--version` names a revision is recorded by it, and the flags are refused) and hash to
  # `<hex>`, a mismatch refused naming both digests; and every run of the scorecard must state
  # `<hex>` (takt.work.RunBinary, from its `binary.txt`), stated by the operator, a run that
  # states none, states it by anything but the operator (a saved row's `stated_by: record`) or
  # states another digest refused naming the run, so the scorecard recorded is the stated
  # binary's and every statement the record copies is the operator's. The record then
  # holds the revision, marked `revision_stated_by: operator`, the installed binary's path and
  # digest, and each run with its statement and note (takt.work.RecordedRun); `--revision` alone
  # asks the binary to name itself as without it. The next candidate's check of the installed
  # binary then reads the digest: when the latest record's revision is stated
  # (`revision_stated_by`), the installed binary passes when it hashes to the record's
  # `binary_sha256` and is refused naming both digests when it does not, whatever its
  # `--version` prints, so a replacement printing the stated revision is refused, and such a
  # record without a digest is refused naming it. Against any other record a binary whose
  # `--version` names no revision passes when it hashes to the record's `binary_sha256`, and is
  # refused naming both digests when it does not, or naming the record when it carries none; a
  # binary that names a revision is checked by it as before. The chain, the lock and the
  # fail-closed reads are untouched. A run whose `opened` line names no revision (no `binary`, or
  # `unknown revision`) beside a run whose line names one is refused naming it, the mix a save
  # refuses (story:scorecard-save-checks-binary, decided 2026-10-19).
  # read from: crates/takt/src/promotion.rs:1895-1930
  # read from: crates/takt/src/promotion.rs:1932-1957
  # read from: crates/takt/src/promotion.rs:1959-2015
  # read from: crates/takt/src/promotion.rs:1803-1842
  # One scorecard backs at most one promotion, decided 2026-10-18: one-to-one, the promotion
  # referencing its scorecard. A relation entry carries no bound on the scorecard's side, so the
  # bound is stated here.
  # read from: .engineering/planning/story/promotion.md:90
  # The rule's parameters, trials and margin, are recorded with the scorecard
  # (takt.work.ScorecardRule) and copied into the record that read it.
  # read from: .engineering/planning/design/recursive-self-improvement.md:132-138
  # read from: crates/takt/src/promotion.rs:143-203
  # Decided 2026-10-19 (story:promote-binds-scorecard-and-merge,
  # story:promotion-refusal-is-not-final): a promotion installs a merged revision only, an
  # ancestor of the tip of the checkout's remote-tracking `origin/main` as last fetched, which a
  # local `main` moved by hand does not move, a checkout without one refused naming it; every run
  # of the candidate's scorecard was made with the binary of that revision, as the run's
  # `opened` line names it, another revision, the revision `-dirty` or none refused naming the
  # first such run (`--baseline-only` holds to the same check; a stated baseline checks its
  # `binary.txt` statements, and a run of it whose `opened` line names a revision must name the
  # stated one); and every scenario run carries its held-out result
  # (takt.work.HeldOut). Every scenario the candidate has, the baseline's or its own, holds the
  # rule's trials on the candidate's side, so a candidate never becomes a baseline with a
  # scenario that judges nothing. A refused revision, or its tree under another commit, is judged
  # again with `--rejudge` on a scorecard of new runs, sharing no case with one it was refused
  # on (takt.work.PromotionKind), and the record names the latest refusal before it
  # (`rejudges`), which the store verifies on every read: a `rejudges` naming no refusal of
  # the record's revision or tree before it in the chain, by file name and sha256, refuses every
  # promotion; `--rejudge` without a refusal or with `--baseline-only` is refused.
  # Accepted limits, stated 2026-10-19 after the review: `origin/main` is read as the checkout
  # last fetched it, so `git update-ref` on it without a fetch passes the ancestry check; and
  # `--rejudge` tells new runs by their case ids, so refused runs copied under new case ids are
  # judged again.
  # read from: .engineering/planning/story/promote-binds-scorecard-and-merge.md (§ Outcome)
  # read from: .engineering/planning/story/promotion-refusal-is-not-final.md (§ Outcome)
  # read from: crates/takt/src/promotion.rs:1668-1746
  # read from: crates/takt/src/promotion.rs:2301-2367
  # read from: crates/takt/src/promotion.rs:2735-2774
  # read from: crates/takt/src/promotion.rs:881-914
  # Decided 2026-10-19 (story:promotion-chain-head-anchored): the chain's last record is anchored
  # by its head (takt.work.PromotionHead), written by every write of a record and pointed back by
  # the removal of one after a failed install. Every read checks it, `--dry-run` included: a
  # record the head names whose file hashes to another digest is refused as replaced before the
  # record is read, and a chain that ends before the head, the record it names missing, or runs
  # past it is refused naming the record, so deleting the latest refusal no longer lets its
  # revision be judged again. A store with records and no head is read on trust once: the head
  # is written from the chain as it stands and stderr says so; a dry run says so and writes no
  # head. Accepted limit, stated with the decision: the head detects a record removed or
  # replaced by accident or by a tool; a process running as the same user can rewrite both, and
  # a store whose head was removed is read on trust again.
  # read from: .engineering/planning/story/promotion-chain-head-anchored.md:28
  # read from: .engineering/planning/story/promotion-chain-head-anchored.md:50-53
  # read from: crates/takt/src/promotion.rs:315-459
  # read from: crates/takt/src/promotion.rs:554-588
  # read from: crates/takt/src/promotion.rs:1163-1215
  - name: takt.work.Promotion
    naming:
      summary: >-
        The takt binary installed for runs, the revision it was built from and the scorecard that
        allowed it; or the record of a candidate refused on its scorecard.
    identity:
      name: id
      type: takt.work.PromotionId
    fields:
      - name: revision
        type: takt.work.Revision
        summary: >-
          The revision the installed binary embeds in `--version`, a full commit id; the
          candidate's on a refusal; the one the operator stated on a baseline of a binary that
          names none.
      - name: revision_stated_by
        type: Optional<takt.work.StatedBy>
        summary: >-
          Who stated `revision` when the binary could not: the operator, by `--revision`, on a
          baseline of a binary whose `--version` names no revision; absent when the binary named
          it.
      - name: tree
        type: takt.work.Revision
        summary: The tree of that commit, so the same tree under another commit is known.
      - name: scorecard
        type: takt.work.ScorecardId
        summary: The saved scorecard read, by its id, the revision that names it.
      - name: scorecard_file
        type: String
        summary: The saved scorecard's file as given, an absolute path outside the repository.
      - name: scorecard_sha256
        type: String
        summary: >-
          The sha256 of the scorecard read; the store's copy of it, `<revision>.scorecard.json`,
          must match it when read.
      - name: promoted_at
        type: Timestamp
        summary: When the record was written, RFC 3339 in UTC; the one-a-UTC-day rule reads it.
      - name: kind
        type: takt.work.PromotionKind
        summary: Whether the record installed a binary, recorded the first baseline or refused a candidate.
      - name: against
        type: Optional<takt.work.Revision>
        summary: The baseline revision the scorecard was compared with; absent on a baseline record.
      - name: rule
        type: takt.work.ScorecardRule
        summary: The rule the comparison applied.
      - name: worse
        type: Integer
        summary: The scenarios the comparison marked worse; 0 unless the record is a refusal.
      - name: binary
        type: Optional<String>
        summary: >-
          The installed binary's path; present on a promotion and on a baseline the operator
          stated, whose binary was hashed against the statement.
      - name: binary_sha256
        type: Optional<String>
        summary: >-
          The installed binary's sha256, lower-case hex; present on a promotion and on a baseline
          the operator stated, where it is the digest stated and checked.
      - name: runs
        type: List<takt.work.RecordedRun>
        summary: >-
          On a baseline the operator stated, each run of the scorecard with the binary it states,
          every digest `binary_sha256`; empty on every other record.
      - name: previous_sha256
        type: Optional<String>
        summary: >-
          The sha256 of the record written before this one, lower-case hex, so a record removed
          from between two is noticed; absent on the first record only.
      - name: rejudges
        type: Optional<takt.work.Rejudged>
        summary: >-
          On a candidate judged again with `--rejudge`, the latest refusal of its revision or
          tree; absent on every other record and on one written before the field.
      - name: replaces_sha256
        type: Optional<String>
        summary: >-
          On a rebaseline, the sha256 of the baseline's scorecard it replaces; absent on every
          other record and on one written before the field.
      - name: cases
        type: List<takt.work.CaseId>
        summary: >-
          On a refusal, the case ids of the scorecard refused, so a candidate judged again is
          judged on new runs only; empty on every other record and on one written before the
          field.
    relations:
      - name: scorecard
        kind: references
        target: takt.work.Scorecard
        cardinality: one
        via: scorecard
      - name: cases
        kind: references
        target: takt.work.Case
        cardinality: many
        via: cases
    lifecycle:
      initial: Promoted
      states: [Promoted]
      terminal: [Promoted]

  # A finding: a defect of takt filed in the planning store as one draft story or one open
  # blocker, carrying the reference `finding:<key>`, an `expected_before` predicate a machine can
  # check (a command run on a named scenario, or on a named repository at a seed commit, with the
  # exit status or the output it gives while the defect is present) and the path of the run
  # record or review that produced it. `scripts/file-finding` files it through
  # `aep plan artifact new`, refusing a key the store holds and a predicate that does not parse,
  # with nothing written; `scripts/check-finding` runs the predicate in a clone of the scenario's
  # seed, or of the repository at its seed, with a takt built from a given revision in a checkout
  # of it, fetched through git's transport with every object hashed and checked, so the binary
  # names that revision and no object overwritten in the store is built. The predicate's command runs under bubblewrap
  # with every host path read-only but its clone and its own home; the caller's home and the
  # user's passwd home hidden (a path under them, the repository's among them, is refused as
  # read-only or as not there); /tmp and /run its own; and in network, IPC and PID namespaces
  # of its own, so it reaches no network, no abstract socket and no socket under /run, and no
  # process it starts outlives it. A socket the host holds elsewhere stays in sight where the
  # user may open it. No descriptor above 2 the caller left open reaches it, nor the build.
  # Bubblewrap's status reaches the check on a pipe, and its exit is the command's only when
  # its last line is the `exit-code` of that same status.
  # read from: .engineering/planning/design/recursive-self-improvement.md:81-86
  # read from: .engineering/planning/story/finding-intake.md (§ Domain relations)
  # read from: .engineering/planning/story/finding-on-any-repository.md (§ Outcome)
  # read from: .engineering/planning/story/check-finding-builds-name-their-revision.md (§ Outcome)
  # read from: scripts/file-finding:11-56
  # read from: scripts/file-finding:117
  # read from: scripts/file-finding:256
  # read from: scripts/check-finding:218-450
  # read from: scripts/check-finding:496-525
  # One predicate on one scenario or one repository: a body with a second `expected_before`
  # block, a block that gives a key twice, or one that gives both `scenario` and `repository`, or
  # neither, is malformed and nothing is filed. `seed` and `test` go with `repository` only: a
  # scenario's seed is the scenario repository's to declare. A repository is an `https://` URL
  # and nothing else (a predicate is committed to a public repository and must hold on every
  # machine; the check clones it with no credential of its own), a local checkout standing in
  # for it only through `check-finding --checkout <url>=<path>` at check time; a seed is a commit
  # id. A filed repository names a public host: a dotted DNS name, not `localhost` or a name
  # under it, or a dotted-decimal IPv4 address outside the zero, loopback, private, link-local
  # and shared ranges, and no IPv6 literal. The check is a lint on the URL's text, not a
  # boundary. The command runs the takt under test (`$TAKT` or `${TAKT}` in its text), and an
  # `output` is at least 8 characters; a predicate otherwise is malformed.
  # read from: scripts/file-finding:120
  # read from: scripts/file-finding:125
  # read from: scripts/file-finding:136-196
  # read from: scripts/file-finding:131-135
  # read from: scripts/file-finding:200-203
  # A finding is filed as exactly one store artifact, a story or a blocker, and that artifact is
  # filed for that finding alone (its id is `<kind>:<key>`, the finding's key): one-to-one,
  # decided 2026-10-18, held in `artifact` (takt.work.FindingArtifact). A relation entry needs a
  # field typed by the target's identity, and the story variant sits inside a union beside a
  # blocker this specification does not declare, so no relation to takt.work.Story is declared and
  # the one-to-one is stated here.
  # read from: scripts/file-finding:308
  # read from: .engineering/planning/story/finding-intake.md:51
  - name: takt.work.Finding
    naming:
      summary: >-
        A defect of takt in the planning store, with the predicate that reproduces it on a
        scenario or on a repository at a seed, and the record it came from.
    identity:
      name: key
      type: takt.work.FindingKey
    fields:
      - name: artifact
        type: takt.work.FindingArtifact
        summary: The store artifact the finding is, `story:<key>` or `blocker:<key>`.
      - name: scenario
        type: Optional<takt.work.ScenarioId>
        summary: >-
          The scenario the predicate runs on; absent when the predicate names its repository.
      - name: repository
        type: Optional<String>
        summary: >-
          The repository the defect was seen on, an `https://` URL; absent when the predicate
          names a scenario. One of `scenario` and `repository` is given.
      - name: seed
        type: Optional<takt.work.Revision>
        summary: >-
          With `repository`: the commit the task starts from, which the check clones and checks
          out.
      - name: test
        type: Optional<String>
        summary: >-
          With `repository`, optional: the task's test command, handed to the command as `$TEST`.
      - name: command
        type: String
        summary: >-
          One shell line, run in a fresh clone of the scenario's seed, or of the repository at
          its seed, with `$TAKT` the takt binary under test.
      - name: exit
        type: Optional<Integer>
        summary: The exit status the command gives while the defect is present.
      - name: healthy_exit
        type: Optional<Integer>
        summary: >-
          The exit status the command gives once the defect is gone, 0 when absent; the one
          status the check reads as not reproduced. An `exit` equal to it needs `output`.
      - name: output
        type: Optional<String>
        summary: A fixed string the command's output holds while the defect is present.
      - name: source
        type: String
        summary: The run record or review that produced the finding, a path in the repository.
    relations:
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
    lifecycle:
      initial: Filed
      states: [Filed]
      terminal: [Filed]

  # A trial base: the branch `trial/<n>` a scenario run cuts from its scenario's seed commit,
  # after fetching the remote's `trial/*` branches, `<n>` one past the highest `trial/<n>` the
  # checkout then knows, local or remote; a name under `trial/` that is not all digits is no
  # trial base, and a number past the largest is refused, never wrapped. The run pushes it
  # through the bot route with a lease that only lets it create the branch, then opens the case
  # `scenario-<id>-trial-<n>` for the scenario's story, whose pull request targets the trial
  # branch; it is refused before anything is cut when that case or its branch exists, so a trial
  # base has one case, or when the case id is not one `check_id` accepts. A refusal before the
  # push removes the branch and puts the tree back;
  # nothing is reset by a force-push: the next run cuts the
  # next number. The branch records neither its scenario nor its case; the case id names both.
  # read from: crates/takt-cli/src/main.rs:244-253
  # read from: crates/takt-cli/src/main.rs:1277-1280
  # read from: crates/takt-cli/src/main.rs:1308-1314
  # read from: crates/takt-cli/src/main.rs:1388-1393
  # read from: .engineering/planning/design/recursive-self-improvement.md:93-95
  - name: takt.work.TrialBranch
    naming:
      summary: >-
        A fresh base `trial/<n>` cut from a scenario's seed for one scenario run, the base its
        case's pull request targets.
    identity:
      name: number
      type: takt.work.TrialNumber
    fields:
      - name: scenario
        type: takt.work.ScenarioId
        summary: The scenario whose run cut it, as the case id names it.
      - name: seed
        type: takt.work.Revision
        summary: The scenario's seed commit the branch was cut at.
      - name: case
        type: takt.work.CaseId
        summary: The case the run opened on it, `scenario-<id>-trial-<n>`.
    relations:
      # A scenario is run many times, each from its own trial base; the base outlives the
      # scenario's declaration, which is read at a revision.
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
      # One trial base, one case; discarding the case returns the tree to the branch it left
      # (takt.work.Case), the trial base, which stays.
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
    # A trial base is cut and pushed once and never moved by takt.
    lifecycle:
      initial: Cut
      states: [Cut]
      terminal: [Cut]

  # The delegation record, `.engineering/delegations.yaml`: the owner's delegations of a grant
  # reserved for the owner to a named agent role, each with its revocation once revoked, read
  # like the allow-list at the merge target's tip as the forge reports it, never from the
  # candidate's tree, so a candidate's own edit of it counts for nothing. The file is itself a
  # judge surface: adding, widening or revoking a delegation is a change only the owner's grant
  # merges. One that is absent or does not read delegates nothing.
  # read from: .engineering/planning/story/judge-guard.md:57-63
  # read from: .engineering/planning/story/judge-guard.md:121
  # Decided by the planner (story:judge-guard, D3, D7): both files are read at the merge target's
  # tip as the forge reports it; a forge that cannot report it merges nothing.
  # read from: crates/takt/src/validator.rs:1694-1696
  # read from: crates/takt/src/validator.rs:2187-2193
  # read from: crates/takt/src/forge.rs:345-348
  - name: takt.work.DelegationRecord
    naming:
      summary: >-
        The owner's delegations of judge-surface grants to agent roles, each revocable, read at the
        tip of the branch the pull request targets.
    identity:
      name: path
      type: String
    fields:
      - name: delegations
        type: List<takt.work.Delegation>
    # The owner edits the file; takt only reads it at the base, so takt moves no state of it.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # The judge allow-list, `.engineering/judge-allow.yaml`: the paths that are not judge surfaces,
  # every other path being one, read at the merge target's tip as the forge reports it. It
  # starts as `docs/**`, `README.md` and `CHANGELOG.md`; adding a path to it is a judge-surface
  # change, and a candidate's own edit of it counts for nothing. Its `paths` are globs in the
  # judge-surface list's dialect (`*` and `?` within a part, `**` across parts), each matching a
  # whole path, case and all; one that is absent admits nothing, and so does one that does not
  # read. The change it is applied to is what the merge does to the target: the tip's tree
  # against the tree `git merge-tree --write-tree` makes of the tip and the granted revision
  # (git 2.38 or later), so a revert of the target's own change hidden by a merge of the target
  # or by an older base is a change like any other, and a merge that conflicts is refused. The
  # target is the pull request's base as the forge reports it; a case whose own record names
  # another base is refused, naming both. The story file takt's take commit changes is exempt
  # only when that commit has the case's base commit as its one parent, exactly the message
  # `takt: take <story>` and that one path, and the story's body below its frontmatter is the
  # same at the tip and in the merge; every other path in the planning store stays guarded.
  # Decided by the planner (story:judge-guard, R1-R3, 2026-10-19).
  # Every change the candidate made from where it meets the target (each merge base of the tip
  # and the revision) is judged besides, and the merge and `change.read`'s comparison run in a
  # bare repository made for the one command, sharing the repository's objects, with no system
  # or global configuration, no attributes from any source and so no merge driver (git 2.32 or
  # later for that; 2.38 for `merge-tree --write-tree`). A story's file holding a carriage return
  # at the tip or in the merge is refused; the take's exemption holds only while the file in the
  # merge is byte for byte the file at the take commit; and the pull request is read again right
  # before the merge, a base other than the one judged merging nothing.
  # Decided by the planner (story:judge-guard, R4-R7, 2026-10-19).
  # An improvement turn's case input `surface` is computed when the turn opens from the list as
  # the baseline (the promoted revision) holds it, over every change from each merge base of the
  # baseline and the candidate to the candidate: `judge` when a path it does not admit, a file
  # of the guard's own (the list, the delegation record) or a path that is no regular file is
  # changed, else `non_judge`; a given `surface` that disagrees is refused, naming the first
  # such path (story:self-improvement-protocol S5, 2026-10-19).
  # read from: protocols/self-improvement/1.yaml:18-22
  # read from: crates/takt/src/improvement.rs:1207-1214
  # read from: .engineering/planning/design/recursive-self-improvement.md:109-110
  # read from: .engineering/planning/story/judge-guard.md:86
  # read from: .engineering/planning/story/judge-guard.md:121
  # read from: .engineering/judge-allow.yaml
  # read from: crates/takt/src/validator.rs:1690-1692
  # read from: crates/takt/src/run.rs:4179-4187
  # read from: crates/takt/src/validator.rs:1958-1962
  # read from: crates/takt/src/validator.rs:1994
  # read from: crates/takt/src/validator.rs:2076
  # read from: crates/takt/src/validator.rs:1890
  # read from: crates/takt/src/git.rs:2346-2347
  # read from: crates/takt/src/validator.rs:1944
  # read from: crates/takt/src/validator.rs:2090
  # read from: crates/takt/src/validator.rs:2440
  # read from: crates/takt/src/git.rs:2226
  - name: takt.work.JudgeAllowList
    naming:
      summary: >-
        The paths that are not judge surfaces, read at the tip of the branch the pull request targets.
    identity:
      name: path
      type: String
    fields:
      - name: paths
        type: List<String>
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A benchmark task: one task of a pinned subset of a public benchmark (Terminal-Bench 2.0,
  # SWE-bench Verified Mini), named by its dataset, the dataset's version and its id there, so a
  # run of it can be repeated. takt sees what the task exposes, the visible test command its
  # `tests.pass` claim runs; the benchmark's own tests are the held-out acceptance and never
  # enter the case, so no field holds them. The task's text is given to the run as its intent
  # and not copied here. Declared ahead of the code (story:bench-nouns-in-ess).
  # read from: .engineering/planning/design/benchmark-integration.md:22-24
  # read from: .engineering/planning/design/benchmark-integration.md:32-33
  # read from: .engineering/planning/design/benchmark-integration.md:37
  # read from: .engineering/planning/story/bench-task-protocol.md:20
  # Maps to bench.case of the organization's benchmark instrument, one task with its expectations
  # and its hidden tests; and the benchmark subset it belongs to maps to bench.corpus, a set of
  # cases pinned to where they came from: takt's design makes each benchmark a bench corpus.
  # read from: .engineering/planning/design/benchmark-integration.md:28
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:115-158
  # UNMAPPED: how a task names its bench case and corpus. A bench case's id is
  # `<corpus-id>/<case_id>`, and a corpus is pinned by a 40-hex `source_commit` where a
  # benchmark names a dataset version; nothing says how one is derived from the other, so no
  # field carries a bench id.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:132-134
  # UNMAPPED: whether takt's own scenarios (takt.work.Scenario) are benchmark tasks too, so that
  # a task references a scenario, and which benchmark tasks join the scenarios the scorecard
  # judges, are not decided.
  # read from: .engineering/planning/design/benchmark-integration.md:41
  # read from: .engineering/planning/story/bench-run-export.md:23
  - name: takt.work.BenchTask
    naming:
      summary: >-
        One task of a pinned benchmark subset, with the visible test command takt may run; the
        benchmark's own tests stay held out.
    identity:
      name: id
      type: takt.work.BenchTaskId
    fields:
      - name: dataset
        type: String
        summary: >-
          The benchmark's dataset as its harness takes it, such as
          `terminal-bench/terminal-bench-2` or `MariusHobbhahn/swe-bench-verified-mini`.
      - name: dataset_version
        type: String
        summary: The version of the dataset the task was pinned from.
      - name: test_command
        type: String
        summary: The visible test command the run's `tests.pass` claim runs.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A benchmark run: one benchmark task under one arm, once, recorded raw as one line of
  # `docs/metrics/bench-runs.jsonl` as a scenario run is: the task, the arm, takt's revision
  # (absent for a free arm and where it was not recorded), the verdict, the raw usage, the wall
  # time with resumes included, and the directory holding the run's case and events. A line is
  # appended and never rewritten. Declared ahead of the code (story:bench-nouns-in-ess).
  # read from: .engineering/planning/design/benchmark-integration.md:36
  # read from: .engineering/planning/story/bench-run-export.md:23
  # read from: docs/metrics/README.md:4-5
  # read from: docs/metrics/README.md:45
  # read from: docs/metrics/README.md:47
  # Maps to bench.run of the organization's benchmark instrument, one arm of one case on one
  # harness, once: takt exports each run in bench's run shape, so bench's grader and fact table
  # cover takt beside the other harnesses.
  # read from: .engineering/planning/design/benchmark-integration.md:28
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:200-233
  # UNMAPPED: the bench run's id (bench keys a run it imports by the imported id) and the fields
  # bench requires that no takt record holds yet: `budget_micro_usd` (story:bench-subset-and-budget),
  # `observed_at`, `out_dir`, `provenance`, and `workspace_path`, the finished tree bench's grader
  # reads. story:bench-run-export and bench's own store settle them.
  # UNMAPPED: the relation to takt.work.Case and takt.work.Run. A takt-arm run is exported from
  # one case and may span several invocations and resumes; whether a benchmark run references
  # its case or is owned by it is not said, and a free arm's run has neither.
  # read from: .engineering/planning/story/bench-run-export.md:48
  # read from: docs/metrics/README.md:49
  - name: takt.work.BenchRun
    naming:
      summary: >-
        One benchmark task under one arm, once: its verdict from the held-out tests and its raw
        usage, the record takt exports as a bench run.
    identity:
      name: id
      type: takt.work.BenchRunId
    fields:
      - name: task
        type: takt.work.BenchTaskId
      - name: arm
        type: takt.work.BenchArm
      - name: takt_revision
        type: Optional<takt.work.Revision>
        summary: takt's commit; absent for a free arm and where it was not recorded.
      - name: verdict
        type: takt.work.BenchVerdict
      - name: usage
        type: takt.work.BenchUsage
      - name: wall_seconds
        type: Optional<Integer>
        summary: The run's wall time, resumes included; absent for an untimed run.
      - name: case_dir
        type: Optional<String>
        summary: The directory holding the run's case and events; absent where none was kept.
    relations:
      # A task is run many times, under each arm; it stands on its own and outlives its runs.
      - name: task
        kind: references
        target: takt.work.BenchTask
        cardinality: one
        via: task
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A trace: one case's run record (`events.jsonl`) rendered as a `takt-trace/1` file by
  # `takt trace --case <dir>`, a header line on the run and one line per operation in one
  # vocabulary whatever harness ran, which `takt report` reads for where the run's time and
  # tokens went. One file per case, every run of the case inside (`invocations`, `resumes`);
  # the header gives the task, the span, the stop, the tokens in four components and the cost.
  # Token and cost figures come from the raw usage the harness reported and from nothing else:
  # a figure no source states is absent, never 0. Summaries and command text are classified,
  # never copied, so a trace carries no local path. A record written before takt recorded the
  # model, cost, turns and durations per call is completed from a runner shim's `steps.jsonl`
  # (`--steps`), and `notes` say which fields it supplied. A free-running harness's run has no
  # case and no trace yet (story:normalized-harness-trace).
  # read from: crates/takt/src/trace.rs:1-16
  # read from: crates/takt/src/trace.rs:260-306
  # read from: crates/takt/src/trace.rs:1142-1145
  # read from: crates/takt-cli/src/main.rs:60-70
  # read from: crates/takt/src/report.rs:1-9
  - name: takt.work.Trace
    naming:
      summary: >-
        One run's operations in one vocabulary whatever harness ran it, every token and cost
        figure taken from the harness's raw usage.
    identity:
      name: run
      type: takt.work.TraceId
    fields:
      - name: format
        type: String
        summary: The format, `takt-trace/1`.
      - name: case
        type: takt.work.CaseId
      - name: arm
        type: String
        summary: The arm, `takt`.
      - name: harness
        type: Optional<takt.work.HarnessName>
        summary: The harness's name from its steps; absent when no harness step ran.
      - name: model
        type: Optional<String>
        summary: The models the calls reported, distinct, in order; absent when none did.
      - name: revision
        type: Optional<takt.work.Revision>
        summary: takt's revision when the binary named one.
      - name: binary
        type: Optional<String>
      - name: protocol
        type: Optional<takt.work.ProtocolId>
      - name: story
        type: Optional<takt.work.StoryId>
      - name: scenario
        type: Optional<String>
      - name: t0
        type: Optional<Timestamp>
      - name: t_end
        type: Optional<Timestamp>
      - name: wall_s
        type: Optional<Decimal>
      - name: stop
        type: Optional<String>
      - name: outcome
        type: String
        summary: The last run's outcome as the scorecard names it.
      - name: invocations
        type: Integer
      - name: resumes
        type: Integer
      - name: steps
        type: Integer
      - name: tokens
        type: takt.work.TraceTokens
      - name: cost_usd
        type: Optional<Decimal>
      - name: acceptance
        type: Optional<String>
        summary: The held-out check; the record never holds it.
      - name: sources
        type: List<String>
        summary: >-
          The trace's source files, each named relative to the case directory, or by its file
          name alone when it lies elsewhere; never an absolute path.
      - name: notes
        type: List<String>
      - name: operations
        type: List<takt.work.TraceOperation>
    relations:
      # A trace renders one case's record, every run of the case inside.
      # read from: crates/takt/src/trace.rs:1142-1145
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
      # The story the case was opened for, when it was opened for one.
      - name: story
        kind: references
        target: takt.work.Story
        cardinality: one
        via: story
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
