  # whatever its count: it is printed as `no verdict: DiskLow trials (<side>'s <cases>)`, and
  # the refusal names the trials and says to run the scenario again as a fresh set without
  # them, not topped up; a saved scorecard or a candidate set holding one stays so until a
  # fresh set without one is saved. A side with no case of such a scenario is named as well,
  # `not in the saved scorecard` or `too few cases (0 of <trials>)`, so neither refusal hides
  # the other, and the refusals join. A promotion's trial count refuses such a set on either
  # side before it compares, so it never becomes a baseline.
