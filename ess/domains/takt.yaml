  # (takt.work.ScorecardCase). `--steps` refuses, exit 1, when a targeted step is unknown in a
  # scenario case of either side, naming the case and the step. A takt that does not know the
  # metric refuses a scorecard saved under it, and this takt refuses a scorecard saved without
  # it, a promotion's candidate and a stored baseline's copy alike, so a stored baseline from
  # before it is compared only after `takt promote --rebaseline`, which then starts a new series
  # (takt.work.PromotionKind). A rebaseline binds a run's `step_tokens` to the stored run's
  # while the definition is unchanged.
  # read from: crates/takt/src/scorecard.rs:319-385
