  - name: takt.work.Promotion
    naming:
      summary: >-
        The takt binary installed for runs, the revision it was built from and the scorecard that
        allowed it; or the record of a candidate refused on its scorecard.
    identity:
      name: id
      type: takt.work.PromotionId
    fields:
      - name: revision
        type: takt.work.Revision
        summary: >-
          The revision the installed binary embeds in `--version`, a full commit id; the
          candidate's on a refusal; the one the operator stated on a baseline of a binary that
          names none.
      - name: revision_stated_by
        type: Optional<takt.work.StatedBy>
        summary: >-
          Who stated `revision` when the binary could not: the operator, by `--revision`, on a
          baseline of a binary whose `--version` names no revision; absent when the binary named
          it.
      - name: tree
        type: takt.work.Revision
        summary: The tree of that commit, so the same tree under another commit is known.
      - name: scorecard
        type: takt.work.ScorecardId
        summary: The saved scorecard read, by its id, the revision that names it.
      - name: scorecard_file
        type: String
        summary: The saved scorecard's file as given, an absolute path outside the repository.
      - name: scorecard_sha256
        type: String
        summary: >-
          The sha256 of the scorecard read; the store's copy of it, `<revision>.scorecard.json`,
          must match it when read.
      - name: promoted_at
        type: Timestamp
        summary: When the record was written, RFC 3339 in UTC; none lies before the record before it.
      - name: kind
        type: takt.work.PromotionKind
        summary: Whether the record installed a binary, recorded the first baseline or refused a candidate.
      - name: against
        type: Optional<takt.work.Revision>
        summary: The baseline revision the scorecard was compared with; absent on a baseline record.
      - name: rule
        type: takt.work.ScorecardRule
        summary: The rule the comparison applied.
      - name: worse
        type: Integer
        summary: >-
          The scenarios the comparisons marked worse, against the latest record, the series
          start or a rebaseline that added a scenario, each counted once; 0 unless the record is
          a refusal.
      - name: binary
        type: Optional<String>
        summary: >-
          The installed binary's path; present on a promotion and on a baseline the operator
          stated, whose binary was hashed against the statement.
      - name: binary_sha256
        type: Optional<String>
        summary: >-
          The installed binary's sha256, lower-case hex; present on a promotion and on a baseline
          the operator stated, where it is the digest stated and checked.
      - name: runs
        type: List<takt.work.RecordedRun>
        summary: >-
          On a baseline the operator stated, each run of the scorecard with the binary it states,
          every digest `binary_sha256`; empty on every other record.
      - name: previous_sha256
        type: Optional<String>
        summary: >-
          The sha256 of the record written before this one, lower-case hex, so a record removed
          from between two is noticed; absent on the first record only.
      - name: rejudges
        type: Optional<takt.work.Rejudged>
        summary: >-
          On a candidate judged again with `--rejudge`, the latest refusal of its revision or
          tree; absent on every other record and on one written before the field.
      - name: replaces_sha256
        type: Optional<String>
        summary: >-
          On a rebaseline, the sha256 of the baseline's scorecard it replaces; absent on every
          other record and on one written before the field.
      - name: cases
        type: List<takt.work.CaseId>
        summary: >-
          On a refusal, the case ids of the scorecard refused, so a candidate judged again is
          judged on new runs only; empty on every other record and on one written before the
          field.
      - name: series_start
        type: Optional<String>
        summary: >-
          On a promotion or a refusal, the file name in the store of the record that starts the
          series it was judged in, the latest baseline or rebaseline under a newer metric
          definition before it, whose scorecard it was also compared with on that record's
          scenarios; checked on read, a record naming another refusing the store. Absent on a
          baseline and a rebaseline, and on a record written before the field.
    relations:
      - name: scorecard
        kind: references
        target: takt.work.Scorecard
        cardinality: one
        via: scorecard
      - name: cases
        kind: references
        target: takt.work.Case
        cardinality: many
        via: cases
    lifecycle:
      initial: Promoted
      states: [Promoted]
      terminal: [Promoted]

  # A finding: a defect of takt filed in the planning store as one draft story or one open
  # blocker, carrying the reference `finding:<key>`, an `expected_before` predicate a machine can
  # check (a command run on a named scenario, or on a named repository at a seed commit, with the
  # exit status or the output it gives while the defect is present) and the path of the run
  # record or review that produced it. `scripts/file-finding` files it through
  # `aep plan artifact new`, refusing a key the store holds and a predicate that does not parse,
  # with nothing written; `scripts/check-finding` runs the predicate in a clone of the scenario's
  # seed, or of the repository at its seed, with a takt built from a given revision in a checkout
  # of it, fetched through git's transport with every object hashed and checked, so the binary
  # names that revision and no object overwritten in the store is built. The predicate's command runs under bubblewrap
  # with every host path read-only but its clone and its own home; the caller's home and the
  # user's passwd home hidden (a path under them, the repository's among them, is refused as
  # read-only or as not there); /tmp and /run its own; and in network, IPC and PID namespaces
  # of its own, so it reaches no network, no abstract socket and no socket under /run, and no
  # process it starts outlives it. A socket the host holds elsewhere stays in sight where the
  # user may open it. No descriptor above 2 the caller left open reaches it, nor the build.
  # Bubblewrap's status reaches the check on a pipe, and its exit is the command's only when
  # its last line is the `exit-code` of that same status. One check builds and runs at a time
  # per cache directory, whichever session starts it, under an advisory lock (`flock`) on its
  # `lock` file, held on the open descriptor to the check's end and passed to no build or
  # command; a check that finds it held says it waits and waits. Before the lock is waited for,
  # and again once it is taken after a wait, a check whose cache directory's file system has
  # less than `CHECK_FINDING_MIN_FREE_GIB` GiB free (20 by default, 0 checks nothing) builds
  # nothing and exits 1, naming the directory, its free space and the threshold. On macOS
  # Seatbelt (`sandbox-exec`) stands where bubblewrap does, and without it nothing is built and
  # no predicate runs: the command has no network, starts no program outside its profile, writes
  # only to its clone and its home, its TMPDIR a directory there, and reads nothing under the
  # hidden homes, `/tmp` or `/var/run` but those, in a process group of its own killed whole when
  # it ends, its status taken from the same `exit-code` line.
  # read from: .engineering/planning/design/recursive-self-improvement.md:84-89
  # read from: .engineering/planning/story/finding-intake.md (§ Domain relations)
  # read from: .engineering/planning/story/finding-on-any-repository.md (§ Outcome)
  # read from: .engineering/planning/story/check-finding-builds-name-their-revision.md (§ Outcome)
  # read from: scripts/file-finding:11-56
  # read from: scripts/file-finding:175
  # read from: scripts/file-finding:322
  # read from: scripts/check-finding:302-755
  # read from: scripts/check-finding:834-863
  # read from: scripts/check-finding:551-577
  # read from: scripts/check-finding:248-250
  # read from: scripts/check-finding:412-414
  # read from: scripts/check-finding:792-812
  # One predicate on one scenario or one repository: a body with a second `expected_before`
  # block, a block that gives a key twice, or one that gives both `scenario` and `repository`, or
  # neither, is malformed and nothing is filed. `seed` and `test` go with `repository` only: a
  # scenario's seed is the scenario repository's to declare. A repository is an `https://` URL
  # and nothing else (a predicate is committed to a public repository and must hold on every
  # machine; the check clones it with no credential of its own), a local checkout standing in
  # for it only through `check-finding --checkout <url>=<path>` at check time; a seed is a commit
  # id. A filed repository names a public host: a dotted DNS name, not `localhost` or a name
  # under it, or a dotted-decimal IPv4 address outside the zero, loopback, private, link-local
  # and shared ranges, and no IPv6 literal. The check is a lint on the URL's text, not a
  # boundary. The command runs the takt under test (`$TAKT` or `${TAKT}` in its text), and an
  # `output` is at least 8 characters; a predicate otherwise is malformed.
  # read from: scripts/file-finding:178
  # read from: scripts/file-finding:184
  # read from: scripts/file-finding:196-259
  # read from: scripts/file-finding:190-195
  # read from: scripts/file-finding:263-266
  # A finding is filed as exactly one store artifact, a story or a blocker, and that artifact is
  # filed for that finding alone (its id is `<kind>:<key>`, the finding's key): one-to-one,
  # decided 2026-10-18, held in `artifact` (takt.work.FindingArtifact). A relation entry needs a
  # field typed by the target's identity, and the story variant sits inside a union beside a
  # blocker this specification does not declare, so no relation to takt.work.Story is declared and
  # the one-to-one is stated here.
  # read from: scripts/file-finding:376
  # read from: .engineering/planning/story/finding-intake.md:51
  - name: takt.work.Finding
    naming:
      summary: >-
        A defect of takt in the planning store, with the predicate that reproduces it on a
        scenario or on a repository at a seed, and the record it came from.
    identity:
      name: key
      type: takt.work.FindingKey
    fields:
      - name: artifact
        type: takt.work.FindingArtifact
        summary: The store artifact the finding is, `story:<key>` or `blocker:<key>`.
      - name: scenario
        type: Optional<takt.work.ScenarioId>
        summary: >-
          The scenario the predicate runs on; absent when the predicate names its repository.
      - name: repository
        type: Optional<String>
        summary: >-
          The repository the defect was seen on, an `https://` URL; absent when the predicate
          names a scenario. One of `scenario` and `repository` is given.
      - name: seed
        type: Optional<takt.work.Revision>
        summary: >-
          With `repository`: the commit the task starts from, which the check clones and checks
          out.
      - name: test
        type: Optional<String>
        summary: >-
          With `repository`, optional: the task's test command, handed to the command as `$TEST`.
      - name: command
        type: String
        summary: >-
          One shell line, run in a fresh clone of the scenario's seed, or of the repository at
          its seed, with `$TAKT` the takt binary under test.
      - name: exit
        type: Optional<Integer>
        summary: The exit status the command gives while the defect is present.
      - name: healthy_exit
        type: Optional<Integer>
        summary: >-
          The exit status the command gives once the defect is gone, 0 when absent; the one
          status the check reads as not reproduced. An `exit` equal to it needs `output`.
      - name: output
        type: Optional<String>
        summary: A fixed string the command's output holds while the defect is present.
      - name: source
        type: String
        summary: The run record or review that produced the finding, a path in the repository.
    relations:
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
    lifecycle:
      initial: Filed
      states: [Filed]
      terminal: [Filed]

  # A trial base: the branch `trial/<n>` a scenario run cuts from its scenario's seed commit.
  # Through the bot route, after fetching the remote's `trial/*` branches, `<n>` is one past the
  # highest `trial/<n>` the checkout then knows, local or remote; a name under `trial/` that is
  # not all digits is no trial base, and a number past the largest is refused, never wrapped.
  # Without the bot route `<n>` is the instant and a nonce (takt.work.TrialNumber), and the branch
  # is not pushed. Through it the run pushes it with a lease that only lets it create the
  # branch. Either way it then opens the case
  # `scenario-<id>-trial-<n>` for the scenario's story, whose pull request targets the trial
  # branch; through the bot route it is refused before anything is cut when that case or its
  # branch exists, and without it such a number is passed over, so a trial base has one case;
  # and either way it is refused when the case id is not one `check_id` accepts. A refusal before the
  # push removes the branch and puts the tree back;
  # nothing is reset by a force-push: the next run cuts the
  # next number. The branch records neither its scenario nor its case; the case id names both.
  # read from: crates/takt-cli/src/main.rs:543-558
  # read from: crates/takt-cli/src/main.rs:3418-3421
  # read from: crates/takt-cli/src/main.rs:3443-3449
  # read from: crates/takt-cli/src/main.rs:3631-3643
  # read from: .engineering/planning/design/recursive-self-improvement.md:96-98
  # read from: crates/takt-cli/src/main.rs:3482-3484
  - name: takt.work.TrialBranch
    naming:
      summary: >-
        A fresh base `trial/<n>` cut from a scenario's seed for one scenario run, the base its
        case's pull request targets.
    identity:
      name: number
      type: takt.work.TrialNumber
    fields:
      - name: scenario
        type: takt.work.ScenarioId
        summary: The scenario whose run cut it, as the case id names it.
      - name: seed
        type: takt.work.Revision
        summary: The scenario's seed commit the branch was cut at.
      - name: case
        type: takt.work.CaseId
        summary: The case the run opened on it, `scenario-<id>-trial-<n>`.
    relations:
      # A scenario is run many times, each from its own trial base; the base outlives the
      # scenario's declaration, which is read at a revision.
      - name: scenario
        kind: references
        target: takt.work.Scenario
        cardinality: one
        via: scenario
      # One trial base, one case; discarding the case returns the tree to the branch it left
      # (takt.work.Case), the trial base, which stays.
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
    # A trial base is cut and pushed once and never moved by takt.
    lifecycle:
      initial: Cut
      states: [Cut]
      terminal: [Cut]

  # The delegation record, `.engineering/delegations.yaml`: the owner's delegations of a grant
  # reserved for the owner to a named agent role, each with its revocation once revoked, read
  # like the allow-list at the merge target's tip as the forge reports it, never from the
  # candidate's tree, so a candidate's own edit of it counts for nothing. The file is itself a
  # judge surface: adding, widening or revoking a delegation is a change only the owner's grant
  # merges. One that is absent or does not read delegates nothing.
  # read from: .engineering/planning/story/judge-guard.md:58-64
  # read from: .engineering/planning/story/judge-guard.md:122
  # Decided by the planner (story:judge-guard, D3, D7): both files are read at the merge target's
  # tip as the forge reports it; a forge that cannot report it merges nothing.
  # read from: crates/takt/src/validator.rs:4481-4483
  # read from: crates/takt/src/validator.rs:5084-5090
  # read from: crates/takt/src/forge.rs:407-410
  - name: takt.work.DelegationRecord
    naming:
      summary: >-
        The owner's delegations of judge-surface grants to agent roles, each revocable, read at the
        tip of the branch the pull request targets.
    identity:
      name: path
      type: String
    fields:
      - name: delegations
        type: List<takt.work.Delegation>
    # The owner edits the file; takt only reads it at the base, so takt moves no state of it.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # The judge allow-list, `.engineering/judge-allow.yaml`: the paths that are not judge surfaces,
  # every other path being one, read at the merge target's tip as the forge reports it. It
  # starts as `docs/**`, `README.md` and `CHANGELOG.md`; adding a path to it is a judge-surface
  # change, and a candidate's own edit of it counts for nothing. Its `paths` are globs in the
  # judge-surface list's dialect (`*` and `?` within a part, `**` across parts), each matching a
  # whole path, case and all; one that is absent admits nothing, and so does one that does not
  # read. The change it is applied to is what the merge does to the target: the tip's tree
  # against the tree `git merge-tree --write-tree` makes of the tip and the granted revision
  # (git 2.38 or later), so a revert of the target's own change hidden by a merge of the target
  # or by an older base is a change like any other, and a merge that conflicts is refused. The
  # target is the pull request's base as the forge reports it; a case whose own record names
  # another base is refused, naming both. The story file takt's take commit changes is exempt
  # only when that commit has the case's base commit as its one parent, exactly the message
  # `takt: take <story>` and that one path, and the story's body below its frontmatter is the
  # same at the tip and in the merge; every other path in the planning store stays guarded.
  # Decided by the planner (story:judge-guard, R1-R3, 2026-10-19).
  # Every change the candidate made from where it meets the target (each merge base of the tip
  # and the revision) is judged besides, and the merge and `change.read`'s comparison run in a
  # bare repository made for the one command, sharing the repository's objects, with no system
  # or global configuration, no attributes from any source and so no merge driver (git 2.32 or
  # later for that; 2.38 for `merge-tree --write-tree`). A story's file holding a carriage return
  # at the tip or in the merge is refused; the take's exemption holds only while the file in the
  # merge is byte for byte the file at the take commit; and the pull request is read again right
  # before the merge, a base other than the one judged merging nothing.
  # Decided by the planner (story:judge-guard, R4-R7, 2026-10-19).
  # An improvement turn's case input `surface` is computed when the turn opens from the list as
  # the baseline (the promoted revision) holds it, over the change from the baseline to the
  # candidate (what promoting the candidate installs, so a candidate branched before a judge
  # change that would roll it back is judge) and every change from each merge base of the
  # baseline and the candidate to the candidate: `judge` when a path it does not admit, a file
  # of the guard's own (the list, the delegation record) or a path that is no regular file is
  # changed, else `non_judge`; a given `surface` that disagrees is refused, naming the first
  # such path (story:self-improvement-protocol S5, 2026-10-19).
  # read from: engineering-protocols 0.10.0, protocols/self-improvement/1.yaml:18-22
  # read from: crates/takt/src/improvement.rs:1295-1305
