# Takt's nouns, declared from three sources, and every declaration says which: the kernel as it is
# (crates/takt/src/{case,run,harness,validator,evidence,protocol,forge,frontier,git}.rs and
# crates/takt-cli/src/main.rs),
# the design where the kernel has nothing yet (docs/design/takt.md § 3), and the cleared decision
# on the approval grant and the case resume
# (.engineering/planning/decision-blocker/approval-grant-and-case-resume.md).
# Canon's declarations (b10x-canon 0.6.0, the release Cargo.toml pins, ess/domains/protocol.yaml)
# are named where a takt noun holds one and never redeclared: the protocol, the case snapshot, the
# evidence record and the decision are Canon's. An identifier a protocol declares is carried here as
# a newtype over String so that a takt field has a type, and each names the Canon type it carries.
# Cross-repository citations name the release and the file; in-repository ones the file and lines.
domain: takt.work

summary: >-
  One `takt run` is a Run over one Case on one Unit: the case is opened under a protocol in a
  worktree, or resumed, and the loop evaluates it, takes one Step (a deterministic one by an
  EvidenceProducer, or a judgement one by the harness among the actions offered), records the
  effect and evaluates again, until an outcome is legitimate, an approval is needed, nothing is
  admissible, a step is refused, no progress is made or the budget is spent. A Workflow is the
  `workflow/1` document a run is to follow, designed and not built. A Story is the planning-store
  unit the frontier pulls, with at most one open case, which a later run resumes once the
  operator has granted the case its authority.

naming:
  wire: work
  display: Work

types:
  # The case id: `--case-id`; else, from the instant the case is opened, `story-<name>-<instant>`
  # for a story the frontier took and `takt-<instant>` for an intent. Carries
  # canon.protocol.CaseId (protocol.yaml:526), the `id` of the snapshot. One plain name under the
  # cases directory: an id that is empty, `.`, holds `..` or a path separator, starts with `/`, or
  # holds a control, whitespace, separator or format character or a default-ignorable code point
  # (Unicode 16.0; U+034F COMBINING GRAPHEME JOINER, the variation selectors among them) is
  # refused before it is joined to a path, wherever an id is given (`takt run --case`,
  # `--case-id`, `takt approve`). And a name git accepts as the branch `takt/<id>`: an id that
  # starts with `.`, ends with `.` or `.lock`, holds `@{` or one of `~ ^ : ? * [`, is `@` alone,
  # or is longer than 250 bytes (the ref's lock file `<id>.lock` must fit a 255-byte file name)
  # is refused the same way, before a case directory or a branch is made, and a case directory
  # already under such an id is not resumed. The refusal names the id as typed, a character that
  # does not show written as its code point. Ids are not normalised: `café` precomposed (NFC)
  # and decomposed (NFD) are two ids. `takt run --case` checks the id before it reads anything
  # under it, so a path out of the cases directory is refused with this refusal, never read. The
  # ids takt mints are checked too: `scenario-<id>-trial-<n>` before any trial branch is cut or
  # pushed, `story-<name>-<instant>` before anything is written, so a scenario id or story name
  # long enough to take its case id past 250 bytes is refused; the frontier skips such a story,
  # naming it, and takes the next. A branch the validators resolve the case from, or a case's
  # branch a run reads the base from (to read the store, or to fork a new case), is shown the
  # same way and refused when it names no case, before its name is joined to a path.
  # read from: crates/takt/src/run.rs:9573
  # read from: crates/takt/src/frontier.rs:71-75
  # read from: crates/takt/src/case.rs:3082
  # read from: crates/takt/src/case.rs:470-483
  # read from: crates/takt/src/case.rs:421-455
  # read from: crates/takt/src/case.rs:372-417
  # read from: crates/takt-cli/src/main.rs:4025-4026
  # read from: crates/takt-cli/src/main.rs:3449-3450
  # read from: crates/takt/src/run.rs:8572-8573
  # read from: crates/takt/src/run.rs:10183-10190
  # read from: crates/takt/src/case.rs:150-152
  - name: takt.work.CaseId
    kind: newtype
    of: String

  # A run's own id, minted when the run starts. The kernel gives a run no id today: one run opens
  # or resumes one case and prints its stop under the case's directory. The decided resume
  # (`takt run --case <id>`) gives a case a second run, so a run is told apart from its case here.
  # read from: crates/takt/src/run.rs:9292-9306
  # read from: crates/takt/src/run.rs:9573
  # read from: crates/takt-cli/src/main.rs:3264-3268
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:49-51
  - name: takt.work.RunId
    kind: newtype
    of: String

  # A protocol as the loaded protocol in memory names it, `<name>/<major>` (`software.change/1`):
  # a built-in of the engineering protocols (`software.change/1`, `story.delivery/1`,
  # `self.improvement/1`, `loop.improvement/1`), by its own id or the name the registry lists it
  # under (`story-delivery/1`, `eval-gated-change/1` for `eval.gated_change/1`), one of takt's
  # own built-ins, embedded in the binary and listed after the registry's of its name
  # (`story.delivery/3`), or a `protocol/1` file Canon validated and compiled.
  # read from: crates/takt/src/protocol.rs:10-16
  # read from: crates/takt/src/protocol.rs:42-66
  - name: takt.work.ProtocolId
    kind: newtype
    of: String

  # A protocol's name alone (`software.change`): what the snapshot's `protocol` key holds, and
  # what a `protocol` block names beside its `revision`. Carries canon.protocol.ProtocolId
  # (protocol.yaml:32).
  # read from: crates/takt/src/protocol.rs:13-14
  # read from: crates/takt/src/case.rs:3083
  - name: takt.work.ProtocolName
    kind: newtype
    of: String

  # Where a run's protocol comes from: a built-in, by id, or a `protocol/1` file, by path; the
  # kernel loads from the file when the argument names one that exists, relative to the directory
  # `takt` runs in.
  # read from: crates/takt/src/run.rs:55
  # read from: crates/takt/src/run.rs:9560-9563
  # read from: crates/takt/src/protocol.rs:71-76
  - name: takt.work.ProtocolSource
    kind: union
    tag: kind
    variants:
      builtin: takt.work.ProtocolId
      file: String

  # A planning-store story's artifact id, `story:<slug>`, as the `aep plan artifact` verbs take it.
  # read from: docs/design/takt.md:44
  # read from: crates/takt/src/frontier.rs:53-54
  # read from: .engineering/planning/story/takt-domain-model.md:43
  - name: takt.work.StoryId
    kind: newtype
    of: String

  # The rungs of the planning store's story ladder, as takt reads them: a story is taken when
  # `proposed` ("refined and agreed enough to pick up") and is `active` ("being worked on now")
  # while its case is open. The store moves a story; takt reads where it stands.
  # read from: aep 0.68.0 (the revision .engineering/project.yaml pins), artifacts/lifecycles/story.yaml:14-22
  # read from: aep 0.68.0, artifacts/lifecycles/story.yaml:43-49
  # read from: crates/takt/src/frontier.rs:33-37
  - name: takt.work.StoryStatus
    kind: enum
    variants: [draft, proposed, active, implemented, rejected, archived]

  # What a run works on: an intent given on the command line, or a story the frontier pulls from
  # the planning store. Since wave 02 a run given neither `--intent` nor `--case` asks the
  # frontier: it resumes the open case of a story being worked, if there is one; else the next
  # ready story (`proposed`, no blocker, every `depends_on` `implemented` or `archived`, first in
  # id order) becomes the unit: its case is opened first, then the store moves the story
  # `active` through its own verb, and that change is committed on the case's branch as
  # `takt: take <story>`. A story whose minted case id the case id rule refuses is skipped with
  # a line naming it, and the next ready story tried. The `story` variant is the design's
  # `frontier(repo)`. `takt run --story <id>` names the story instead (not with `--intent` or
  # `--case`, which the command line refuses): its open case, if it has one, is resumed; else
  # it is taken exactly as a frontier take takes the next, the store read on the base, opened first on
  # `story.delivery/1` unless `--protocol` names another, the store told, the take committed on
  # the case's branch. A story the store does not list, or one the frontier would not take (no
  # story, not `proposed`, blocked, a dependency not done, `active` with no open case, a case
  # recorded for it already), is refused before any case opens, exit 1, naming the story and
  # why, the tree put back on the branch or commit it was on; a `self.improvement/1` turn,
  # which opens on its finding, refuses `--story`.
  # read from: docs/design/takt.md:44
  # read from: crates/takt/src/frontier.rs:175-183
  # read from: crates/takt/src/frontier.rs:191
  # read from: crates/takt/src/run.rs:10000-10024
  # read from: crates/takt/src/run.rs:10118-10236
  # read from: crates/takt/src/run.rs:8519-8520
  # read from: crates/takt-cli/src/main.rs:658-664
  # read from: crates/takt-cli/src/main.rs:1682-1688
  # read from: crates/takt-cli/src/main.rs:4003-4005
  # read from: crates/takt-cli/src/main.rs:1972-2033
  # read from: crates/takt-cli/src/main.rs:3798-3802
  # read from: crates/takt-cli/src/main.rs:3856-3885
  - name: takt.work.Unit
    kind: union
    tag: kind
    variants:
      intent: String
      story: takt.work.StoryId

  # An action the protocol declares, by id (`tests.run`, `implementation.edit`, `repository.merge`).
  # Carries canon.protocol.ActionId (protocol.yaml:57).
  # read from: crates/takt/src/protocol.rs:25-26
  - name: takt.work.ActionId
    kind: newtype
    of: String

  # The name of a layer of the stack a run ran on (ADR 0101: self-improvement measures the
  # stack, not takt alone): `takt`, the binary; `harness`, the harness session layer, the
  # program that takes a judgement step; `model`, the model the harness called; and any other
  # layer whose revision takt can take from what ran (listed takt, harness, model, runtime, then
  # by name). A layer's revision comes from the binary or library that ran, never typed by a
  # person: takt's from its own build, the harness's as the harness's own stream states its
  # version on a judgement step, the model's as the same stream reports the model id; takt starts
  # the harness program for a layer in a judgement step only: the `--version` it records on `opened`
  # as `harness_program` is a record beside the layers. A layer
  # takt cannot read is absent, never guessed.
  # read from: crates/takt/src/scorecard.rs:211-214
  # read from: crates/takt/src/run.rs:11977-11983
  # read from: crates/takt/src/harness.rs:87-103
  # read from: crates/takt/src/harness.rs:3345-3360
  # read from: crates/takt/src/scorecard.rs:799-812
  - name: takt.work.LayerName
    kind: newtype
    of: String

  # An evidence kind the protocol declares, by id (`test_result`). Carries
  # canon.protocol.EvidenceKindId (protocol.yaml:42).
  # read from: crates/takt/src/validator.rs:67-68
  - name: takt.work.EvidenceKindId
    kind: newtype
    of: String

  # An artifact the protocol declares, by id (`intent`, `implementation`): what a case gives a
  # revision for and what an evidence record is about. Carries canon.protocol.ArtifactId
  # (protocol.yaml:37).
  # read from: crates/takt/src/protocol.rs:21-22
  # read from: crates/takt/src/validator.rs:69-70
  - name: takt.work.ArtifactId
    kind: newtype
    of: String

  # A capability an action requires (`repository.merge`): what an authority decision grants or
  # denies. Carries canon.protocol.CapabilityId (protocol.yaml:67). A grant names one that some
  # action of the case's protocol `requires`, or it is refused.
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47
  # read from: b10x-canon 0.6.0, crates/canon/src/model/authority.rs:24
  # read from: crates/takt/src/case.rs:1057-1078
  - name: takt.work.CapabilityId
    kind: newtype
    of: String

  # An authority decision on one capability, as a `canon-authority/1` entry carries it: an action
  # whose precondition holds is admissible when every capability it requires is granted, blocked
  # when one is denied, and approval-required when none is denied and one is undecided. The same
  # two values as canon.protocol.Grant (protocol.yaml:682).
  # read from: b10x-canon 0.6.0, crates/canon/src/model/authority.rs:34
  # read from: b10x-canon 0.6.0, crates/canon/src/eval/authority.rs:7-12
  # read from: crates/takt/src/case.rs:620-624
  - name: takt.work.Grant
    kind: enum
    variants: [granted, denied]

  # The answer of a case's authority provider for one capability of one action, at one case
  # revision: `allow` for a grant on file given at the revision of its subject the case is at,
  # with the case at the case revision asked about; `deny` for a denial on file, and for a
  # capability the action does not require; `approval_required` otherwise. The three values of
  # Commission's AuthorityVerdict; an evaluation takes an action allowed as admissible and one
  # denied as blocked. `takt replay` answers a decision on file by the same rule, over the case
  # revision and the artifact revisions the decision was computed at, and takes an answer only
  # where the record's line for that evaluation shows the run had it (takt.work.StepReplay).
  # read from: crates/takt/src/case.rs:1958-2073
  # read from: crates/takt/src/case.rs:3865-3882
  # read from: crates/takt/src/case.rs:2081-2089
  # read from: crates/takt/src/replay.rs:285-323
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/authority.rs:36-45
  - name: takt.work.AuthorityAnswer
    kind: enum
    variants: [allow, deny, approval_required]

  # The case's own revision, `r<n>`, as `case.yaml` holds it under `revision`, which Canon reads
  # as the snapshot's revision: 1 when the case opens, and when `case.yaml` holds none, as a case
  # opened before it was kept does; one more each time an artifact of the case moves to another
  # revision. The governor of Loom issues a frontier at it and a request expects it, so an
  # authority answer is asked at one, and a grant is allowed only at the case revision asked
  # about.
  # read from: crates/takt/src/case.rs:86-89
  # read from: crates/takt/src/case.rs:1486-1503
  # read from: crates/takt/src/case.rs:3747-3762
  # read from: b10x-canon 0.6.0, crates/canon/src/model/case.rs:37-40
  - name: takt.work.CaseRevision
    kind: newtype
    of: String

  # One observation reported to a case, as `observations.json` keeps it, in the order received:
  # the shape Loom's FileCaseStore keeps observations in. The Commission runtime reports an
  # observation through the governor, which hands it to the case's store.
  # read from: crates/takt/src/case.rs:80-84
  # read from: crates/takt/src/case.rs:1729-1734
  # read from: crates/takt/src/case.rs:1915-1921
  # read from: loom-sdk 0.31.0, crates/loom-governor/src/file_store.rs:627-640
  - name: takt.work.Observation
    kind: struct
    fields:
      - name: observation_id
        type: Uuid
      - name: source
        type: String
      - name: subject
        type: String
      - name: observed_at
        type: Timestamp
      - name: payload
        type: Json

  # One approval the operator gave a story's case, as the planning store records it: the
  # capability granted, the case it was granted to, who granted it, when, and the revision it
  # authorises, of the artifact the granted action is about (its subject).
  # `takt approve <case> <capability> --by <approver>` writes it through
  # `aep plan artifact evidence <story> --kind approval` before it writes the grant: the source
  # `takt approve <capability> --by <approver> at <revision>`, the reference the case's
  # `authority.yaml`, the instant the grant's `granted_at`, as the approver (`AEP_ACTOR`), so a
  # story's approver is `human:<name>` or `agent:<role>`, an actor the store records. What the
  # record changed in the store is
  # committed on the case's branch as `takt: approve <story> <capability>`, exactly those paths,
  # so the tree must be on that branch and clean. A record the store refuses leaves no grant. takt
  # never reads the record back: the grant a run reads is the case's (`Case.authority`); this is
  # its trail on the story. An improvement turn's case records none: its `story.yaml` names the
  # finding it verifies, a story it does not deliver, so `takt approve` writes the grant into the
  # case alone, with no store write and no commit, and needs no store (story:self-improvement-
  # protocol, part 2, correction 1).
  # read from: .engineering/planning/decision-blocker/approval-grant-and-case-resume.md:47-49
  # read from: crates/takt/src/case.rs:872-887
  # read from: crates/takt/src/frontier.rs:435-476
  # read from: crates/takt/src/frontier.rs:693-718
  # read from: crates/takt/src/frontier.rs:415-416
  - name: takt.work.Approval
    kind: struct
    fields:
      - name: capability
        type: takt.work.CapabilityId
      # The case whose `authority.yaml` the grant was written into, what the record refers to.
      # read from: crates/takt/src/case.rs:893-894
      - name: case
        type: takt.work.CaseId
      - name: approver
        type: String
        summary: Who granted it, as given to `--by`.
      - name: granted_at
        type: Timestamp
      # The revision of the artifact the granted action is about the case was at the gate at, the
      # one revision the grant authorises; the record's source names it.
      # read from: crates/takt/src/case.rs:885-886
      - name: revision
        type: takt.work.Revision

  # An outcome the protocol declares, by id: the one a run completes through. Carries
  # canon.protocol.OutcomeId (protocol.yaml:62).
  # read from: crates/takt/src/run.rs:78-79
  - name: takt.work.OutcomeId
    kind: newtype
    of: String

  # A case input the protocol declares, by id (`risk`, `change_kind`). Carries
  # canon.protocol.InputId (protocol.yaml:293); the value given is text, `true` and `false` written
  # into the snapshot as booleans.
  # read from: crates/takt/src/protocol.rs:23-24
  # read from: crates/takt/src/case.rs:3087-3111
  - name: takt.work.InputId
    kind: newtype
    of: String

  # The judgement actor's name: `claude-code` (`--harness claude`), `codex` (`--harness codex`)
  # and `b10x-harness` (`--harness harness`) for the three harnesses the metaharness session
  # executor runs, one seam with the harness's kind its parameter: Claude Code offered the file
  # tools only; Codex its shell and `apply_patch`, each call decided by takt and what a command
  # writes confined by Codex's own sandbox to the copy; b10x-harness observed, deciding its own
  # calls. Each works in a scratch copy of the tree whose change it proposes
  # (takt.work.Proposal), its environment metaharness's own, holding no variable the run
  # withholds from a harness (`takt replay` still runs Claude Code in print mode in the replay's
  # scratch worktree); `none` for the harness that performs nothing,
  # except that it takes an offered action the case holds a grant for, changing no file, so a
  # granted merge is the step the run makes; it requests the gate action when an approval is
  # pending, so an unattended run stops `approval_required`, and takes an offered action that
  # records a choice (`change.handover`), so work committed by hand is handed over as it stands;
  # asked for any other judgement step it ends the run with an error.
  # read from: crates/takt-cli/src/main.rs:1262-1292
  # read from: crates/takt/src/harness.rs:106-108
  # read from: crates/takt/src/harness.rs:698-702
  # read from: crates/takt/src/harness.rs:2515-2519
  # read from: crates/takt/src/harness.rs:3265
  # read from: crates/takt-cli/src/main.rs:2494-2541
  - name: takt.work.HarnessName
    kind: newtype
    of: String

  # The model endpoint `--harness harness` points b10x-harness at: its base URL (origin and API
  # prefix), its wire, its model and its credential by reference. Each field is its
  # `--endpoint-*` flag's, else the `--endpoint-file`'s (TOML: `base_url`, `wire`, `model` and a
  # `[credential]` table), else the default, the Anthropic Messages API on the user's claude.ai
  # subscription token: `https://api.anthropic.com/v1`, `anthropic-messages`, `claude-opus-5`,
  # `$HOME/.claude/.credentials.json` at `/claudeAiOauth/accessToken`. `--model` wins over its
  # model. An `--endpoint-*` flag given with another harness is refused before any case opens.
  # The base URL is `https://`, or `http://` to a loopback host (`localhost`, `127.0.0.0/8`,
  # `::1`), and holds no userinfo, query or fragment: each is refused before any case opens,
  # naming the part and repeating none of it. The default credential goes to the default base
  # URL alone: another base URL with no credential given is refused, naming it.
  # A run records it on its `opened` line (`takt.work.RunOpened`) by reference only, its model
  # the one the sessions run, `--model` over the endpoint's: the credential tagged `kind`,
  # `subscription_file` with the token file's `path` as it displays, from `~` when it is under
  # HOME, and its `pointer` when given, or `secret` with its `namespace` and `name`, or
  # `environment` with the variable's `name`; never a token, nor the path of a staged one. The
  # harness is pointed at it through its session executor: the endpoint, whose `token_file` and
  # `token_pointer` are the token file's, the staged file's with no pointer for a variable, and
  # empty for a secret, and the secret's name as `api_key_secret`, both set from the one
  # configuration so they agree.
  # read from: crates/takt/src/harness.rs:4115-4119
  # read from: crates/takt/src/harness.rs:4124-4132
  # read from: crates/takt/src/harness.rs:4216-4218
  # read from: crates/takt-cli/src/main.rs:2486-2493
  # read from: crates/takt-cli/src/main.rs:2497-2539
  # read from: crates/takt-cli/src/main.rs:2738-2740
  # read from: crates/takt/src/harness.rs:3419-3420
  # read from: crates/takt/src/harness.rs:3424-3427
  # read from: crates/takt/src/harness.rs:3925-3931
  # read from: crates/takt/src/harness.rs:4113-4115
  # read from: crates/takt/src/harness.rs:4134-4150
  # read from: crates/takt/src/harness.rs:734-752
  # read from: crates/takt/src/harness.rs:306-308
  # read from: crates/takt/src/harness.rs:4161-4170
  # read from: crates/takt/src/harness.rs:4232-4234
  # read from: crates/takt/src/harness.rs:4251-4255
  # read from: crates/takt/src/harness.rs:4513-4520
  # read from: crates/takt/src/harness.rs:4557-4565
  # read from: crates/takt/src/harness.rs:4599-4610
  # read from: crates/takt/src/harness.rs:289-293
  # read from: crates/takt/src/harness.rs:407-412
  # read from: crates/takt/src/harness.rs:968-969
  # read from: Loom 0.39.1, crates/loom-session-executor/src/lib.rs:257-260
  - name: takt.work.HarnessEndpoint
    kind: struct
    fields:
      - name: base_url
        type: String
      - name: wire
        type: takt.work.EndpointWire
      - name: model
        type: String
      - name: credential
        type: takt.work.EndpointCredential

  # The model API an endpoint speaks, as b10x-harness names it: `anthropic-messages` or
  # `openai-responses`; any other is refused.
  # read from: crates/takt/src/harness.rs:3406
  - name: takt.work.EndpointWire
    kind: enum
    variants: [anthropic_messages, openai_responses]

  # Where an endpoint's credential is, by reference only, taken whole from one source (flag,
  # file, default): a subscription token file with an optional JSON pointer, which b10x-harness's
