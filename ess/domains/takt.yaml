  # How a candidate scorecard compares on the steps it targets, `takt scorecard --against <saved>
  # --steps <actions>` (the actions its finding names, comma-separated), under the `step_tokens`
  # rule. Decided 2026-10-20 (story:the-judge-compares-the-steps-a-candidate-targets), since a
  # candidate that halved one step's tokens was refused on the run median other steps moved.
  # The whole run is judged first, as the comparison judges it (takt.work.Comparison), and its
  # refusals refuse this too. Then, per scenario and targeted action: each side's tokens at the
  # step, a figure a case (takt.work.ScorecardCase `step_tokens`), and the saved side's
  # cheapest. A step is better when no case of either side lacks a step of the action and every
  # candidate case is below the saved side's cheapest, or a one-sided exact Mann-Whitney U test
  # rejects equality at p <= 1/20: U counts the pairs of a candidate and a saved case in which
  # the candidate's is not below, so a tie counts against the candidate, and p is the share of
  # the equally likely arrangements of the two sides whose U is at most that, counted exactly
  # in integers; the test is run only with 5 cases a side or more (at five a side it rejects at
  # U of at most 4, 12 of 252 arrangements). A case of either side that took no step of the
  # action is named and the step is not better; a scenario neither side took the action in is
  # printed and not judged; an action no scenario took is not better. `better`: better on every
  # targeted step, no scenario worse on the run, exit 0. `not_better`: no scenario worse on the
  # run, some targeted step not better, exit 4. `worse_on_the_run`: some scenario worse on the
  # run, whatever the steps, refused naming the steps' result and those scenarios, exit 3. Exit
  # 1, no verdict: either side without the `step_tokens` definition or under another version of
  # it, an empty action, a targeted step whose tokens are unknown in a scenario case of either
  # side (takt.work.ScorecardRow `step_tokens`, a harness step of it having recorded no tokens,
  # or 0), naming the case and the step, or any refusal of the run's comparison, among them a
  # scenario case of unknown run tokens at any step, targeted or not (takt.work.Comparison);
  # `--steps` without `--against`
