  # read from: crates/takt/src/case.rs:1224-1226
  # read from: crates/takt/src/validator.rs:5066-5072
  # The same rule, through the same function, holds an improvement turn's
  # `candidate.merge_judge_surface`: the owner's grant, or an agent role's under an unrevoked
  # delegation in `.engineering/delegations.yaml` at the mainline's tip (the forge's `main`,
  # the local `main` under `--forge none`), never an agent's for a change to an owner-only
