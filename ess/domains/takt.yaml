  # What a check that failed printed that names what failed: the check's id (a gate's, or
  # `tests.run` for the test command's), the lines kept of its command's output, and how many of its non-blank lines were left out. A `gate.run`
  # whose gates are false keeps one per gate with a false assertion, from the output of each
  # admitted command that assertion names by its binding: the output the observation kept
  # (`process.run`, `ess.run`), or, for `process.succeeded`, which keeps only whether the command
  # exited 0, the command run again once, only when it failed, as the assertions library ran it
  # (no inherited environment, the binding's own, in the tree), after the evaluation, held to the
  # project file's timeout and output bound and to the run's end; when that run exits 0, one line
  # saying the command passed when run again (flaky) stands for its output. The lines: every
  # non-blank line, its terminal escape sequences (a colour's among them) and each other control
  # character but a tab taken out, its trailing white space cut, one past 512 bytes cut there;
  # left out whatever the room, each counted, a line of a credential's shape, read on the line so
  # cleaned, and a private key's block, from a `-----BEGIN ... PRIVATE KEY-----` line through its
  # `-----END` line or to the end; at most 4 KiB a check, each line counted with its line end,
  # and 8 KiB over all of one observation's checks. Past the bound, the last line
  # first (a checker's summary), then the lines that do not start with white space from the
  # start, then, once all of those fit, the indented ones, each in order until one does not fit.
  # Output that names failed tests is reduced instead (Python unittest's `FAIL: <test>` and
  # `ERROR: <test>` headings under a rule of `-`, pytest's `FAILED <id> - <error>` lines after
  # its `short test summary info`, libtest's `---- <test> stdout ----` sections after
  # `failures:`, a doctest's among them): one line per failed test,
  # `<FAIL|ERROR|FAILED> <test> - <its last error line>` (unittest's the first line not indented
