  # `left:` and `right:` lines joined by ` | `, after `panicked at <file>:<line>:<col>: ` when
  # the panic names its location on a line of its own), the test alone when that line is
  # withheld; then
  # the failing lines of another command the gate ran beside the tests (a compiler's `error:`
  # lines, a linter's `<path>:<line>[:<col>]: <code>` lines); kept in order until one does not
  # fit, the count left out being the failed tests and failing lines not kept, the error lines
  # and failing lines withheld, and each test's heading withheld whole or naming no test. None of
  # the runner's own lines (a passing test's, a program's usage text, a traceback's frames) is
  # kept.
