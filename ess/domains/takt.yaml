        type: Integer
      - name: saturated
        type: Boolean
      - name: step_tokens
        type: Map<takt.work.ActionId, Optional<Integer>>

  # One improvement turn's row on the loop scorecard (story:loop-scorecard), which `loop.measure`
  # prints over the recorded `self.improvement/1` cases. Decided 2026-10-18: one row per turn,
  # its turn id (the turn is a case), its finding, its baseline and candidate revisions, its
  # verdict, whether it was promoted, and its tokens and wall time taken from the turn's records.
  # A turn is a case on `self.improvement` at major version 1, as the case's own
  # `protocol.yaml` names them; a case on another major is no turn of this scorecard.
  # The wall time is in milliseconds, as takt.work.ScorecardRow's.
  # A turn whose case never reached an outcome gets a row too, its `verdict` absent, which means
  # open; and each row carries when its finding was filed and, once it was, verified. Decided
  # 2026-10-18. A row comes from the turn's own records under `.takt/cases/` and from
  # nothing else (a case copied under `docs/` is not read): its revisions from its snapshot, its
  # verdict, promotion and verification from the decisions Canon wrote for it, its tokens and
  # wall time from its run record, its filing from the planning store's history read through git
  # at the base. A field no record holds is absent, never guessed: the first turn, recorded by
  # hand, has no run record and no story record, so no tokens, wall time, finding or filing.
  # read from: .engineering/planning/story/loop-scorecard.md:34-37
  # read from: .engineering/planning/story/loop-scorecard.md:54-56
  # read from: .engineering/planning/design/recursive-self-improvement.md:194-196
  # read from: crates/takt/src/scorecard.rs:137-182
  # read from: crates/takt/src/loop_scorecard.rs:51-81
  # read from: crates/takt/src/loop_scorecard.rs:922-1041
  - name: takt.work.LoopScorecardRow
    kind: struct
    fields:
      - name: turn
        type: takt.work.CaseId
      # The key of the story or decision-blocker the turn's case was opened for (its
      # `story.yaml`), filed as `<kind>:<key>` with the reference `finding:<key>`; absent when the
      # case records none.
      # read from: crates/takt/src/loop_scorecard.rs:56-58
      # read from: scripts/file-finding:376
      - name: finding
        type: Optional<takt.work.FindingKey>
      - name: baseline
        type: takt.work.Revision
      - name: candidate
        type: takt.work.Revision
      # The outcome the turn's case completed through: accepted once promoted, declined when the
      # candidate still reproduces the finding, unreproducible when the baseline never did;
      # absent while the turn is open.
      # read from: engineering-protocols 0.10.0, protocols/self-improvement/1.yaml:11-12
      - name: verdict
        type: Optional<takt.work.OutcomeId>
      - name: promoted
        type: Boolean
      # The tokens and the wall time of the case's runs, summed as takt.work.ScorecardCase sums
      # them; absent when the case has no run record, and the tokens absent too unless every
      # harness step of it (every step but a validator's) reports a count and one does: a
      # harness that counts none, or some steps only, gives no count, never 0 or a partial sum,
      # and no turn the token figure read.
      # read from: crates/takt/src/loop_scorecard.rs:67-71
      - name: tokens
        type: Optional<Integer>
      - name: wall_ms
        type: Optional<Integer>
      # When the finding was filed: the committer time of the commit that added its artifact's
      # file to the planning store, found in the history of the revision the turn's `finding`
      # artifact was opened at (the store as it stood when the finding was filed), or of the
      # turn's `candidate` while `finding` names no commit of the repository (`r0`), by
      # following first parents back and comparing trees: the commit whose tree holds the file
      # while its first parent's does not, every commit read through the checked history, never
      # by `git log`; never at its `baseline`, which the finding was observed on and filed
      # after, nor at the loop case's `loop_baseline`, nor the case's first evaluation; absent
      # when it cannot be read (a first parent a shallow history lacks), an error when a commit
      # on the way does not check out or the walk passes 100,000 commits, and absent when it
      # comes after `verified_at` (a store committed after the run), so the time from finding to
      # verified is never negative.
      # When it was verified: the instant of the first decision of the last unbroken run of
      # decisions holding `scenario.passes_after` when the latest holds it, so a verification a
      # later candidate undid is absent again.
      # read from: crates/takt/src/loop_scorecard.rs:72-80
      - name: filed_at
        type: Optional<Timestamp>
        summary: When the turn's finding was filed in the store; absent when that cannot be read.
      - name: verified_at
        type: Optional<Timestamp>
        summary: When the finding was verified gone; absent until it is.

  # The loop scorecard: its rows, one per improvement turn. Its figures (turns, accepted share as
  # accepted rows over all rows, open ones included, promoted share, median tokens per accepted
  # turn, and the time from finding to verified, from each row's `filed_at` and `verified_at`)
  # are computed from the rows each time it is printed and never stored, so no field holds them.
  # Escaped defects are not among them: a later, human-sourced figure no validator observes.
  # Decided 2026-10-18 (story:loop-scorecard). Each figure is takt.work.LoopFigure, computed
  # under each definition takt.work.LoopMetric holds.
  # read from: .engineering/planning/story/loop-scorecard.md:57
  # read from: .engineering/planning/story/loop-scorecard.md:102
  # read from: crates/takt/src/loop_scorecard.rs:83-88
  # read from: crates/takt/src/loop_scorecard.rs:1043-1069
  - name: takt.work.LoopScorecard
    kind: struct
    fields:
      - name: rows
        type: List<takt.work.LoopScorecardRow>
        summary: One a recorded improvement turn.

  # One figure of the loop scorecard: a metric under one version of its definition, computed from
  # the rows it names and absent when no row counts towards it; a share prints as
  # `<counted>/<all>`. A version the code does not compute is an error, so a definition cannot
  # name a figure nothing computes. The code computes version 1 of each metric, and version 2
  # of the accepted share: accepted rows over the rows with a verdict, open turns left out. A
  # figure with a target and no value is below target: no data fails closed.
  # `loop.measure` retains the figures it computed as an
  # observation beside its record; the rows stay the source.
  # read from: crates/takt/src/loop_scorecard.rs:666-686
  # read from: crates/takt/src/loop_scorecard.rs:749-815
  - name: takt.work.LoopFigure
    kind: struct
    fields:
      - name: metric
        type: String
      - name: version
        type: Integer
      - name: current
        type: Boolean
        summary: Whether the version is the metric's current definition; a previous one prints beside it.
      - name: value
        type: Optional<Decimal>
      - name: shown
        type: String
      - name: target
        type: Optional<takt.work.LoopTarget>
      - name: below_target
        type: Boolean
      - name: cases
        type: List<takt.work.CaseId>
        summary: The turns the figure was computed from.

  # A loop metric's target: the figure at least, or at most, a value; exactly one of the two, and
  # a finite number (`.nan` or `.inf` is refused when the definitions are read) that the
  # metric's figures can take: a share's 0 to 1 (a metric whose id names a share in any
  # spelling, `ACCEPTED_SHARE`, `promoted_shares`), a count's, token figure's or time's 0 and
  # above.
  # read from: crates/takt/src/loop_scorecard.rs:90-119
  - name: takt.work.LoopTarget
    kind: struct
    fields:
      - name: at_least
        type: Optional<Decimal>
      - name: at_most
        type: Optional<Decimal>

  # One definition of a loop metric: the version the code computes it under, what it is in words,
  # and its target; a metric without a target is never below it.
  # read from: crates/takt/src/loop_scorecard.rs:121-132
  - name: takt.work.LoopMetricDefinition
    kind: struct
    fields:
      - name: version
        type: Integer
      - name: definition
        type: String
      - name: target
        type: Optional<takt.work.LoopTarget>

  # A loop metric as `protocols/loop-improvement/metrics.yaml` (format `takt-loop-metrics/1`)
  # holds it by id: its current definition and the previous ones whose figures print beside it.
  # The file is read at a revision through git, never from the working tree: the baseline's at
  # the case's `loop_baseline` revision once, when the case opens, into its snapshot
  # (takt.work.LoopBaselineSnapshot), which every loop validator reads after; the candidate's at
  # its `loop_candidate` revision. It is
  # a judge surface, as every path outside the allow-list is. Targets are the owner's: a
  # candidate cannot change one through the definition check, which finds any change to a
  # target (its value or its direction) `redefined`, whatever version or previous definitions
  # come with it. The targets, decided
  # by the planner: accepted share and promoted share at least 0.8, the time from finding to
  # verified at most 86400 s; none for the turns, and none yet for the median tokens per accepted
  # turn, set later from the first three accepted turns with a run record.
  # read from: protocols/loop-improvement/metrics.yaml
  # read from: crates/takt/src/loop_scorecard.rs:134-170
  # read from: crates/takt/src/loop_scorecard.rs:635-663
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  - name: takt.work.LoopMetric
    kind: struct
    fields:
      - name: current
        type: takt.work.LoopMetricDefinition
      - name: previous
        type: List<takt.work.LoopMetricDefinition>

  # What `loop.measure` came to, the result of a `loop_measurement` record about `loop_baseline`:
  # `below_target` when a current figure misses its target, or has a target and no value (no
  # data fails closed, and the L2 turn files "no data" for that metric as its finding), else
  # `at_target`, under the baseline's definitions as the case snapshotted them when it opened.
  # Fewer than three recorded turns, no snapshot of `loop_baseline`, or no definitions in it,
  # records nothing. The measurement retains the rows it read beside its figures, so a later
  # comparison stands on them.
  # read from: engineering-protocols 0.10.0, protocols/loop-improvement/1.yaml:32-36
  # read from: crates/takt/src/loop_scorecard.rs:1202-1210
  - name: takt.work.LoopMeasurementResult
    kind: enum
    variants: [below_target, at_target]

  # What `loop.definition.check` came to, the result of a `definition_check` record about
  # `loop_candidate`, the worst over the baseline's metrics: `unchanged` when each is the
  # candidate's current definition; `dual_reported` when one changed, took another version,
  # kept its target, and keeps the baseline's as a previous one beside every previous one the
  # baseline prints, so the figures of both print; `redefined` when one changed and only the new
  # figure prints (the same version, the baseline's dropped, a previous one the baseline prints
  # dropped or changed, the metric or the file gone), or its target changed. The figures the
  # candidate's definitions name are then computed over the recorded turns: a metric, kept or
  # added, any figure of which the code does not compute is `redefined`, since that figure
  # cannot print; so is every metric when the turns do not read. The baseline's definitions are
  # read only from the snapshot the case took when it opened (takt.work.LoopBaselineSnapshot),
  # never from the object store after a step ran; no snapshot of the case's current
  # `loop_baseline` records nothing. Git does not check a loose object's bytes against the id
  # it is stored under, so every read of the definitions (the snapshot's and the candidate's)
  # and of a baseline's ancestry reads its objects through one `git cat-file --batch` and checks
  # each in takt's own process, computing its id again from its kind and bytes in the
  # repository's object format (SHA-1 with collision detection, as git's SHA-1DC, or SHA-256,
  # its `extensions.objectFormat`), and refuses one whose bytes hash to another id, or are made
  # to collide, naming it. Every read is bounded: an object git reports
  # larger than its cap (a blob, the definitions, 256 KiB; a commit or a tree, 1 MiB), or of
  # another kind, is refused before any of it is read, and a read that takes longer than 10 s
  # (a header that overstates its body, a git that stalls), or past the run's deadline from its
  # hour budget when that comes first (each loop validator passes it down), kills `git
  # cat-file` and is an error naming the object; an observation that returns at or after the
  # run's deadline records nothing. `git cat-file` starts no process of its own (no git takt
  # runs fetches lazily) and stays in takt's process group: one of its own would be taken by
  # the forge's sweep of what a child left behind and killed under a live reader. After an
  # error the reader reads nothing more, and it kills and waits for its process when it is
  # done. Every commit the loop reads, in the validators and when a loop case opens, goes
  # through one checked history per call: no `git log`, `merge-base`,
  # `rev-list`, `rev-parse --verify` or `cat-file -e` answers any part of it; a revision is read
  # only as a full id of the repository's format, and an abbreviated one is refused, naming
  # it. A commit's header is read by git's own
  # rule: its tree first, its parents the `parent` lines directly after it, each line exact, no
  # carriage return stripped, so a `parent` line further down names no parent. The definitions
  # are read commit, tree by tree, blob. An ancestry is answered by walking from the tip through
  # the parents each commit's own checked header names, first parent first, every commit seen
  # once (a cycle a forged commit makes ends the walk), at most 100,000 commits (past them, an
  # error naming the cap; the cap bounds the reads, not the time, and with `--hours` every read
  # ends at the run's deadline); a commit on the way that cannot be read or does not check out is an
  # error naming it, never `false`, so a forged commit can neither add an ancestor nor hide
  # one; a commit the repository is shallow at ends its branch of the walk, and an ancestor not
  # found then is unknown, not an error. The figures come from the code in
  # `crates/takt/src/loop_scorecard.rs`, chosen by each metric's id and version, so the check
  # counts that code as part of the definitions: read at the baseline and at the candidate
  # through the checked history, any difference makes every metric `redefined`. Definitions
  # holding a YAML anchor or alias are refused from the parser's own events, naming the line,
  # before anything is deserialized: an alias expands without bound, and a file well under its
  # cap could expand to gigabytes. So are the turns' `case.yaml`, `protocol.yaml` and `story.yaml`
  # and the loop case's evidence records the loop validators read. The other
  # reads at a revision (the step guard's judge-surface list at the base, `judge_list_at`) still
  # read the object store a step could write unchecked: the checkpoint guards refs, replace
  # refs, `commondir`, `gitdir`, `shallow`, `objects/info/alternates` and the commit-graph, and
  # no git takt runs reads a commit-graph, but the objects themselves are not guarded, and
  # confining the step's writes closes that (story:confinement-seam).
