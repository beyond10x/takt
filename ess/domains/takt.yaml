  # read from: crates/takt/src/validator.rs:2696-2779
  # read from: crates/takt/src/git.rs:2341-2348
  # read from: crates/takt/src/validator.rs:566-574
  # read from: crates/takt/src/run.rs:6998-7021
  # read from: crates/takt/src/validator.rs:578-594
  # read from: crates/takt/src/validator.rs:838-846
  # read from: crates/takt/src/validator.rs:961-966
  # read from: crates/takt/src/validator.rs:1366-1378
  # read from: crates/takt/src/validator.rs:2374-2392
  # read from: crates/takt/src/validator.rs:359-384
  # read from: crates/takt/src/validator.rs:151
  # read from: crates/takt/src/validator.rs:2590-2602
