      # session when that argument is 131,072 bytes or more, so a file is also left out, as one
      # past 64 KiB is, when the argument metaharness would compose with it and the files kept
      # before it (its execution context, every file's framing, the prompt as composed with
      # those files, its line naming them included, measured afresh for each list tried) would
      # not fit: the files are bounded by the smaller of 64 KiB and what the prompt leaves of
      # the argument. The prompt is never cut; one too long by itself is given no file and
      # refused as before. When there are any, the prompt names them, each once, on one line
      # after the intent ("Files in scope, given above in full: <paths>; do not read them
      # again.") and its rule reads any other file of the directory with shell commands; with
      # none, the prompt is as it was without them. The step's opening record (`takt.prompt`, the
      # first line of its transcript) lists them in `context`, in order, each as metaharness
      # records one: its path, its bytes, their sha256 and its channel (`user-prompt`). Claude
      # Code's and b10x-harness's sessions are given the instruction files alone, and their record
      # lists them in `context` when they are given any.
      # read from: crates/takt/src/harness.rs
      # read from: crates/takt/src/harness.rs:233-251
      - name: context_files
        type: List<String>
      # The repository's instruction files every harness kind is given before the prompt, as
      # metaharness's `context` names them: the paths the run's configuration lists, `AGENTS.md`
      # and `CLAUDE.md` when it lists none, each only when the case's base commit tracks it as a
      # regular file. Each is read at that base commit, never from the step's copy of the tree, so
      # what an accepted step committed to the case's branch, or left in the tree, is not what the
      # next step reads; a case that pins no base gives none. They are bounded with the scope
      # files, by the same 8 files and 64 KiB in all, each costing what metaharness charges for
      # it. A file the base tracks that cannot be given (past the bounds, not UTF-8 text or holding
      # a NUL, of a credential's shape, or refused by the scan) is named with its cause, and the
      # step is refused before its session starts: the run stops with `StepRefused`, naming it in
      # its stop line and its record, never running the step without it. The step's opening
      # record (`takt.prompt`) lists them in `instructions`, each with its path, its bytes, their
      # sha256 and the base commit it was read at. Ambient discovery of project memory stays off.
      # read from: crates/takt/src/harness.rs:1845
      # read from: crates/takt/src/harness.rs:1883-1958
      - name: instruction_files
        type: List<String>

  # What a judgement step is shown of the change its case has made so far, one block of its
  # prompt after the open obligations and before the offered actions. `shown`: the diff from the
  # case's `base_commit` to `HEAD` over the paths its accepted judgement steps committed (read
  # from their `effect` lines, `.engineering/` left out), read with no configured code (no
  # configuration and no attributes from anywhere, no external diff, no text conversion, no
  # color, fixed context, algorithm and renames): each file that is not a test path whole and
  # each test file as its changed lines with 3 around each, or, when that is past the bound,
  # every file as its changed lines; labelled as the complete change, every line and file not
  # shown as at the base; every control but a line end and a tab replaced, fenced as data with
  # a backtick run longer than any inside it. `none_yet`: no
  # accepted step committed a path, or the paths are as they were at the base. `not_known`: the
  # case records no `base_commit`. `not_shown`: the diff is past the bound (8 KiB; the block
  # names its size), or, under the scan adapter `gates` (`takt.work.ScanName`) with
  # `B10X_GATES_POLICY` set, `b10x-gates scan-text` refused it or could not run, or it could not
  # be read; under a declared `none` it is shown unscanned.
  # read from: crates/takt/src/harness.rs
  # read from: crates/takt/src/run.rs
  # read from: crates/takt/src/git.rs
  # read from: crates/takt/src/scan/gates.rs:46-58
