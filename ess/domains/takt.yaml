  # read from: crates/takt/src/loop_scorecard.rs:1309-1322
  # read from: crates/takt/src/loop_scorecard.rs:1336-1377
  # read from: crates/takt/src/loop_scorecard.rs:191-500
  # read from: crates/takt/src/git.rs:361-765
