  # A trace: one case's run record (`events.jsonl`) rendered as a `takt-trace/1` file by
  # `takt trace --case <dir>`, a header line on the run and one line per operation in one
  # vocabulary whatever harness ran, which `takt report` reads for where the run's time and
  # tokens went. One file per case, every run of the case inside (`invocations`, `resumes`);
  # the header gives the task, the span, the stop, the tokens in four components and the cost.
  # Token and cost figures come from the raw usage the harness reported and from nothing else:
  # a figure no source states is absent, never 0. Summaries and command text are classified,
  # never copied, so a trace carries no local path. A record written before takt recorded the
  # model, cost, turns and durations per call is completed from a runner shim's `steps.jsonl`
  # (`--steps`), and `notes` say which fields it supplied. A free-running harness's run has no
  # case and no trace yet (story:normalized-harness-trace).
  # read from: crates/takt/src/trace.rs:1-16
  # read from: crates/takt/src/trace.rs:265-323
  # read from: crates/takt/src/trace.rs:1231-1234
  # read from: crates/takt-cli/src/main.rs:70-80
  # read from: crates/takt/src/report.rs:1-9
  # `takt view <dir> [--output <file>]` writes the traces under a directory as one offline
  # page, `takt-view.html` in the current directory when no `--output` is given, replacing a
  # file there (story:takt-view-renders-runs). It walks the directory in name order, below it
  # through no link and into no `.git`, `target` or `node_modules`, and reads as a trace every
  # file whose first line is a `takt-trace/1` header, but a file named `events.jsonl` or laid
  # out as a step transcript; each trace is a run, a lane on one time axis, and each of its
  # operations a mark naming its step, action and outcome. A step's transcript is the first
  # of: the file the `transcript` field of its trace line names, when the line carries one; the
  # one its step line names in the case's `events.jsonl` (beside the trace, else the one under
  # the directory whose case is the trace's), the trace's n-th step read against the record's
  # n-th step line and only where their step and action agree; for a harness step, the file
  # laid out as `<case>/run-<r>/step-<n>.jsonl` when exactly one under the directory is. A name
  # is matched only against the files under the directory laid out as transcripts. A
  # transcript past 256 KiB is embedded as its first and its last 128 KiB, each cut back to
  # whole lines, with a `takt.view.cut` line between them counting the bytes left out. Every path and transcript
  # the page adds passes the trace's escape, which names the home directory as `~`. The page
  # holds its stylesheet, Vue, its script and its data (`takt-view/1`) inline and fetches
  # nothing. It is created readable by its owner only (`0600`), as a transcript carries what
  # the model read; a file already at the output path is truncated and keeps its mode. The
  # command prints `written: <file> (<runs> runs, <operations> operations, <k> of <n> harness
  # steps with a transcript)`, exit 0. A path that is no directory, or a directory that holds
  # no trace, is refused, exit 1, naming it, and nothing is written; so is a file that begins
  # as a trace and does not read as one, naming the file. The page is a rendering of traces,
  # recorded nowhere, so `takt view` declares no entity of its own.
  # read from: crates/takt-cli/src/main.rs:81-89
  # read from: crates/takt-cli/src/main.rs:475-482
  # read from: crates/takt-cli/src/main.rs:486-489
  # read from: crates/takt-cli/src/main.rs:1535-1546
  # read from: crates/takt-cli/src/main.rs:1377-1381
  # read from: crates/takt/src/view.rs:1-15
  # read from: crates/takt/src/view.rs:33-37
  # read from: crates/takt/src/view.rs:69-82
  # read from: crates/takt/src/view.rs:115-126
  # read from: crates/takt/src/view.rs:209-233
  # read from: crates/takt/src/view.rs:269-284
  # read from: crates/takt/src/view.rs:327-362
  # read from: crates/takt/src/view.rs:387-388
  # read from: crates/takt/src/view.rs:413-421
  # read from: crates/takt/src/view.rs:440-457
