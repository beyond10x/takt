        `takt.choice`: the one action it performs, the action the harness took.
    identity:
      name: producer
      type: takt.work.ProducerName
    fields:
      - name: action
        type: takt.work.ActionId
    # Made for one step and dropped after it; nothing moves it.
    lifecycle:
      initial: Ready
      states: [Ready]
      terminal: [Ready]

  # The case's evidence port: the one way a record reaches a case's `evidence/`. takt delivers the
  # record to the case first as an observation from its producer, kept in `observations.json`,
  # and then submits it through `submit_evidence` of loom-sdk citing that observation, with the
  # producer named by takt beside the record: the validator whose effect observed it,
  # `takt.choice` for a choice record, or `takt.tests-write` for a `tests_change`. The name the
  # record carries is overwritten by it. The port
  # takes a record only for its own case, from a producer among those it was made for (the run's
  # validators, `takt.choice` or `takt.tests-write`), citing an observation the case received at the record's `observed_at`, and as
  # a `canon-evidence/1` record that reads back whole; any other is refused with nothing written.
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/evidence.rs:13-16
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/evidence.rs:102-135
