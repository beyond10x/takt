    fields:
      - name: actions
        type: List<takt.work.ActionId>
      - name: brief
        type: String
      - name: change_so_far
        type: takt.work.ChangeSoFar
      # What the last observation of each validator's action failed (`takt.work.FailedCheck`),
      # taken from the case's record so far: the `failed` of the evidence lines of each action's
      # last validator step, so a later observation of the action that failed nothing leaves it
      # nothing. Shown as one block of the prompt after the open obligations and before the
      # change so far: a line that opens it ("The last gate run failed: ..."), then for each
      # check `gate <id>:`, with ` (<n> lines left out)` before the colon when some were, and its
      # lines fenced as data with a backtick run longer than any inside them; for a test
      # runner's output, one line per failed test and its last error line. Each path under the
      # tree in those lines, as given or canonicalised, is written relative to the tree, the tree
      # itself as `.`. The block closes on the lines that say the gate must pass before the
      # change can be handed over and merged, that a file the failed gates' output names is part
      # of this change even when it is outside the story's Scope, and to fix every failed gate in
