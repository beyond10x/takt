  # One replay of one judgement step of a recorded case (`takt replay --case <dir> --step <n>
  # [--times <k>] [--run <r>]`), from the state the step started from, rebuilt from the case's
  # record: the revision it started at, the last the record names before the step's line (a
  # validator's observed revision, a step's committed effect, a store write's commit), else the
  # parent of the step's own commit; the decision its run last evaluated before it, at which it
  # was offered its actions, with each action the governor's document finds approval-required
  # answered as the run answered it: by the case's authority over the case revision and the
  # artifact revisions the decision was computed at (takt.work.AuthorityAnswer, `authority.yaml`
  # of the case directory read as it is now), where the record's line for that evaluation shows
  # the run had that answer, so a step offered an action through a grant is offered it again,
  # and an action the run was not granted at those revisions is not offered; the evidence
  # records written before it; the record up to its line; and the case's intent, protocol and
  # inputs. Only a judgement step is replayed, one whose first line is the harness's step line:
  # a validator's step, a refusal or an error is refused,
  # exit 1, and so is a step the record does not hold, holds in several runs without `--run`, or
  # holds with no decision or no revision before it. Before anything runs, the prompt rebuilt
  # from the record is compared byte for byte with the first line of the recorded step's
  # transcript (under `--transcripts`, else where `takt run` keeps them): one that differs
  # replays nothing, exit 3, naming the byte it differs from; with no recorded transcript found
  # it is said and not compared. Each replay runs the harness once in a scratch worktree of the
  # case's repository (`--repo`, else the tree the case directory lies in) at that revision,
  # detached, in which the case directory is rebuilt as the step found it but for what the
  # record cannot date (`authority.yaml`, `artifacts/`, `riders/`, `run.lock`), with the offer
  # the run made at that decision under the approval gate `--gate`, else the protocol's
  # default; the worktree is removed whatever the step did. Each replay is recorded as
  # `<replays>/replay-<k>/replay.json` (format `takt-replay/1`) beside its transcript
  # `transcript.jsonl`, both created new and readable by their owner only, outside the case
  # directory, the tree it lies in and the repository's tree: a replays directory inside any of
  # them, through any link, is refused, exit 1. The case is rebuilt without following a link: a
  # link on the way to the case directory in the revision's tree, at its `evidence/` or
  # `decisions/`, at a file written there, or at the case's `intent.md` or `protocol.yaml`, is
  # refused, exit 1 (its `events.jsonl` is read through a link, never written). A relative `--out`
  # is made absolute against the working directory takt runs in before it is checked. Without `--out` the replays directory is
  # `$XDG_STATE_HOME/takt/replays/<repo-key>/<case>/run-<r>/step-<n>/<instant>`
  # (`~/.local/state` without `XDG_STATE_HOME`). The case directory is only read. A replay whose
  # harness failed is recorded with its error, the others still run, and the command exits 5;
  # else 0. Declared an entity in wave 20, as the draft of
  # story:a-step-replays-from-its-recorded-state proposed: a recorded noun with an identity of
  # its own, as takt.work.Trace is.
  # The replay names the step it replays by its case, its run's ordinal in the case and its
  # number, and no field carries takt.work.Step's identity (takt.work.StepKey, by the run's id,
  # which no record holds), so that relation is stated here and not declared.
  # read from: crates/takt/src/replay.rs:1-17
  # read from: crates/takt/src/replay.rs:30-43
  # read from: crates/takt/src/replay.rs:132-374
  # read from: crates/takt/src/replay.rs:379-463
  # read from: crates/takt/src/replay.rs:560-605
  # read from: crates/takt/src/replay.rs:708-856
  # read from: crates/takt/src/replay.rs:859-872
  # read from: crates/takt/src/replay.rs:874-917
  # read from: crates/takt-cli/src/main.rs:112-121
  # read from: crates/takt-cli/src/main.rs:125-172
  # read from: crates/takt-cli/src/main.rs:174-292
  # read from: crates/takt/src/run.rs:8454-8463
  - name: takt.work.StepReplay
    naming:
      summary: >-
        One judgement step of a recorded case run again from the state it started from, in a
        scratch worktree, recorded outside the case.
    identity:
      name: id
      type: takt.work.StepReplayId
    fields:
      - name: format
        type: String
        summary: The format, `takt-replay/1`.
      - name: case
        type: takt.work.CaseId
      - name: run
        type: Integer
        summary: The run of the case the step is in, from 1, the run that opened it.
      - name: step
        type: takt.work.StepNumber
        summary: The step's number in its run, as the record numbers it.
      - name: replay
        type: String
        summary: The replay's directory name, `replay-<k>`, k from 1.
      - name: revision
        type: takt.work.Revision
        summary: The commit the step started at, resolved.
      - name: revision_from
        type: String
        summary: Which line of the record named it, for a person.
      - name: decision
        type: String
        summary: The decision the step was offered its actions at, `decisions/<seq>.json`.
      - name: offered
        type: List<takt.work.ActionId>
        summary: The actions the run offered at that decision.
      - name: approvals
        type: List<takt.work.ActionId>
        summary: The approval-required actions the step could request there.
      - name: evidence
        type: List<String>
        summary: The evidence records written before the step, by their names under `evidence/`.
      - name: not_rebuilt
        type: List<String>
        summary: What of the case directory the replay did not rebuild, the record not dating it.
      - name: recorded_action
        type: String
        summary: The action the recorded step took.
      - name: recorded_transcript
        type: Optional<String>
        summary: The recorded step's transcript as its line names it.
      - name: harness
        type: takt.work.HarnessName
      - name: started_at
        type: Timestamp
      - name: prompt
        type: String
        summary: >-
          `as recorded`, `differs` or `unrecorded`: the replay's transcript's first line, its
          prompt, against the recorded step's, byte for byte.
      - name: action
        type: Optional<takt.work.ActionId>
        summary: The action the harness reported; absent when the step failed.
      - name: summary
        type: Optional<String>
      - name: error
        type: Optional<String>
        summary: Why the step failed; absent when it did not.
      - name: tokens
        type: Optional<Integer>
      - name: usage
        type: Optional<takt.work.TokenUsage>
      - name: model
        type: Optional<String>
      - name: cost_usd
        type: Optional<Decimal>
      - name: duration_ms
        type: Optional<Integer>
      - name: turns
        type: Optional<Integer>
      - name: changed
        type: List<String>
        summary: The paths the step changed in its scratch tree, the case directory left out.
    relations:
      # A replay reads one case's record and never writes to it.
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # What a judgement step's session proposes, when the harness works in a scratch copy of the
  # case tree and never in the tree itself (`--harness claude`: Claude Code through metaharness,
  # `Kind::Claude`, `HermeticMode::Strict`, its native file tools, the copy its working
  # directory): the one action it names and the files it changes, each by its path relative to
  # the tree with its content. One call of the executor per frontier yields one outcome, which
  # proposes and completes nothing. takt's edit effect applies it to the case tree under the step
  # guard: a proposal that names an action the frontier did not offer, that changes a file for
  # an action that changes none or records a choice, a non-test path for `tests.write`, a path
  # in the cases directory, under `.git` or on the judge surface, a path reached through a link,
  # or a path git ignores, which the scratch copy never held, is refused before a byte of it
  # reaches the tree, and the run stops `StepRefused`; one that
  # passes is written to the tree and judged by the step guard as any step's change. Its content
  # is read before either: the paths it names, what each proposed file adds to the file `HEAD` held
  # before the step (the lines a line diff finds added, each run with the lines around it up to the
  # 56 bytes one match can span, so a private key's first line that crosses a line end is read
  # whole; a new file, or one that revision holds as no text, whole) and the session's summary are checked for
  # the shape of a credential (a private key, a JWT, an Anthropic, GitHub, GitLab or OpenAI token,
  # a token field, glab's `token:` line), under every scan adapter, and scanned by the run's scan
  # adapter (`takt.work.ScanName`), each apart: under `gates`, `b10x-gates scan-text` under the
  # policy `B10X_GATES_POLICY` names. A match, a scan that cannot run (no scanner, a policy that
  # does not load, any exit but 0), or, under `gates`, no policy set for a session that could read
  # outside its copy (Codex's, whose sandbox grants reading the whole file system, and
  # b10x-harness's, whose calls are observed and decided by none) refuses the proposal whole
  # before a byte of it is written, naming the file or
  # the summary and never the text matched, and the step's summary is not recorded; `takt run`
  # refuses such a run before its case opens. A Claude Code session's every read is decided
  # inside its copy, and with no policy set its proposal is checked for the shapes only, as every
  # proposal is under a declared `none`. A Codex session's home is its own, in its scratch root,
  # so `~` reaches nothing of the user's; an absolute path into the user's home is still read
  # where the sandbox grants it, and the scan is what keeps such content from leaving the step.
  # read from: Loom 0.28.0, crates/loom-commission/src/ports/executor.rs:1-5
  # read from: Loom 0.28.0, crates/loom-commission/src/ports/effect.rs:1-8
  # read from: crates/takt/src/harness.rs:136-141
  # read from: crates/takt/src/run.rs:12851-12859
  # read from: crates/takt/src/run.rs:11328-11338
  # read from: Loom 0.35.0, crates/loom-session-executor/src/lib.rs:129-138
  # read from: crates/takt-cli/src/main.rs:2447-2495
  # read from: crates/takt/src/harness.rs:143-149
  # read from: crates/takt/src/run.rs:12861-12867
  # read from: crates/takt/src/run.rs:8851-8938
  # read from: crates/takt/src/run.rs:8705-8727
  # read from: crates/takt/src/run.rs:8790-8793
  # read from: crates/takt/src/run.rs:8832-8846
  # read from: GitLab 19.5.1, doc/security/tokens/_index.md:426-449
  # read from: Loom 0.35.0, crates/loom-session-executor/src/lib.rs:1232-1239
  # read from: crates/takt/src/run.rs:12877-12882
  # read from: crates/takt/src/scan.rs:154-159
  - name: takt.work.Proposal
    naming:
      summary: >-
        The change a judgement step's session proposes from its scratch copy: the action it names
        and the files it changes, applied by takt's edit effect under the step guard.
    identity:
      # One proposal at most per judgement step: the step's key.
      name: key
      type: takt.work.StepKey
    fields:
      - name: action
        type: takt.work.ActionId
        summary: The one action the session names, which must be among those offered.
      - name: summary
        type: String
        summary: One line on what the session did, as it said it.
      - name: files
        type: List<takt.work.ProposedFile>
        summary: >-
          Every file of the copy the session changed, added or removed, by its path relative to
          the tree; none for an action that changes no file.
    relations:
      # A proposal is made at one judgement step and applied, or refused, there.
      - name: step
        kind: references
        target: takt.work.Step
        cardinality: one
        via: key
    lifecycle:
      initial: Proposed
      states: [Proposed]
      terminal: [Proposed]

  # The sixth seam, beside the five of `docs/design/takt.md` § 3: the outer lifecycle of a
  # dispatched child's working tree. It is called only through the `worktree` command line, each
  # call one process whose arguments no shell reads, with the seam's own session as the lease
  # holder. It creates a tree (`worktree create --purpose takt:<case>`), takes a lease on it
  # (`worktree hook session-start`), and on the child's stop leaves it: archived and released for
  # a stop that is not terminal, released and finished (`worktree finish --discard-cache
  # --archive`) for a terminal outcome. It never runs `gc`, never removes a tree, and acts only on
  # a tree it created: the one a case's `worktree` names, checked against the registry for its
  # purpose and its lifecycle before any call, never one found by its purpose alone. `takt run`
  # has no flag for any of it.
  # read from: .engineering/planning/design/continuous-orchestration.md:133
  # read from: .engineering/planning/story/the-workspace-seam-enters-and-leaves-managed-worktrees.md:38-48
  - name: takt.work.Workspace
    naming:
      summary: >-
        The seam that creates, leases, archives and finishes the managed worktrees of dispatched
        children, through the `worktree` command line alone.
    identity:
      name: session
      type: String
    fields:
      - name: program
        type: String
        summary: The `worktree` program the seam starts, found on `PATH` by name unless given.
      - name: env
        type: Map<String, String>
        summary: The environment the seam adds to each call, none by default.
    relations:
      - name: trees
        kind: owns
        target: takt.work.CaseTree
        cardinality: many
        via: session
    lifecycle:
      initial: Ready
      states: [Ready]
      terminal: [Ready]

  # The managed worktree the Workspace seam made for one dispatched case, with the purpose
  # `takt:<case id>` and the lease the seam's session holds while a run works in it. A second
  # entry for the same case reuses the tree its `case.yaml` names, taking the lease again, and
  # makes no second one. A non-terminal stop archives it (`worktree archive`, a second archive
  # replacing the first, which `--replace` moves aside and never deletes) and releases the lease:
  # the case resumes in the same tree. A terminal outcome releases the lease and finishes it
  # (`worktree finish --discard-cache --archive`): the tree stays on disk for the worktree
  # manager's own cleanup, and the case's records, which are at the cases root, are unaffected.
  # read from: .engineering/planning/story/the-workspace-seam-enters-and-leaves-managed-worktrees.md:38-46
  - name: takt.work.CaseTree
    naming:
      summary: >-
        The managed worktree a dispatched child works in: created with the purpose `takt:<case>`,
        leased while a run holds it, archived when the child stops, finished when it completes.
    identity:
      name: id
      type: takt.work.TreeId
    fields:
      - name: session
        type: String
        summary: The lease session of the Workspace that made the tree.
      - name: case
        type: takt.work.CaseId
        summary: The case the tree was made for.
      - name: path
        type: String
        summary: The tree's absolute path, as the `worktree` registry records it.
      - name: purpose
        type: String
        summary: Always `takt:<case id>`; the registry's record of why the tree exists.
    relations:
      - name: case
        kind: references
        target: takt.work.Case
        cardinality: one
        via: case
    # Archived, released and finished are the registry's records of the tree (`worktree status`),
    # not states takt moves a noun through: nothing in takt holds a state for the tree but the
    # case's `worktree` path.
    lifecycle:
      initial: Created
      states: [Created]
      terminal: [Created]

  # `case.dispatch`, the minimal form: a deterministic step that opens a child case for a unit
  # under a parent. Its effect is a child case directory under the cases root of the checkout
  # that dispatched it, holding `parent` and `worktree` in its `case.yaml`, and a managed
  # worktree for the child made by the Workspace seam, on which the child's branch `takt/<id>` is
  # cut; the child's records are written to the root and no case file is written in its tree. A
  # case that already exists at the root is resumed in the tree it names, never opened a second
  # time. The declared setup of the run file runs in the child's tree. The `children` artifact,
  # `child.outcome` and the budget slice are not built.
  # read from: .engineering/planning/design/continuous-orchestration.md:128
  # read from: .engineering/planning/story/the-workspace-seam-enters-and-leaves-managed-worktrees.md:38-40
  - name: takt.work.Dispatch
    naming:
      summary: >-
        The opening of a child case under a parent, in a managed worktree of its own, its records
        at the root.
    identity:
      name: child
      type: takt.work.CaseId
    fields:
      - name: parent
        type: takt.work.CaseId
        summary: The case that dispatched the child.
      - name: tree
        type: takt.work.TreeId
        summary: The managed worktree the child works in.
    relations:
      - name: child
        kind: references
        target: takt.work.Case
        cardinality: one
        via: child
      - name: tree
        kind: references
        target: takt.work.CaseTree
        cardinality: one
        via: tree
    lifecycle:
      initial: Dispatched
      states: [Dispatched]
      terminal: [Dispatched]
