  # benchmark names a dataset version; nothing says how one is derived from the other, so no
  # field carries a bench id.
  # read from: bench 0.1.0 at e3c44fd, docs/design/bench-entities-v0.1.md:132-134
  # UNMAPPED: whether takt's own scenarios (takt.work.Scenario) are benchmark tasks too, so that
