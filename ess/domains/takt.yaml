  # read from: crates/takt/src/scorecard.rs:78-87
  - name: takt.work.ScorecardNaming
    kind: enum
    variants: [build, head]

  # One run's figures on a scorecard: the case; the scenario, from a case id
  # `scenario-<id>-trial-<n>` only; the outcome (for a scenario run `failed` when its held-out
  # check did not pass, else its stop); its own stop (a `Completed` stop's outcome, else the
  # stop's kind, `error` for a run that ended on one, `unfinished` for one with neither); the steps, the
  # highest step number of its lines; the tokens, the sum of those the harness reported on its
  # `step` lines; its `refusal` lines; 1 when it stopped `NoProgress`; its `error` lines; the
  # milliseconds from its first instant to its last; and whether a sum stopped at the largest
  # integer. A run spans one `opened` line to its `stop`, or to the next `opened` or the end of
  # the record; a `skipped` line is no instant of any run.
  # The binary the run was made with, as stated beside its record (takt.work.RunBinary), on each
  # run of a case whose directory holds a `binary.txt`; absent otherwise.
  # read from: crates/takt/src/scorecard.rs:89-132
  # read from: crates/takt/src/scorecard.rs:350-355
  # read from: crates/takt/src/scorecard.rs:496-538
  # Decided 2026-10-19 (story:scorecard-outcome-from-held-out-check): a scenario run's outcome
  # comes from the held-out check the runner wrote beside its record (takt.work.HeldOut), never
  # from the run's own record. Every run of a scenario case carries the case's result; one that
  # did not pass scores the run `failed`, ranked with an error, and a pass leaves the run's stop
  # as its outcome. The stop is kept beside the outcome (`stop`, empty on a file saved before
  # it), printed beside it, and a run whose stop claims a completion while the check did not pass
  # is named as a disagreement. A scenario case with runs and no `held-out.txt`, or one that does
  # not read or states no result, refuses the scorecard naming the case; a case that is no
  # scenario needs none. The outcome metric's definition is at version 2. Each run also carries
  # the revision its `opened` line names (`opened_binary`: what `takt --version` printed,
  # `<sha>`, `<sha>-dirty` or `unknown revision`), absent when the line names none
  # (story:promote-binds-scorecard-and-merge).
  # read from: crates/takt/src/scorecard.rs:134-169
  # read from: crates/takt/src/scorecard.rs:641-723
  # read from: .engineering/planning/story/scorecard-outcome-from-held-out-check.md (§ Outcome)
  - name: takt.work.ScorecardRow
    kind: struct
    fields:
      - name: case
        type: takt.work.CaseId
      - name: scenario
        type: Optional<takt.work.ScenarioId>
      - name: outcome
        type: String
      - name: steps
        type: Integer
      - name: tokens
        type: Integer
      - name: refusals
        type: Integer
      - name: no_progress
        type: Integer
      - name: errors
        type: Integer
      - name: wall_ms
        type: Integer
      - name: saturated
        type: Boolean
      - name: binary
        type: Optional<takt.work.RunBinary>
      - name: stop
        type: String
      - name: held_out
        type: Optional<takt.work.HeldOut>
      - name: opened_binary
        type: Optional<String>

  # The held-out check's result for a scenario case, as the runner wrote it after the run in
  # `.engineering/cases/<case>/held-out.txt`, beside the record and never by the takt binary under
  # judgement: whether it passed (a first line `PASS`) and its first line verbatim (`PASS`,
  # `FAIL: <reason>`, `no pull request`); every further line is a note and not read. Decided
  # 2026-10-19 (story:scorecard-outcome-from-held-out-check).
  # Limit, stated 2026-10-19: the takt binary under judgement runs as the same user as the
  # runner and can write into the case directory, so it can plant a `held-out.txt` itself. The
  # scorecard cannot tell who wrote the file; a planted one is refused only because it exists
  # first: the runner writes the file after the run and refuses one that already exists.
  # A saved scorecard with a run whose outcome is not what its held-out result makes it
  # (`failed` unless it passed, else the run's stop), as a hand edit leaves it, is refused on
  # load naming the run (review of 2026-10-19); whether a run passed is derived from its `result`,
  # and a saved `passed` that disagrees with it is refused the same way; so is a run whose
  # `scenario` is not the one its case id names, the scenario being derived from the case id.
  # read from: crates/takt/src/scorecard.rs:50-58
  # read from: crates/takt/src/scorecard.rs:142-169
  # read from: crates/takt/src/scorecard.rs:910-972
  - name: takt.work.HeldOut
    kind: struct
    fields:
      - name: passed
        type: Boolean
      - name: result
        type: String

  # Who stated a run's binary, or a record's revision, when the binary could not: the operator,
  # in a `binary.txt` beside the run's record or by `takt promote --revision`, for a binary whose
  # `--version` names no revision; or the run's record itself, which no record does today. A
  # statement is marked as such wherever it is copied, so a reader tells it from a measurement.
  # read from: crates/takt/src/scorecard.rs:171-179
  - name: takt.work.StatedBy
    kind: enum
    variants: [operator, record]

  # The binary a run was made with, as stated rather than measured: its sha256, lower-case hex;
  # who stated it; and the operator's note. The operator writes
  # `.engineering/cases/<case>/binary.txt` beside the run's record, its first line
  # `<path>\t<sha256>` (the path as written, `~` and all; only the digest is read) and every
  # further line the note, copied verbatim; a file without a note is accepted, and one that does
  # not read or whose first line is no `<path>\t<sha256>` leaves its case's runs stating no
  # binary and lists the case in the scorecard's `no_record`, the reason in its `unstated`,
  # every other case read as without it, never the scorecard refused. `takt scorecard` reads it
  # onto each run of the case and saves it with the row, never a figure from it; `takt promote
  # --baseline-only --binary-sha256` checks each run's digest against the binary it hashes.
  # read from: crates/takt/src/scorecard.rs:1-35
  # read from: crates/takt/src/scorecard.rs:60-64
  # read from: crates/takt/src/scorecard.rs:181-190
  # read from: crates/takt/src/scorecard.rs:201-227
  # read from: crates/takt/src/scorecard.rs:641-723
  - name: takt.work.RunBinary
    kind: struct
    fields:
      - name: sha256
        type: String
      - name: stated_by
        type: takt.work.StatedBy
      - name: note
        type: String

  # One run of the scorecard a stated baseline read, copied into the promotion record with the
  # binary it states (takt.work.RunBinary): the digest, who stated it and the operator's note.
  # read from: crates/takt/src/promotion.rs:223-231
  - name: takt.work.RecordedRun
    kind: struct
    fields:
      - name: case
        type: takt.work.CaseId
      - name: binary
        type: takt.work.RunBinary

  # The refusal a candidate judged again on new runs (`takt promote --rejudge`) was refused by
  # before: that record's file name in the store and the sha256 of the file. Decided 2026-10-19
  # (story:promotion-refusal-is-not-final).
  # read from: crates/takt/src/promotion.rs:215-221
  - name: takt.work.Rejudged
    kind: struct
    fields:
      - name: record
        type: String
      - name: sha256
        type: String

  # The head of the chain of promotion records: the latest record's file name in the store and
  # the sha256 of that file, kept in one file beside the record directory,
  # `<state>/takt/promotions.head`, outside it, and written with every record under the store's
  # lock. Decided 2026-10-19 (story:promotion-chain-head-anchored).
  # read from: .engineering/planning/story/promotion-chain-head-anchored.md:50
  # read from: crates/takt/src/promotion.rs:205-213
  - name: takt.work.PromotionHead
    kind: struct
    fields:
      - name: record
        type: String
      - name: sha256
        type: String

  # One case's figures on a scorecard, the unit a comparison counts: its outcome, the best a run
  # of it completed with, else its last run's (a completed case is final: a merged case does not
  # reopen, so an `accepted` case stays `accepted` whatever a later run ended on); its runs, and
  # its runs' steps, tokens, refusals, errors and wall times summed, a sum stopping at the largest
  # integer and flagged; 1 when its outcome is `NoProgress`. Derived from the runs, never saved
  # apart from them.
  # read from: crates/takt/src/scorecard.rs:229-300
  # read from: crates/takt/src/scorecard.rs:726-740
  - name: takt.work.ScorecardCase
    kind: struct
    fields:
      - name: case
        type: takt.work.CaseId
      - name: scenario
        type: Optional<takt.work.ScenarioId>
      - name: outcome
        type: String
      - name: runs
        type: Integer
      - name: steps
        type: Integer
      - name: tokens
        type: Integer
      - name: refusals
        type: Integer
      - name: no_progress
        type: Integer
      - name: errors
        type: Integer
      - name: wall_ms
        type: Integer
      - name: saturated
        type: Boolean

  # One improvement turn's row on the loop scorecard (story:loop-scorecard), which `loop.measure`
  # prints over the recorded `self.improvement/1` cases. Decided 2026-10-18: one row per turn,
  # its turn id (the turn is a case), its finding, its baseline and candidate revisions, its
  # verdict, whether it was promoted, and its tokens and wall time taken from the turn's records.
  # A turn is a case on `self.improvement` at major version 1, as the case's own
  # `protocol.yaml` names them; a case on another major is no turn of this scorecard.
  # The wall time is in milliseconds, as takt.work.ScorecardRow's.
  # A turn whose case never reached an outcome gets a row too, its `verdict` absent, which means
  # open; and each row carries when its finding was filed and, once it was, verified. Decided
  # 2026-10-18. A row comes from the turn's own records under `.engineering/cases/` and from
  # nothing else (a case copied under `docs/` is not read): its revisions from its snapshot, its
  # verdict, promotion and verification from the decisions Canon wrote for it, its tokens and
  # wall time from its run record, its filing from the planning store's history read through git
  # at the base. A field no record holds is absent, never guessed: the first turn, recorded by
  # hand, has no run record and no story record, so no tokens, wall time, finding or filing.
  # read from: .engineering/planning/story/loop-scorecard.md:34-37
  # read from: .engineering/planning/story/loop-scorecard.md:54-56
  # read from: .engineering/planning/design/recursive-self-improvement.md:185-187
  # read from: crates/takt/src/scorecard.rs:89-126
  # read from: crates/takt/src/loop_scorecard.rs:52-82
  # read from: crates/takt/src/loop_scorecard.rs:923-1050
  - name: takt.work.LoopScorecardRow
    kind: struct
    fields:
      - name: turn
        type: takt.work.CaseId
      # The key of the story or decision-blocker the turn's case was opened for (its
      # `story.yaml`), filed as `<kind>:<key>` with the reference `finding:<key>`; absent when the
      # case records none.
      # read from: crates/takt/src/loop_scorecard.rs:57-59
      # read from: scripts/file-finding:308
      - name: finding
        type: Optional<takt.work.FindingKey>
      - name: baseline
        type: takt.work.Revision
      - name: candidate
        type: takt.work.Revision
      # The outcome the turn's case completed through: accepted once promoted, declined when the
      # candidate still reproduces the finding, unreproducible when the baseline never did;
      # absent while the turn is open.
      # read from: protocols/self-improvement/1.yaml:11-12
      - name: verdict
        type: Optional<takt.work.OutcomeId>
      - name: promoted
        type: Boolean
      # The tokens and the wall time of the case's runs, summed as takt.work.ScorecardCase sums
      # them; absent when the case has no run record, and the tokens absent too unless every
      # harness step of it (every step but a validator's) reports a count and one does: a
      # harness that counts none, or some steps only, gives no count, never 0 or a partial sum,
      # and no turn the token figure read.
      # read from: crates/takt/src/loop_scorecard.rs:68-72
      - name: tokens
        type: Optional<Integer>
      - name: wall_ms
        type: Optional<Integer>
      # When the finding was filed: the committer time of the commit that added its artifact's
      # file to the planning store, found in the history of the revision the turn's `finding`
      # artifact was opened at (the store as it stood when the finding was filed), or of the
      # turn's `candidate` while `finding` names no commit of the repository (`r0`), by
      # following first parents back and comparing trees: the commit whose tree holds the file
      # while its first parent's does not, every commit read through the checked history, never
      # by `git log`; never at its `baseline`, which the finding was observed on and filed
      # after, nor at the loop case's `loop_baseline`, nor the case's first evaluation; absent
      # when it cannot be read (a first parent a shallow history lacks), an error when a commit
      # on the way does not check out or the walk passes 100,000 commits, and absent when it
      # comes after `verified_at` (a store committed after the run), so the time from finding to
      # verified is never negative.
      # When it was verified: the instant of the first decision of the last unbroken run of
      # decisions holding `scenario.passes_after` when the latest holds it, so a verification a
      # later candidate undid is absent again.
      # read from: crates/takt/src/loop_scorecard.rs:73-81
      - name: filed_at
        type: Optional<Timestamp>
        summary: When the turn's finding was filed in the store; absent when that cannot be read.
      - name: verified_at
        type: Optional<Timestamp>
        summary: When the finding was verified gone; absent until it is.

  # The loop scorecard: its rows, one per improvement turn. Its figures (turns, accepted share as
  # accepted rows over all rows, open ones included, promoted share, median tokens per accepted
  # turn, and the time from finding to verified, from each row's `filed_at` and `verified_at`)
  # are computed from the rows each time it is printed and never stored, so no field holds them.
  # Escaped defects are not among them: a later, human-sourced figure no validator observes.
  # Decided 2026-10-18 (story:loop-scorecard). Each figure is takt.work.LoopFigure, computed
  # under each definition takt.work.LoopMetric holds.
  # read from: .engineering/planning/story/loop-scorecard.md:57
  # read from: .engineering/planning/story/loop-scorecard.md:102
  # read from: crates/takt/src/loop_scorecard.rs:84-89
  # read from: crates/takt/src/loop_scorecard.rs:1059-1085
  - name: takt.work.LoopScorecard
    kind: struct
    fields:
      - name: rows
        type: List<takt.work.LoopScorecardRow>
        summary: One a recorded improvement turn.

  # One figure of the loop scorecard: a metric under one version of its definition, computed from
  # the rows it names and absent when no row counts towards it; a share prints as
  # `<counted>/<all>`. A version the code does not compute is an error, so a definition cannot
  # name a figure nothing computes. The code computes version 1 of each metric, and version 2
  # of the accepted share: accepted rows over the rows with a verdict, open turns left out. A
  # figure with a target and no value is below target: no data fails closed.
  # `loop.measure` retains the figures it computed as an
  # observation beside its record; the rows stay the source.
  # read from: crates/takt/src/loop_scorecard.rs:667-687
  # read from: crates/takt/src/loop_scorecard.rs:750-816
  - name: takt.work.LoopFigure
    kind: struct
    fields:
      - name: metric
        type: String
      - name: version
        type: Integer
      - name: current
        type: Boolean
        summary: Whether the version is the metric's current definition; a previous one prints beside it.
      - name: value
        type: Optional<Decimal>
      - name: shown
        type: String
      - name: target
        type: Optional<takt.work.LoopTarget>
      - name: below_target
        type: Boolean
      - name: cases
        type: List<takt.work.CaseId>
        summary: The turns the figure was computed from.

  # A loop metric's target: the figure at least, or at most, a value; exactly one of the two, and
  # a finite number (`.nan` or `.inf` is refused when the definitions are read) that the
  # metric's figures can take: a share's 0 to 1 (a metric whose id names a share in any
  # spelling, `ACCEPTED_SHARE`, `promoted_shares`), a count's, token figure's or time's 0 and
  # above.
  # read from: crates/takt/src/loop_scorecard.rs:91-120
  - name: takt.work.LoopTarget
    kind: struct
    fields:
      - name: at_least
        type: Optional<Decimal>
      - name: at_most
        type: Optional<Decimal>

  # One definition of a loop metric: the version the code computes it under, what it is in words,
  # and its target; a metric without a target is never below it.
  # read from: crates/takt/src/loop_scorecard.rs:122-133
  - name: takt.work.LoopMetricDefinition
    kind: struct
    fields:
      - name: version
        type: Integer
      - name: definition
        type: String
      - name: target
        type: Optional<takt.work.LoopTarget>

  # A loop metric as `protocols/loop-improvement/metrics.yaml` (format `takt-loop-metrics/1`)
  # holds it by id: its current definition and the previous ones whose figures print beside it.
  # The file is read at a revision through git, never from the working tree: the baseline's at
  # the case's `loop_baseline` revision once, when the case opens, into its snapshot
  # (takt.work.LoopBaselineSnapshot), which every loop validator reads after; the candidate's at
  # its `loop_candidate` revision. It is
  # a judge surface, as every path outside the allow-list is. Targets are the owner's: a
  # candidate cannot change one through the definition check, which finds any change to a
  # target (its value or its direction) `redefined`, whatever version or previous definitions
  # come with it. The targets, decided
  # by the planner: accepted share and promoted share at least 0.8, the time from finding to
  # verified at most 86400 s; none for the turns, and none yet for the median tokens per accepted
  # turn, set later from the first three accepted turns with a run record.
  # read from: protocols/loop-improvement/metrics.yaml
  # read from: crates/takt/src/loop_scorecard.rs:135-171
  # read from: crates/takt/src/loop_scorecard.rs:636-664
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  - name: takt.work.LoopMetric
    kind: struct
    fields:
      - name: current
        type: takt.work.LoopMetricDefinition
      - name: previous
        type: List<takt.work.LoopMetricDefinition>

  # What `loop.measure` came to, the result of a `loop_measurement` record about `loop_baseline`:
  # `below_target` when a current figure misses its target, or has a target and no value (no
  # data fails closed, and the L2 turn files "no data" for that metric as its finding), else
  # `at_target`, under the baseline's definitions as the case snapshotted them when it opened.
  # Fewer than three recorded turns, no snapshot of `loop_baseline`, or no definitions in it,
  # records nothing. The measurement retains the rows it read beside its figures, so a later
  # comparison stands on them.
  # read from: protocols/loop-improvement/1.yaml:32-36
  # read from: crates/takt/src/loop_scorecard.rs:1218-1226
  - name: takt.work.LoopMeasurementResult
    kind: enum
    variants: [below_target, at_target]

  # What `loop.definition.check` came to, the result of a `definition_check` record about
  # `loop_candidate`, the worst over the baseline's metrics: `unchanged` when each is the
  # candidate's current definition; `dual_reported` when one changed, took another version,
  # kept its target, and keeps the baseline's as a previous one beside every previous one the
  # baseline prints, so the figures of both print; `redefined` when one changed and only the new
  # figure prints (the same version, the baseline's dropped, a previous one the baseline prints
  # dropped or changed, the metric or the file gone), or its target changed. The figures the
  # candidate's definitions name are then computed over the recorded turns: a metric, kept or
  # added, any figure of which the code does not compute is `redefined`, since that figure
  # cannot print; so is every metric when the turns do not read. The baseline's definitions are
  # read only from the snapshot the case took when it opened (takt.work.LoopBaselineSnapshot),
  # never from the object store after a step ran; no snapshot of the case's current
  # `loop_baseline` records nothing. Git does not check a loose object's bytes against the id
  # it is stored under, so every read of the definitions (the snapshot's and the candidate's)
  # and of a baseline's ancestry reads its objects through one `git cat-file --batch` and checks
  # each in takt's own process, computing its id again from its kind and bytes in the
  # repository's object format (SHA-1 with collision detection, as git's SHA-1DC, or SHA-256,
  # its `extensions.objectFormat`), and refuses one whose bytes hash to another id, or are made
  # to collide, naming it. Every read is bounded: an object git reports
  # larger than its cap (a blob, the definitions, 256 KiB; a commit or a tree, 1 MiB), or of
  # another kind, is refused before any of it is read, and a read that takes longer than 10 s
  # (a header that overstates its body, a git that stalls), or past the run's deadline from its
  # hour budget when that comes first (each loop validator passes it down), kills `git
  # cat-file` and is an error naming the object; an observation that returns at or after the
  # run's deadline records nothing. `git cat-file` starts no process of its own (no git takt
  # runs fetches lazily) and stays in takt's process group: one of its own would be taken by
  # the forge's sweep of what a child left behind and killed under a live reader. After an
  # error the reader reads nothing more, and it kills and waits for its process when it is
  # done. Every commit the loop reads, in the validators and when a loop case opens, goes
  # through one checked history per call: no `git log`, `merge-base`,
  # `rev-list`, `rev-parse --verify` or `cat-file -e` answers any part of it; a revision is read
  # only as a full id of the repository's format, and an abbreviated one is refused, naming
  # it. A commit's header is read by git's own
  # rule: its tree first, its parents the `parent` lines directly after it, each line exact, no
  # carriage return stripped, so a `parent` line further down names no parent. The definitions
  # are read commit, tree by tree, blob. An ancestry is answered by walking from the tip through
  # the parents each commit's own checked header names, first parent first, every commit seen
  # once (a cycle a forged commit makes ends the walk), at most 100,000 commits (past them, an
  # error naming the cap; the cap bounds the reads, not the time, and with `--hours` every read
  # ends at the run's deadline); a commit on the way that cannot be read or does not check out is an
  # error naming it, never `false`, so a forged commit can neither add an ancestor nor hide
  # one; a commit the repository is shallow at ends its branch of the walk, and an ancestor not
  # found then is unknown, not an error. The figures come from the code in
  # `crates/takt/src/loop_scorecard.rs`, chosen by each metric's id and version, so the check
  # counts that code as part of the definitions: read at the baseline and at the candidate
  # through the checked history, any difference makes every metric `redefined`. Definitions
  # holding a YAML anchor or alias are refused from the parser's own events, naming the line,
  # before anything is deserialized: an alias expands without bound, and a file well under its
  # cap could expand to gigabytes. So are the turns' `case.yaml`, `protocol.yaml` and `story.yaml`
  # and the loop case's evidence records the loop validators read. The other
  # reads at a revision (the step guard's judge-surface list at the base, `judge_list_at`) still
  # read the object store a step could write unchecked: the checkpoint guards refs, replace
  # refs, `commondir`, `gitdir`, `shallow`, `objects/info/alternates` and the commit-graph, and
  # no git takt runs reads a commit-graph, but the objects themselves are not guarded, and
  # confining the step's writes closes that (story:confinement-seam).
  # read from: protocols/loop-improvement/1.yaml:37-41
  # read from: crates/takt/src/loop_scorecard.rs:1325-1338
  # read from: crates/takt/src/loop_scorecard.rs:1352-1393
  # read from: crates/takt/src/loop_scorecard.rs:192-501
  # read from: crates/takt/src/git.rs:338-742
  - name: takt.work.DefinitionCheckResult
    kind: enum
    variants: [unchanged, dual_reported, redefined]

  # What `loop.compare` came to, the result of a `loop_comparison` record about
  # `loop_candidate`. Due only once the case holds a `merge_observation` of the candidate (the
  # protocol's precondition; nothing is recorded without one; its producer is
  # story:self-improvement-protocol's). The turns whose baseline revision descends from the
  # merged candidate, at least three of them with a verdict (an open turn is not counted toward
  # the three; one whose ancestry a shallow history cannot say is left out, named, and not
  # recorded), against the rows the case's `loop_measurement` of the baseline retained, never
  # recomputed from today's records (a measured turn no longer recorded refuses the comparison,
  # nothing recorded), on the
  # metrics below their target there; `improved` when each is better after in its target's
  # direction, else `not_improved`; the targets are the baseline's as the case snapshotted them
  # when it opened. No measurement retained in the case, or no snapshot, records nothing.
  # read from: protocols/loop-improvement/1.yaml:44-47
  # read from: crates/takt/src/loop_scorecard.rs:1617-1627
  - name: takt.work.LoopComparisonResult
    kind: enum
    variants: [improved, not_improved]

  # The baseline's metric definitions as a loop case snapshotted them when it opened, before any
  # step, into its directory as `loop-baseline.json` (format `takt-loop-baseline/1`): the
  # `loop_baseline` revision as the case names it, the commit it is, and the bytes of
  # `protocols/loop-improvement/metrics.yaml` there, absent when it holds none. The cases
  # directory is guarded around every step, so `loop.measure`, `loop.definition.check` and
  # `loop.compare` judge against the baseline as it stood when the case opened. Nothing is
  # written while `loop_baseline` names no commit. `takt run` opens a `loop.improvement/1` case
  # with its baseline: `--input loop_baseline=<full commit id>`, no case input of the protocol,
  # required for it until story:promotion records promotions (then the latest promotion's
  # revision); a missing value, or one that is not a full commit id (40 or 64 hexadecimal
  # digits) of a commit of the repository, is refused before anything is written, and so is a
  # commit that is not on the base branch the case opens from (a side branch's, or one no
  # branch reaches) and one whose definitions do not read with every object on the way
  # checked (an object planted under another's id, named), and definitions above 256 KiB,
  # which the snapshot would copy whole, naming their size, and definitions that are absent
  # or do not read, which would open a case that never records, naming the reason. Once the
  # case is open, before any
  # step, `loop_baseline` is set to that commit and the snapshot taken, its objects checked
  # the same way; a snapshot that cannot be taken ends the run on an error.
  # read from: crates/takt/src/case.rs:43-168
  # read from: crates/takt/src/case.rs:1944-1957
  # read from: crates/takt-cli/src/main.rs:698-712
  # read from: crates/takt-cli/src/main.rs:845-849
  # read from: crates/takt/src/loop_scorecard.rs:1130-1171
  # read from: crates/takt/src/loop_scorecard.rs:1173-1196
  - name: takt.work.LoopBaselineSnapshot
    kind: struct
    fields:
      - name: revision
        type: takt.work.Revision
      - name: commit
        type: takt.work.Revision
      - name: definitions
        type: Optional<String>

  # A promotion's id. read from: .engineering/planning/design/recursive-self-improvement.md (§ The judge)
  - name: takt.work.PromotionId
    kind: newtype
    of: String

  # How a scenario compares with the same scenario in a saved scorecard, over cases, under the
  # candidate scorecard's rule (takt.work.ScorecardRule), printed first: `regression` when, for
  # some outcome rank, the candidate's cases at that rank or better fall short of the saved share
  # of the candidate's n by more than the margin (at equal n: by more than `margin` cases; each
  # such rank printed with both counts), when the candidate's median of tokens exceeds the saved
  # maximum with the token definition unchanged; else `no_regression`. A scorecard is never a regression
  # against itself; one case lowered is within a margin of one, two cases lowered in one scenario
  # never are. Decided 2026-10-18 (story:promotion). The rule's trials apply as a promotion
  # applies them (story:scorecard-against-needs-the-trials, decided 2026-10-19, and its review):
  # a scenario the saved scorecard has with fewer cases than the trials, and any scenario with
  # fewer on the candidate's side, none included, gets neither; it is printed as `too few cases
  # on the saved side (<n> of <trials>)` or `too few cases (<n> of <trials>)`, and the
  # comparison ends in a refusal naming each such scenario.
  # read from: .engineering/planning/design/recursive-self-improvement.md:130-138
  # read from: crates/takt/src/scorecard.rs:974-990
  # read from: crates/takt/src/scorecard.rs:1096-1120
  # read from: crates/takt/src/scorecard.rs:1143-1171
  # read from: crates/takt/src/scorecard.rs:1046-1070
  # read from: crates/takt/src/scorecard.rs:1176-1181
  - name: takt.work.Comparison
    kind: enum
    variants: [no_regression, regression]

  # A finding's key, the `<key>` of its reference `finding:<key>` in the planning store:
