      - name: paths
        type: List<String>
      - name: revision
        type: Optional<takt.work.Revision>

  # An evidence record a validator wrote under the case: its id, kind and result, and its path
  # relative to the tree.
  # read from: crates/takt/src/events.rs:123-131
  # read from: crates/takt/src/run.rs:4295-4308
  - name: takt.work.RunEvidence
    kind: struct
    fields:
      - name: id
        type: takt.work.EvidenceId
      - name: kind
        type: takt.work.EvidenceKindId
      - name: result
        type: Optional<String>
      - name: path
        type: String

  # A `test_result` record written on the story in the planning store through `aep plan artifact
  # evidence`, source takt, actor `agent:takt`: the reference is the case's record a validator of
  # the case wrote, the instant that record's own `observed_at`, and the commit on the case's
  # branch that holds it. The line is written with the commit, which a line that cannot be
  # written takes back; a write kept under the case's current revision and committed above it
  # is not made again, and one of an earlier revision is made again for the current one. The
  # instant given to the store is `observed_at`, apart from
  # the line's own `at`, which it would otherwise shadow.
  # read from: crates/takt/src/events.rs:132-143
  # read from: crates/takt/src/run.rs:3590-3653
  # read from: crates/takt/src/run.rs:3829-3868
  # read from: crates/takt/src/frontier.rs:247-251
  # read from: crates/takt/src/frontier.rs:320-332
  - name: takt.work.RunStoreEvidence
    kind: struct
    fields:
