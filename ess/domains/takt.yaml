      # kept by the rules the scope files are kept by, read at the step's `HEAD` and on disk, the
      # instruction files counted against the same 8 files and 64 KiB, each file costing what metaharness charges for it, its bytes and
      # its path as a JSON string with the quotes; and only a file of UTF-8 text with no NUL that
