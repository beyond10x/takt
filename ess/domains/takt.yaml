  # such rank printed with both counts), when the candidate's median of tokens exceeds the saved
  # maximum with the token definition unchanged; else `no_regression`. A scorecard is never a regression
  # against itself; one case lowered is within a margin of one, two cases lowered in one scenario
  # never are. Decided 2026-10-18 (story:promotion). The rule's trials apply as a promotion
  # applies them (story:scorecard-against-needs-the-trials, decided 2026-10-19, and its review):
