  # test failed, ...` and `error: <n> targets failed:` lines. A located finding at a file is one:
  # `<place>:<n>:` with an optional `<n>:`, or tsc's and MSVC's `<place>(<n>)` or
  # `<place>(<n>,<n>):`, then a space and a message that names a failure. Such a message opens
  # with a word in lower case ending in `:` (`error:`, `unresolved:`; not a remark or a log
  # level such as `warning:` or `note:`), with `error[<code>]`, with a linter's code (one to four
  # capitals, then one to four digits: `F401`, `TS2322`), or with a word in lower case before
  # `error:` (`fatal error:`) or before such a code ending in `:` (tsc's `error TS2322:`). So are
  # black's and ruff's `would reformat <path>` (`Would reformat: <path>`) and rustfmt's `Diff in
  # <path> at line <n>:` or `Diff in <path>:<n>:`. A linter's code line (`<code> ...`, not
  # indented, ruff's full format) and the indented ` --> <path>:<line>[:<col>]` line after it
  # are kept together or counted as two left out. A line located at a host, not a file, with
  # one number (its port) and a message that opens with `error:` or a word in lower case before
  # it, is counted as left out and never kept, and with a message of another kind is not
  # failing. A host is `localhost`, an IPv4 address, a name of letters, digits, `-` and `.`
  # whose last part is one of 14 top-level domains and reserved names (`com`, `io`, `internal`,
  # `example` among them; not `dev` or `app`), or a user's at a host's name
  # (`deploy@db.example.com`); before one number, also a name of three parts or more whose last
  # is letters, under any domain (`db.corp.example.de`). A file's path holds a `/`, or ends in an
  # extension that starts with a letter and is no host's, or is a name without one that starts
  # with a capital, holds a small letter, is of letters, digits, `_` and `-`, and ends in `file`
  # (`Dockerfile`, `Makefile`).
  # A gate that passes keeps nothing.
  # A failed `tests.run` keeps one check too, its id `tests.run`: the test command's lines that
  # name each failing test and its last error line (`failing_lines`), bounded as a gate's. It
  # keeps none when no line was kept or left out. Each observation of `tests.run` drops what an
  # earlier one kept, and the check is taken once.
