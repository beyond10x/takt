  # version 1 summed such a step as 0, and `step_tokens` at version 2, where version 1 counted a
  # harness step's 0: a takt that knows version 1 refuses a scorecard saved under version 2, and
  # a stored baseline saved under version 1 is compared only after `takt promote --rebaseline`
