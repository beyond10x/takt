  # How a scenario compares with the same scenario in a saved scorecard, over cases, under the
  # candidate scorecard's rule (takt.work.ScorecardRule), printed first: `regression` when, for
  # some outcome rank, the candidate's cases at that rank or better fall short of the saved share
  # of the candidate's n by more than the margin (at equal n: by more than `margin` cases; each
  # such rank printed with both counts), when the candidate's median of tokens exceeds the saved
  # maximum with the token definition unchanged; else `no_regression`. A scorecard is never a regression
  # against itself; one case lowered is within a margin of one, two cases lowered in one scenario
  # never are. Decided 2026-10-18 (story:promotion). The rule's trials apply as a promotion
  # applies them (story:scorecard-against-needs-the-trials, decided 2026-10-19, and its review):
  # a scenario the saved scorecard has with fewer cases than the trials, and any scenario with
  # fewer on the candidate's side, none included, gets neither; it is printed as `too few cases
  # on the saved side (<n> of <trials>)` or `too few cases (<n> of <trials>)`, and the
  # comparison ends in a refusal naming each such scenario.
  # Decided 2026-10-19 (story:the-judge-requires-the-whole-corpus): the comparison covers the
  # corpus, every scenario either side has, so a missing or empty scenario is never
  # `no_regression`. A scenario the saved scorecard lacks, however many its cases, gets neither
  # and is printed `not in the saved scorecard`; a scenario the candidate lacks has none of its
  # cases, too few; and with no scenario case on either side there is no corpus, and the
  # comparison is refused before any scenario. Each ends in a refusal naming the scenario, for
  # `takt scorecard --against`, the `scorecard.compare` validator and `takt promote` alike; a
  # promotion's baseline gains a scenario only through a rebaseline (takt.work.PromotionKind).
