        type: takt.work.StoryId
      - name: kind
        type: takt.work.EvidenceKindId
      - name: reference
        type: String
      - name: observed_at
        type: Timestamp
      - name: commit
        type: Optional<takt.work.Revision>

  # The story moved in the planning store through `aep plan artifact move`, to `implemented`, as
  # `agent:takt`, and the commit on the case's branch that holds the move, written with it as
  # above; not made when the story at the case's current revision is already `implemented`
  # (moved below it at an earlier revision), which counts as the move written.
  # read from: crates/takt/src/events.rs:144-151
  # read from: crates/takt/src/run.rs:3677-3693
  - name: takt.work.RunStoreMove
    kind: struct
    fields:
      - name: story
        type: takt.work.StoryId
      - name: to
        type: takt.work.StoryStatus
      - name: commit
        type: Optional<takt.work.Revision>

  # A refusal: `by` is `takt`, a step the kernel discarded (one that wrote into the cases
  # directory, or onto the judge surface, anywhere under `.engineering/` but the cases among it,
  # as git or the snapshot sees it, among them) or a write it would not make, or `store`, the
  # planning store's refusal; the
  # reason verbatim. A refusal of the store is relayed, never retried, and leaves the stop as
  # the case reached it.
  # read from: crates/takt/src/events.rs:22-25
  # read from: crates/takt/src/events.rs:152-154
  # read from: crates/takt/src/run.rs:3870-3879
  # read from: crates/takt/src/run.rs:4439-4497
  # read from: crates/takt/src/run.rs:4721-4731
  - name: takt.work.RunRefusal
    kind: struct
    fields:
      - name: by
        type: String
      - name: reason
        type: String

  # The run pauses on the forge for `seconds`, then observes the actions `on` again.
  # read from: crates/takt/src/events.rs:155-156
  # read from: crates/takt/src/run.rs:4366-4372
  - name: takt.work.RunWait
    kind: struct
    fields:
      - name: on
        type: List<takt.work.ActionId>
      - name: seconds
        type: Decimal

  # An error as it was reported: the one a run ended on (a panic in the loop among them, recorded
  # before the panic goes on and the case is let go), or one met while recording an accepted
  # case in the store (an `events.jsonl` line that does not read, an `out` that fails), after
  # which the run keeps its stop and records it next.
  # read from: crates/takt/src/run.rs:3514-3537
  # read from: crates/takt/src/events.rs:157-159
  # read from: crates/takt/src/run.rs:3538-3553
  # read from: crates/takt/src/run.rs:3560-3579
  - name: takt.work.RunError
    kind: struct
    fields:
      - name: error
        type: String

  # The line `line`, counted from 1, was cut short, without its end, and is skipped on read;
  # written with the next event, which ends the torn line first.
  # read from: crates/takt/src/events.rs:160-162
  # read from: crates/takt/src/events.rs:201-232
  - name: takt.work.RunSkipped
    kind: struct
    fields:
      - name: line
        type: Integer
      - name: reason
        type: String

  # The run stopped: the stop as printed, the steps taken and the tokens reported.
  # read from: crates/takt/src/events.rs:163-168
  # read from: crates/takt/src/run.rs:3580-3587
  - name: takt.work.RunStopped
    kind: struct
    fields:
      - name: stop
        type: String
      - name: steps
        type: Integer
      - name: tokens
        type: Integer

  # Where a `workflow/1` document is: the `--workflow <file>` argument, or the repository default
  # `.engineering/workflow.yaml`. Not built: the kernel reads neither yet (milestone M3).
  # read from: docs/design/takt.md:35
  # read from: docs/design/takt.md:74
  - name: takt.work.WorkflowPath
    kind: newtype
    of: String

  # The `protocol` block of a workflow: which protocol the case runs under, by name and major
  # revision (the design's example writes the two together, `software.change/1`), and the case
  # inputs given to it. Not built; today the same things reach the kernel as `--protocol` and
  # `--input`, and the loaded protocol keeps name and major apart.
  # read from: docs/design/takt.md:55
  # read from: crates/takt/src/run.rs:31-37
  # read from: crates/takt/src/protocol.rs:14-17
  - name: takt.work.ProtocolBlock
    kind: struct
    fields:
      - name: id
        type: takt.work.ProtocolName
      - name: revision
        type: Integer
        summary: The protocol's major revision, the `1` of `software.change/1`.
      - name: inputs
        type: Map<takt.work.InputId, String>

  # A deterministic `step` block: one protocol action and the program that performs it. Not built
  # as a block; five such steps exist in code: the `tests.run` validator, whose argv is
  # `--test-cmd` split at white space; the `gate.run` validator over the gates document `--gates`
  # names, taken from the case's base commit; `pr.open`, `ci.read` and `repository.merge` through
  # the forge, the last admissible only under a recorded grant at the case's revision.
  # read from: crates/takt/src/validator.rs:1468
  # read from: crates/takt/src/validator.rs:936
  # read from: crates/takt/src/validator.rs:1263
  # read from: crates/takt/src/validator.rs:516
  # read from: docs/design/takt.md:56
  # read from: crates/takt/src/validator.rs:240-242
  # read from: crates/takt-cli/src/main.rs:333-335
  - name: takt.work.DeterministicStep
    kind: struct
    fields:
      - name: action
        type: takt.work.ActionId
      - name: argv
        type: List<String>

  # A judgement `step` block: the protocol actions the harness may choose among, and the brief it
  # is given. Not built as a block; today the actions offered are computed each iteration (the
  # admissible actions no validator owns) and the brief is the intent.
  # read from: docs/design/takt.md:57
  # read from: crates/takt/src/run.rs:4016-4026
  # read from: crates/takt/src/harness.rs:19-20
  - name: takt.work.JudgementStep
    kind: struct
    fields:
      - name: actions
        type: List<takt.work.ActionId>
      - name: brief
        type: String

  # A `step` block of a workflow, one of the two kinds. Not built.
  # read from: docs/design/takt.md:56-57
  - name: takt.work.StepBlock
    kind: union
    tag: kind
    variants:
      deterministic: takt.work.DeterministicStep
      judgement: takt.work.JudgementStep

  # The forge a run opens its pull request through. `bot` is the repository's bot route: the
  # `b10x-gates` binary pushes the branch and opens the pull request under its own credential
  # (takt never holds a token), `gh` reads the state, the head and the checks, and the merge goes
  # through `b10x-gates` with the head sha so a head that moved is refused; `none` opens
  # nothing and registers none of the three forge validators. The bot route is a GitHub forge: the
  # origin URL names a host and a repository, `bot` is the default only when the host is github.com
  # (compared case-insensitively), and `--forge bot` on another host is refused before any case
  # is opened. A remote URL is shown without its userinfo wherever takt prints one.
  # read from: crates/takt/src/forge.rs:271-302
  # read from: crates/takt/src/forge.rs:1155
  # read from: crates/takt/src/forge.rs:818-827
  # read from: crates/takt/src/forge.rs:1205
  - name: takt.work.ForgeName
    kind: enum
    variants: [bot, none]

  # What a pull request is, as the forge reports it and as a `pull_request` record's result.
  # read from: crates/takt/src/forge.rs:28-38
  - name: takt.work.PullRequestState
    kind: enum
    variants: [open, merged, closed]

  # What the checks on a pull request's head report, as a `ci_result` record's result; `pending`
  # writes no record. `gh` answering "no checks reported" for a head with no check run yet is
  # read as pending (its message as of gh 2.100.0, not yet verified live).
  # read from: crates/takt/src/forge.rs:823
  # read from: crates/takt/src/forge.rs:55-66
  - name: takt.work.ChecksState
    kind: enum
    variants: [pass, fail, pending]

  # A case branch's name, `takt/<case id>`.
  # read from: crates/takt/src/case.rs:25-26
  - name: takt.work.BranchName
    kind: newtype
    of: String

  # A scenario's id in the scratch repository's scenario list. Declared ahead of the code that
  # reads it.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scenario corpus)
  - name: takt.work.ScenarioId
    kind: newtype
    of: String

  # A saved scorecard's id: the revision of takt under test that names its file,
  # `scorecard-<revision>.json`, a commit id; a file there already is not overwritten.
  # read from: .engineering/planning/design/recursive-self-improvement.md (§ Scorecard)
  # read from: crates/takt/src/scorecard.rs:807-841
  - name: takt.work.ScorecardId
    kind: newtype
    of: String

  # The rule a comparison applies, recorded with the scorecard so a saved file says what it was
  # judged under and a change to the rule is a change to a judge surface: the cases a scenario
  # needs on the candidate's side (`trials`, 5) and the cases it may fall short by at any outcome
  # rank before it is worse (`margin`, 1). Decided 2026-10-18 (design:recursive-self-improvement
  # § Scorecard); a file saved before the rule had fields reads with the default.
  # read from: .engineering/planning/design/recursive-self-improvement.md:130-138
  # read from: crates/takt/src/scorecard.rs:302-319
  # read from: crates/takt/src/scorecard.rs:335-338
  - name: takt.work.ScorecardRule
    kind: struct
    fields:
      - name: trials
        type: Integer
      - name: margin
        type: Integer

  # What named a saved scorecard: the revision of takt under test, as the operator gave it
  # (`takt scorecard --save --revision`), or `HEAD` of a repository, as a caller of the library
  # gave it; `takt scorecard` never names a file by a repository's `HEAD`.
  # read from: crates/takt/src/scorecard.rs:78-87
  - name: takt.work.ScorecardNaming
    kind: enum
    variants: [build, head]

  # One run's figures on a scorecard: the case; the scenario, from a case id
  # `scenario-<id>-trial-<n>` only; the outcome (for a scenario run `failed` when its held-out
  # check did not pass, else its stop); its own stop (a `Completed` stop's outcome, else the
  # stop's kind, `error` for a run that ended on one, `unfinished` for one with neither); the steps, the
  # highest step number of its lines; the tokens, the sum of those the harness reported on its
  # `step` lines; its `refusal` lines; 1 when it stopped `NoProgress`; its `error` lines; the
  # milliseconds from its first instant to its last; and whether a sum stopped at the largest
  # integer. A run spans one `opened` line to its `stop`, or to the next `opened` or the end of
  # the record; a `skipped` line is no instant of any run.
  # The binary the run was made with, as stated beside its record (takt.work.RunBinary), on each
  # run of a case whose directory holds a `binary.txt`; absent otherwise.
  # read from: crates/takt/src/scorecard.rs:89-132
  # read from: crates/takt/src/scorecard.rs:350-355
  # read from: crates/takt/src/scorecard.rs:496-538
  # Decided 2026-10-19 (story:scorecard-outcome-from-held-out-check): a scenario run's outcome
  # comes from the held-out check the runner wrote beside its record (takt.work.HeldOut), never
  # from the run's own record. Every run of a scenario case carries the case's result; one that
  # did not pass scores the run `failed`, ranked with an error, and a pass leaves the run's stop
  # as its outcome. The stop is kept beside the outcome (`stop`, empty on a file saved before
  # it), printed beside it, and a run whose stop claims a completion while the check did not pass
  # is named as a disagreement. A scenario case with runs and no `held-out.txt`, or one that does
  # not read or states no result, refuses the scorecard naming the case; a case that is no
  # scenario needs none. The outcome metric's definition is at version 2. Each run also carries
  # the revision its `opened` line names (`opened_binary`: what `takt --version` printed,
  # `<sha>`, `<sha>-dirty` or `unknown revision`), absent when the line names none
  # (story:promote-binds-scorecard-and-merge).
  # read from: crates/takt/src/scorecard.rs:134-169
  # read from: crates/takt/src/scorecard.rs:608-690
  # read from: .engineering/planning/story/scorecard-outcome-from-held-out-check.md (§ Outcome)
  - name: takt.work.ScorecardRow
    kind: struct
    fields:
      - name: case
        type: takt.work.CaseId
      - name: scenario
        type: Optional<takt.work.ScenarioId>
      - name: outcome
        type: String
      - name: steps
        type: Integer
      - name: tokens
        type: Integer
      - name: refusals
        type: Integer
      - name: no_progress
        type: Integer
      - name: errors
        type: Integer
      - name: wall_ms
        type: Integer
      - name: saturated
        type: Boolean
      - name: binary
        type: Optional<takt.work.RunBinary>
      - name: stop
        type: String
      - name: held_out
        type: Optional<takt.work.HeldOut>
      - name: opened_binary
        type: Optional<String>

  # The held-out check's result for a scenario case, as the runner wrote it after the run in
  # `.engineering/cases/<case>/held-out.txt`, beside the record and never by the takt binary under
  # judgement: whether it passed (a first line `PASS`) and its first line verbatim (`PASS`,
  # `FAIL: <reason>`, `no pull request`); every further line is a note and not read. Decided
  # 2026-10-19 (story:scorecard-outcome-from-held-out-check).
  # Limit, stated 2026-10-19: the takt binary under judgement runs as the same user as the
  # runner and can write into the case directory, so it can plant a `held-out.txt` itself. The
  # scorecard cannot tell who wrote the file; a planted one is refused only because it exists
  # first: the runner writes the file after the run and refuses one that already exists.
  # A saved scorecard with a run whose outcome is not what its held-out result makes it
  # (`failed` unless it passed, else the run's stop), as a hand edit leaves it, is refused on
  # load naming the run (review of 2026-10-19); whether a run passed is derived from its `result`,
  # and a saved `passed` that disagrees with it is refused the same way; so is a run whose
  # `scenario` is not the one its case id names, the scenario being derived from the case id.
  # read from: crates/takt/src/scorecard.rs:50-58
  # read from: crates/takt/src/scorecard.rs:142-169
  # read from: crates/takt/src/scorecard.rs:843-905
  - name: takt.work.HeldOut
    kind: struct
    fields:
      - name: passed
        type: Boolean
      - name: result
        type: String

  # Who stated a run's binary, or a record's revision, when the binary could not: the operator,
  # in a `binary.txt` beside the run's record or by `takt promote --revision`, for a binary whose
  # `--version` names no revision; or the run's record itself, which no record does today. A
  # statement is marked as such wherever it is copied, so a reader tells it from a measurement.
  # read from: crates/takt/src/scorecard.rs:171-179
  - name: takt.work.StatedBy
    kind: enum
    variants: [operator, record]

  # The binary a run was made with, as stated rather than measured: its sha256, lower-case hex;
  # who stated it; and the operator's note. The operator writes
  # `.engineering/cases/<case>/binary.txt` beside the run's record, its first line
  # `<path>\t<sha256>` (the path as written, `~` and all; only the digest is read) and every
  # further line the note, copied verbatim; a file without a note is accepted, and one that does
  # not read or whose first line is no `<path>\t<sha256>` leaves its case's runs stating no
  # binary and lists the case in the scorecard's `no_record`, the reason in its `unstated`,
  # every other case read as without it, never the scorecard refused. `takt scorecard` reads it
  # onto each run of the case and saves it with the row, never a figure from it; `takt promote
  # --baseline-only --binary-sha256` checks each run's digest against the binary it hashes.
  # read from: crates/takt/src/scorecard.rs:1-35
  # read from: crates/takt/src/scorecard.rs:60-64
  # read from: crates/takt/src/scorecard.rs:181-190
  # read from: crates/takt/src/scorecard.rs:201-227
  # read from: crates/takt/src/scorecard.rs:608-690
  - name: takt.work.RunBinary
    kind: struct
    fields:
      - name: sha256
        type: String
      - name: stated_by
        type: takt.work.StatedBy
      - name: note
        type: String

  # One run of the scorecard a stated baseline read, copied into the promotion record with the
  # binary it states (takt.work.RunBinary): the digest, who stated it and the operator's note.
  # read from: crates/takt/src/promotion.rs:204-212
  - name: takt.work.RecordedRun
    kind: struct
