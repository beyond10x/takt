  # `applies_when` could not be answered), and `not_yet_run` when no observation of the gate was
  # made at this revision, whatever an earlier revision's was. Printed with spaces (`not
  # applicable`, `not yet run`) in the prompt, the run's last line and the report, with the
  # underscore in the record. Pass and `not_applicable` are met; the rest are not.
