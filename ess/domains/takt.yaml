  # request for that action, revalidated as a validator's is, and hands it to the choice effect,
  # which writes each choice record the case still lacks through the case's evidence port under
  # the producer `takt.choice`. It performs that one action and no other, a request for another
  # refused with the run ended, and answers `Performed` naming the records it wrote; a step whose
  # choice records the case already holds asks for none. A choice record attests which action
  # the harness took at a revision, never an observation's outcome.
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/effect.rs:40-77
  # read from: crates/takt/src/validator.rs:1146-1196
  # read from: crates/takt/src/run.rs:13563-13624
  - name: takt.work.ChoiceEffect
    naming:
