  # Amended 2026-10-19 (review F1): a rebaseline adding a scenario had started a new series.
  # read from: .engineering/planning/story/promotion-judged-against-the-series-baseline.md (§ Outcome)
  # read from: crates/takt/src/promotion.rs:2709-2821
