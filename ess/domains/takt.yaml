  # A validator as an effect port of Commission's runtime (ADR 0099): every deterministic step is
  # one action request the runtime of loom-sdk makes for the validator's action and hands to it
  # only after revalidating it against the case's current revision and frontier and, where the
  # action requires a capability, the authority provider's allow; only the runtime makes such a
  # request. It performs its validator's one action and no other, and answers what the step did:
  # `Performed` when the observation wrote a record, `Pending` when it wrote none and waits,
  # `Refused` when it wrote none and does not, and `Refused` ending the run when the step was
  # refused (the step guard, the story's records missing before a granted step, the hour budget).
  # Inside it are what the loop held around the observation before: the story's records written
  # to the store before the step a grant authorises, and the step guard (the cases directory, the
  # tree, `.git`, the judge surface, what cargo, rustup and Python read outside the tree) around
  # the observation. A grant is checked again inside the effect: the merge validators merge only
  # under a grant of their capability at the case's revision, whatever the authority provider
  # allows. The runtime's observations of the request and of the effect's answer are kept in the
  # case's `observations.json`.
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/effect.rs:1-6
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/effect.rs:40-77
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/ports/effect.rs:107-121
  # read from: loom-sdk 0.31.0, crates/loom-commission/src/runtime.rs:708-733
  # read from: crates/takt/src/validator.rs:1087-1138
  # read from: crates/takt/src/run.rs:1207-1225
  - name: takt.work.ValidatorEffect
    naming:
      summary: >-
        A validator as an effect port of Commission's runtime: the one action it performs for an
        admitted request, under the name of the validator it hands the request to.
    identity:
      name: producer
      type: takt.work.ProducerName
    fields:
      - name: action
        type: takt.work.ActionId
    relations:
      # The validator the effect hands each admitted request to.
      - name: validator
        kind: references
        target: takt.work.EvidenceProducer
        cardinality: one
        via: producer
    # Made for one step and dropped after it; nothing moves it.
    lifecycle:
      initial: Ready
      states: [Ready]
      terminal: [Ready]

  # A choice as an effect port of Commission's runtime: after a judgement step that took an action
