  # The forge a run opens its pull request through. `bot` is the repository's bot route: the
  # `b10x-gates` binary pushes the commit scanned, by its id as `<id>:refs/heads/<branch>`, never
  # the branch's name, to the repository's HTTPS URL (from `origin` when the run starts) and never
  # to a remote's name, so no push moves a tracking ref, with no tag and no submodule's commit
  # (`--no-follow-tags`, `--recurse-submodules=no`), and opens the pull request under its own
  # credential (takt never holds a token) after its `scan-text` passed, under the same policy, what
  # the push would publish: the object set it sends, every object of the head pushed that the
  # repository's base holds, as the remote's tracking ref of the case's base says (read by its full
  # name, and used only while the repository's own base, read through the bot route by a dry-run
  # fetch, is at the same commit; at another the push is refused, naming both; with no tracking ref
  # or no base on the repository, every object of the head; no other ref counts), each read raw as
  # the push sends it, whatever `refs/replace/` holds: every commit object's bytes unconverted
  # (every header, the encoding's and a signature's included, then the message), every entry name of
  # every tree object and every path each commit's tree holds, in full from its root as gates reads
  # a path (`filename:<path>`, so a literal holding a `/` is read whole), a gitlink's and an empty
  # tree's included, every blob whole and, when it starts with a UTF-16 or UTF-32 byte-order mark,
  # decoded as well; and, when a pull request is opened, its title and body. A tree entry in a mode
  # git does not write (git's five: 100644, 100755, 120000, 40000, 160000) is refused naming its
  # path and mode, and a head that is not a commit (an annotated tag the branch names) is refused
  # before the scan. More than one scan is given (32 MiB), objects and paths counted alike, is read
  # no further and refused, never cut. A step cannot make or move any ref (the checkpoint guards
  # every ref), so a step that runs `git stash` or `git notes` is refused, nor set the `push.*`,
  # `http.*` or `i18n.*` keys, and takt does not commit a nested repository a step left as a gitlink
  # `HEAD` does not have. Known limits: a file in Latin-1 or another encoding without a byte-order
  # mark is scanned as its bytes alone; and a ref another session in the same repository makes
  # during a step (`refs/stash`, a note) is taken for the step's and put back, that is removed, as a
  # tag already was; a branch another worktree has checked out is not guarded. The push is held to
  # HTTPS as git's one transport, so a rewrite in the repository's configuration acts after the scan
  # and to HTTPS only, and one that would send it over another transport is refused naming it; `gh`
  # reads the state, the head and the checks, and the merge goes through `b10x-gates` with the head
  # sha so a head that moved is refused; `none` opens nothing and registers none of the three forge
  # validators. The bot route is a GitHub forge: the origin URL names a host and a repository, `bot`
  # is the default only when the host is github.com (compared case-insensitively), and `--forge bot`
  # on another host is refused before any case is opened. A remote URL is shown without its userinfo
  # wherever takt prints one.
  # read from: crates/takt/src/forge.rs:308-344
  # read from: crates/takt/src/forge.rs:1774
  # read from: crates/takt/src/forge.rs:899-908
  # read from: crates/takt/src/forge.rs:1857
  # read from: crates/takt/src/forge.rs:1633-1664
  # read from: crates/takt/src/forge.rs:880
  # read from: crates/takt/src/forge.rs:1208-1215
  # read from: crates/takt/src/forge.rs:1261
  # read from: crates/takt/src/forge.rs:1326-1334
  # read from: crates/takt/src/forge.rs:1378-1581
  # read from: crates/takt/src/git.rs:101-148
  # read from: crates/takt/src/forge.rs:943-944
  # read from: crates/takt/src/git.rs:1702
  # read from: crates/takt/src/forge.rs:1314-1316
  # read from: crates/takt/src/git.rs:1408-1413
  # read from: crates/takt/src/git.rs:1051-1054
  # read from: crates/takt/src/forge.rs:953-964
  # read from: crates/takt/src/forge.rs:1296-1305
  # read from: crates/takt/src/git.rs:167-254
  # read from: crates/takt/src/forge.rs:1408-1463
  # read from: crates/takt/src/forge.rs:1398-1448
  # read from: crates/takt/src/forge.rs:1470-1492
  # read from: crates/takt/src/forge.rs:975-1047
  # read from: crates/takt/src/forge.rs:1613-1622
  - name: takt.work.ForgeName
    kind: enum
    variants: [bot, none]

